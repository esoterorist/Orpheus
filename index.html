<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orpheus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Michroma&display=swap" rel="stylesheet">
<style>
/* ORPHEUS — styles. One theme: an instrument panel after hours. */
:root {
  color-scheme: dark;

  --bg: #000;
  --ink: #d9d9d3;
  --mid: #a3a39b;
  --dim: #77776f;
  --faint: #45453f;
  --hair: rgba(255, 255, 255, .11);
  --hair-2: rgba(255, 255, 255, .2);
  --wash: rgba(217, 217, 211, .07);
  --red: #ff3a22;
  --red-glow: rgba(255, 58, 34, .55);

  --f-disp: 'Michroma', 'Eurostile', 'Microgramma', 'Square 721', 'Inter', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;

  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --stage: min(calc(100vw - var(--gut-l) - var(--gut-r)), 46vh);
  --row: 32px;
}
@supports (height: 1dvh) {
  :root { --stage: min(calc(100vw - var(--gut-l) - var(--gut-r)), 46dvh); }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 400 11px/1.4 var(--f-mono);
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
body { background-color: var(--bg); }

button, select, input { font: inherit; color: inherit; margin: 0; }
button { -webkit-tap-highlight-color: transparent; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

:focus-visible { outline: 1px solid var(--red); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }

.led {
  display: inline-block; flex: none;
  width: 5px; height: 5px; border-radius: 50%;
  border: 1px solid var(--faint); background: transparent;
  transition: background-color .25s, border-color .25s, box-shadow .25s;
}
.led.on { background: var(--red); border-color: var(--red); box-shadow: 0 0 5px var(--red-glow); }

/* ---------- frame ---------- */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-block: env(safe-area-inset-top, 0px) 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 100vw;
  overflow: hidden;
}

/* ---------- header ---------- */
#hdr {
  flex: none; height: 44px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.wordmark {
  font: 400 12px/1 var(--f-disp); letter-spacing: .35em; color: var(--ink);
  white-space: nowrap; margin-right: -.35em;
}
.hdr-r { display: flex; align-items: center; flex: none; margin-right: -8px; }
#clock { color: var(--dim); font-size: 11px; letter-spacing: .04em; margin-right: 6px; }
.hbtn {
  height: 44px; min-width: 40px; padding: 0 8px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 400 11px/1 var(--f-mono); letter-spacing: .08em; color: var(--dim);
  transition: color .2s;
}
.hbtn:hover { color: var(--ink); }
.hbtn[aria-pressed="true"], .hbtn[aria-expanded="true"] { color: var(--ink); }
#sleep-time { color: var(--red); margin-left: 6px; }
.hbtn.running { color: var(--ink); }

/* ---------- status ---------- */
#status {
  flex: none; height: 22px;
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; color: var(--ink); white-space: nowrap; overflow: hidden;
  border-top: 1px solid var(--hair);
}
#status > * { flex: none; }
.st-dim { color: var(--dim); }
.st-sep { display: inline-block; width: 1px; height: 9px; margin: 0 3px; background: var(--hair-2); }
#st-evt-name:empty { display: none; }
#st-name { min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
#st-evt { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); }
#st-evt-name { letter-spacing: .04em; }
#st-bpm-wrap { display: inline-flex; gap: 7px; color: var(--dim); }

/* ---------- stage ---------- */
#stage { flex: none; display: flex; flex-direction: column; min-width: 0; }
#stage-wrap { position: relative; width: 100%; height: var(--stage); }
#orrery {
  position: absolute; inset: 0;
  display: block; width: 100%; height: 100%;
  touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; cursor: crosshair;
  transition: opacity .9s ease;
}

#log {
  flex: none; height: 52px; padding: 2px 0 2px;
  display: flex; flex-direction: column; justify-content: flex-end;
  overflow: hidden; cursor: pointer;
  border-top: 1px solid var(--hair);
  transition: height .25s ease;
}
#log.tall { height: 166px; }
#log.dock { height: auto; flex: none; cursor: default; padding: 0 0 2px; margin-top: 4px; }
#log.dock::before {
  content: 'LOG'; display: flex; align-items: center; height: 30px; margin-bottom: auto;
  font: 400 9px/1 var(--f-disp); letter-spacing: .16em; color: var(--dim);
}
.lg { display: flex; gap: 10px; height: 16px; line-height: 16px; font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; }
.lg .t { flex: none; width: 6.2ch; }
.lg .k { flex: none; width: 3ch; }
.lg .x { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.lg.n1 { color: var(--dim); }
.lg.n0 { color: var(--ink); }
.lg.n0 .t, .lg.n0 .k { color: var(--dim); }
.lg.nil { color: #26261f; }

#ribbon-wrap { position: relative; flex: none; height: 56px; margin: 0 0 8px; border: 1px solid var(--hair); }
#ribbon { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; -webkit-user-select: none; user-select: none; }
.rb-label {
  position: absolute; left: 8px; top: 7px; pointer-events: none;
  font: 400 8px/1 var(--f-disp); letter-spacing: .2em; color: var(--dim);
}
#rb-read { position: absolute; right: 8px; top: 5px; pointer-events: none; font-size: 11px; color: var(--ink); }

/* ---------- panel ---------- */
#panel { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--hair); }
#tabs { flex: none; display: flex; border-bottom: 1px solid var(--hair); }
.tab {
  position: relative; flex: 1 1 0; min-width: 0; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font: 400 10px/1 var(--f-disp); letter-spacing: .14em; padding-left: .14em;
  color: var(--dim); transition: color .2s;
}
.tab:hover { color: var(--mid); }
.tab::after {
  content: ''; position: absolute; bottom: -1px; left: calc(50% - 12px); width: 24px; height: 1px;
  background: var(--red); opacity: 0; transition: opacity .2s;
}
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { opacity: 1; }
#pages { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
.page { padding: 4px 0 calc(24px + env(safe-area-inset-bottom, 0px)); }

/* group header: LABEL ———— */
.grp {
  display: flex; align-items: center; gap: 10px;
  height: 30px; margin-top: 10px;
  font: 400 9px/1 var(--f-disp); letter-spacing: .16em; color: var(--dim);
}
.grp::after { content: ''; flex: 1 1 auto; height: 1px; background: var(--hair); }
.grp:first-child { margin-top: 2px; }
.grp .gx { font: 400 10px/1 var(--f-mono); letter-spacing: .04em; color: var(--faint); order: 2; }

/* parameter row: LABEL  [bar]  064 */
.row {
  display: grid; grid-template-columns: 78px minmax(0, 1fr) 66px; column-gap: 12px;
  align-items: center; height: var(--row);
}
.row > label, .row > .lbl {
  font-size: 10.5px; letter-spacing: .06em; color: var(--mid);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row output { display: grid; grid-template-columns: minmax(0, 1fr) 24px; align-items: baseline; font-size: 11px; color: var(--ink); white-space: nowrap; }
.row output b { text-align: right; font-weight: 400; }
.row output u { text-decoration: none; font-size: 9px; color: var(--dim); padding-left: 4px; letter-spacing: .02em; }
.row.off { opacity: .32; }
.row.off input { pointer-events: none; }

.bar { position: relative; height: var(--row); }
.bar .eff {
  position: absolute; top: 50%; left: calc(7px + (100% - 14px) * var(--e, 0));
  width: 1px; height: 12px; margin: -6px 0 0 -.5px;
  background: var(--mid); opacity: .7; pointer-events: none; display: none;
}
.bar .eff.on { display: block; }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  position: relative; z-index: 1;
  display: block; width: 100%; height: var(--row); margin: 0; padding: 0;
  background: transparent; cursor: pointer; touch-action: pan-y;
  --v: 0;
  --fill: calc(7px + (100% - 14px) * var(--v));
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 2px;
  background: linear-gradient(to right, var(--dim) var(--fill), var(--hair-2) var(--fill));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; margin-top: -6px; border-radius: 0;
  border: 1px solid var(--ink);
  background: linear-gradient(90deg, transparent 5.5px, var(--ink) 5.5px, var(--ink) 6.5px, transparent 6.5px), #000;
}
input[type="range"]:active::-webkit-slider-thumb { background: linear-gradient(90deg, transparent 5.5px, #000 5.5px, #000 6.5px, transparent 6.5px), var(--ink); }
input[type="range"]::-moz-range-track { height: 2px; background: var(--hair-2); border: 0; }
input[type="range"]::-moz-range-progress { height: 2px; background: var(--dim); }
input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 0; border: 1px solid var(--ink); background: #000;
}
input[type="range"]::-moz-focus-outer { border: 0; }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 1px solid var(--red); outline-offset: 2px; }
input[type="range"]:focus-visible::-moz-range-thumb { outline: 1px solid var(--red); outline-offset: 2px; }

/* small square buttons */
.kb {
  position: relative; height: 26px; min-width: 30px; padding: 0 7px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--hair-2); color: var(--dim);
  font: 400 10px/normal var(--f-mono); letter-spacing: .08em; white-space: nowrap;
  transition: color .15s, border-color .15s, background-color .15s;
}
.kb::before { content: ''; position: absolute; inset: -6px -2px; }
.kb:hover { color: var(--ink); border-color: var(--dim); }
.kb[aria-pressed="true"] { color: #000; background: var(--ink); border-color: var(--ink); }
.kb.armed { color: var(--ink); border-color: var(--ink); }
.kb:active { background: var(--wash); }

/* toggle box [■] */
.tg { position: relative; width: 26px; height: 26px; display: inline-grid; place-items: center; flex: none; }
.tg::before { content: ''; position: absolute; inset: -4px; }
.tg i { width: 12px; height: 12px; border: 1px solid var(--dim); transition: background-color .15s, border-color .15s; }
.tg[aria-pressed="true"] i { border-color: var(--ink); background: var(--ink); box-shadow: inset 0 0 0 2px #000; }

/* segmented */
.seg { display: flex; min-width: 0; }
.seg button {
  flex: 1 1 0; min-width: 0; height: 26px; margin-left: -1px;
  border: 1px solid var(--hair-2); color: var(--dim);
  font: 400 10px/normal var(--f-mono); letter-spacing: .08em;
  transition: color .15s, background-color .15s;
}
.seg button:first-child { margin-left: 0; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { color: #000; background: var(--ink); border-color: var(--ink); position: relative; z-index: 1; }
.row.segrow { grid-template-columns: 78px minmax(0, 1fr); }

/* styled select */
.sel {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  height: 26px; min-width: 0; padding: 0 6px 0 7px;
  border: 1px solid var(--hair-2); color: var(--ink);
  font-size: 11px; letter-spacing: .04em; cursor: pointer;
}
.sel:hover { border-color: var(--dim); }
.sel .sv { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sel::after {
  content: ''; flex: none; width: 0; height: 0;
  border-left: 3px solid transparent; border-right: 3px solid transparent; border-top: 4px solid var(--dim);
}
.sel select {
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
  font-size: 16px; cursor: pointer; -webkit-appearance: none; appearance: none;
}
.sel select option { background: #111; color: var(--ink); }
.sel:focus-within { outline: 1px solid var(--red); outline-offset: 2px; }
.sel:focus-within:not(:has(:focus-visible)) { outline: none; }

/* PTN: patch list */
.plist { margin: 0 0 6px; }
.prow {
  position: relative; width: 100%; height: 30px;
  display: grid; grid-template-columns: 34px 104px minmax(0, 1fr); column-gap: 8px; align-items: center;
  padding-left: 10px; text-align: left;
  color: var(--dim); font-size: 11px; letter-spacing: .03em;
  border-bottom: 1px solid var(--hair);
  transition: color .15s, background-color .15s;
}
.prow:first-child { border-top: 1px solid var(--hair); }
.prow::before { content: ''; position: absolute; left: 0; top: 9px; width: 2px; height: 11px; background: var(--red); opacity: 0; }
.prow:hover { color: var(--mid); }
.prow .pc { color: var(--faint); }
.prow .pn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .pe { font-size: 10px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
.prow[aria-pressed="true"] { color: var(--ink); background: var(--wash); }
.prow[aria-pressed="true"]::before { opacity: 1; }
.prow[aria-pressed="true"] .pc, .prow[aria-pressed="true"] .pe { color: var(--dim); }

.pair { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
.pair .row { grid-template-columns: 44px minmax(0, 1fr); }

/* TRK */
.trk { padding: 6px 0 4px; border-bottom: 1px solid var(--hair); }
.trk-h { display: grid; grid-template-columns: 26px 92px minmax(0, 1fr) auto auto; column-gap: 8px; align-items: center; height: 32px; }
.trk-id { font-size: 11px; color: var(--ink); letter-spacing: .04em; }
.trk-meta { display: flex; gap: 12px; justify-content: flex-end; font-size: 11px; color: var(--ink); white-space: nowrap; overflow: hidden; }
.trk-meta u { text-decoration: none; color: var(--dim); font-size: 9px; margin-left: 2px; }
.trk-meta .n { color: var(--dim); }
.trk .row { grid-template-columns: 26px minmax(0, 1fr) 66px; column-gap: 8px; }
.trk .row > .lbl { letter-spacing: .02em; }
.trk .row > .lbl { font-size: 9px; color: var(--dim); }
.trk.muted .trk-id, .trk.muted .trk-meta { color: var(--dim); }
.kb.clr { min-width: 40px; }

/* EVT */
.erow { display: grid; grid-template-columns: 26px 8px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; height: 34px; border-bottom: 1px solid var(--hair); }
.erow:first-of-type { border-top: 1px solid var(--hair); }
.erow .en { font-size: 11px; letter-spacing: .06em; color: var(--mid); }
.erow.dis .en { color: var(--faint); }
.erow .led { justify-self: center; }

/* PRC */
.tgcell { display: flex; align-items: center; margin-left: -6px; }
.prc-h { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; column-gap: 10px; height: 34px; }
.prc-h .en { font-size: 11px; letter-spacing: .06em; color: var(--mid); }
.eu { display: flex; align-items: center; gap: 3px; height: var(--row); }
.eu i { flex: 1 1 0; min-width: 0; height: 9px; border: 1px solid var(--faint); transition: background-color .08s, border-color .08s; }
.eu i.h { background: var(--dim); border-color: var(--dim); }
.eu i.x { border-color: transparent; background: none; position: relative; }
.eu i.x::after { content: ''; position: absolute; left: calc(50% - .5px); top: 3px; width: 1px; height: 1px; background: var(--faint); }
.eu i.c { border-color: var(--ink); }
.eu i.c.h { background: var(--red); border-color: var(--red); }
.eu-wrap { display: grid; grid-template-columns: 78px minmax(0, 1fr) 66px; column-gap: 12px; align-items: center; }
.eu-wrap .eu { padding: 0 1px; }
.eu-wrap .lbl { font-size: 10.5px; letter-spacing: .06em; color: var(--mid); }
.eu-wrap .lbl b { font-weight: 400; color: var(--dim); margin-left: 6px; font-size: 9px; }

/* ---------- sleep popover ---------- */
#scrim { position: fixed; inset: 0; z-index: 29; background: transparent; }
#sleep-pop {
  position: fixed; z-index: 30;
  top: calc(env(safe-area-inset-top, 0px) + 44px);
  right: var(--gut-r);
  width: min(300px, calc(100vw - var(--gut-l) - var(--gut-r)));
  padding: 12px;
  background: #000; border: 1px solid var(--hair-2);
  opacity: 0; visibility: hidden; transform: translateY(-4px);
  transition: opacity .18s, transform .18s, visibility 0s .18s;
}
#sleep-pop.open { opacity: 1; visibility: visible; transform: none; transition: opacity .18s, transform .18s; }
.pop-h { font: 400 9px/1 var(--f-disp); letter-spacing: .16em; color: var(--dim); margin: 2px 0 12px; }
.chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; }
.chip {
  height: 40px; margin-left: -1px; border: 1px solid var(--hair-2); color: var(--dim);
  font: 400 11px/normal var(--f-mono); letter-spacing: .04em;
}
.chip:first-child { margin-left: 0; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { color: #000; background: var(--ink); border-color: var(--ink); position: relative; z-index: 1; }

/* ---------- banner ---------- */
#sound-banner {
  position: fixed; z-index: 45; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(340px, calc(100vw - var(--gut-l) - var(--gut-r))); min-height: 44px; padding: 0 14px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: #000; color: var(--ink);
  border: 1px solid var(--hair-2);
  font-size: 10.5px; letter-spacing: .1em;
}
#sound-banner::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--red); box-shadow: 0 0 5px var(--red-glow); flex: none; }

/* ---------- night screen ---------- */
body.dim #hdr, body.dim #status, body.dim #panel, body.dim #ribbon-wrap, body.dim #log { display: none; }
body.dim #app { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
body.dim #stage { flex: 1 1 auto; min-height: 0; }
body.dim #stage-wrap { height: auto; flex: 1 1 0; min-height: 0; }
body.dim #orrery { opacity: .2; cursor: default; }
#night-veil { position: fixed; inset: 0; z-index: 40; background: transparent; cursor: pointer; touch-action: none; }

/* ---------- end ---------- */
#end {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
  background: #000;
  animation: fadeIn 2.5s ease both;
}
.end-title { font: 400 18px/1 var(--f-disp); letter-spacing: .4em; margin-right: -.4em; color: var(--ink); }

.frame-btn {
  min-height: 44px; min-width: 132px; padding: 0 28px;
  border: 1px solid var(--ink); color: var(--ink);
  font: 400 11px/1 var(--f-disp); letter-spacing: .3em; text-indent: .3em;
  transition: background-color .2s, color .2s;
}
.frame-btn:hover { background: var(--ink); color: #000; }
.frame-btn:active { background: var(--mid); color: #000; }
.frame-btn[disabled] { opacity: .45; cursor: default; background: none; color: var(--ink); }

/* ---------- start ---------- */
#start {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top, 0px) var(--gut-r) env(safe-area-inset-bottom, 0px) var(--gut-l);
  background: #000;
  opacity: 1; transition: opacity 1.2s ease, visibility 0s 1.2s;
}
#start.leaving { opacity: 0; visibility: hidden; pointer-events: none; }
.start-inner { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0; }
#start h1 {
  margin: 0 0 56px; font: 400 clamp(22px, 7.4vw, 40px)/1 var(--f-disp);
  letter-spacing: .4em; text-indent: .4em; color: var(--ink); white-space: nowrap;
}
.start-line { margin: 22px 0 0; font-size: 10px; letter-spacing: .14em; color: var(--dim); }
.start-line.err { color: var(--ink); }
.start-credit { margin: 14px 0 0; font-size: 10px; letter-spacing: .14em; color: var(--dim); opacity: .7; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- wide ---------- */
@media (min-width: 900px) {
  :root { --row: 30px; }
  #app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 400px;
    grid-template-rows: 44px 30px minmax(0, 1fr);
    column-gap: 32px;
    padding-block: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-bottom, 0px));
  }
  #hdr { grid-column: 1 / -1; grid-row: 1; border-bottom: 1px solid var(--hair); }
  #status { grid-column: 1; grid-row: 2; height: 30px; border-top: 0; }
  #stage { grid-column: 1; grid-row: 3; min-height: 0; }
  #stage-wrap { flex: 1 1 0; min-height: 0; height: auto; }
  #ribbon-wrap { margin: 6px 0 0; }
  #panel { grid-column: 2; grid-row: 2 / 4; border-top: 0; border-left: 1px solid var(--hair); padding-left: 20px; }
  .page { padding-bottom: 20px; }
  body.dim #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  body.dim #stage { grid-column: 1; grid-row: 1; }
}

@media (max-width: 374px) {
  #clock { display: none; }
  .row { grid-template-columns: 70px minmax(0, 1fr) 60px; column-gap: 10px; }
}
@media (max-width: 420px) {
  body.sleeping #clock { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}

<script>
/* ORPHEUS — sound engine (v2). class AmbientEngine.
 * Pure Web Audio synthesis: no samples, no libraries, no DOM.
 *
 * Patch philosophy (Roland, "A Foundation for Electronic Music"): VCO → VCF → VCA with separate
 * filter and amp envelopes, VCF key tracking 0.5 oct/oct, exponential (dB-linear) VCA decays,
 * resonance/ringing as a sound source, beat frequencies from detuned pairs, LFO→VCF used subtly.
 *
 * Signal flow
 *   voices ──> tracksIn ─> tracksBus ─┬──────────────────────────────> preMaster
 *   breath harmonizer ─> harmIn ─> harmBus ─┘ (into tracksIn)
 *                                    ├─> delay send ─> stereo tape delay ─> preMaster (+ reverb)
 *                                    ├─> loop send ──> tape loop (Frippertronics) ─> preMaster (+ reverb)
 *                                    └─> reverb send ─> [short IR ⨯ cos, long IR ⨯ sin] ─> damp LP ─> preMaster
 *   drone ─> droneBus · noise ch0/1 ─> noiseIn ─> HP 40 ─> noiseBus · perc ─> percBus · events ─> eventsBus
 *   preMaster ─> HP 28 ─> low-mid (drive) ─> tone LP + shelf ─> tape saturator ─> out ─> sleep ─> trim
 *             ─> compressor ─> soft clipper ─> analyser ─> destination ; ─> splitter ─> scopeL / scopeR
 *
 * Gain staging (round 2, measured in Chromium, OfflineAudioContext 48 kHz, defaults — test/render.py).
 * "pre" = compressor input (after trim ×4.0). Compressor thr -10 / ratio 12 / knee 6 adds ≈ +4 dB
 * fixed make-up; soft clipper linear to -4.4 dBFS. 'tone' = 2.5 kHz tilt shelf (-12…+1 dB) + LPF
 * 2.5–18 kHz, so a soft top exists at defaults.
 *   real v2 composer, 60 s: P01/P05 drone stem = tracks stem (±0.1 dB), mix ≈ -20.5 RMS, pre peaks
 *   -6…-11 dBFS; L/R corr P01 .43, P07 .53. Synthetic dense scene -17.3 RMS, pre peak -2.5.
 *   breath (dry, 220 Hz): centroid ≈ 1 kHz, 2–4 kHz ≈ 250–500 Hz level, air -3 dB between harmonics;
 *   harmonizer copies sum ≈ 1 dB under the lead. Tape loop: first repeat ≈ -11.5 dB, second -15.
 *   events peak ≈ +0.5…+2.3 dB over the bed (3 s windows).
 */
const AmbientEngine = (() => {
  'use strict';

  // ------------------------------------------------------------------ identifiers
  const VOICES = ['fm', 'add', 'modal', 'lpg', 'sub', 'formant', 'breath', 'sine'];
  const VOICE_ALIASES = { bell: 'fm', glass: 'add', kalimba: 'modal', felt: 'lpg', choir: 'formant', pluck: 'sub', bow: 'breath' };
  const HELD_VOICES = ['breath', 'sub'];
  const NOISE_TYPES = ['white', 'pink', 'brown', 'dust'];
  const FILTER_MODES = ['lp', 'bp', 'hp'];
  const EVENTS = ['cluster', 'ping', 'sh', 'sweep', 'reverse', 'capture', 'ring', 'phrase', 'daisy'];
  const PERC_VOICES = ['membrane', 'shaker', 'rim'];
  const TEXTURES = ['rain', 'waves', 'wind', 'fire', 'crickets'];          // v1 legacy (no-op)
  const DEFAULTS = {
    out: 0.8, tone: 0.6, drive: 0.35, wow: 0.3, verb: 0.6, size: 0.7, damp: 0.5, delay: 0.3, time: 0.45,
    fdbk: 0.45, shimmer: 0.3, loop: 0.15, loopFb: 0.7, loopTime: 0.5, harm: 0.5, tracks: 0.75, drone: 0.5,
    droneCut: 0.5, droneBeat: 0.3, noise: 0.5, perc: 0.5, events: 0.6,
  };
  const PARAM_ALIASES = { master: 'out', brightness: 'tone', space: 'verb', echo: 'delay', warmth: 'drive', notes: 'tracks', texture: 'noise' };
  const NOISE_DEFAULTS = { type: 'pink', level: 0, mode: 'lp', cutoff: 0.5, res: 0.2, lfoRate: 0.3, lfoDepth: 0.3, density: 0.3, width: 0.7 };
  const NOISE_NUM = ['level', 'cutoff', 'res', 'lfoRate', 'lfoDepth', 'density', 'width'];

  const EPS = 0.0001;
  const NOTE_BASE = 0.38;        // peak gain of a velocity-1 note before trims
  const EV_BASE = 0.18;          // reference peak for events (they emerge from the bed)
  const PERC_BASE = 0.5;         // reference peak for perc
  const STATS = { guard: 0, errors: 0 };

  // ------------------------------------------------------------------ helpers
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const clamp01 = (x) => clamp(x, 0, 1);
  const num = (x, d) => (typeof x === 'number' && isFinite(x) ? x : d);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const qdb = (q) => 20 * Math.log10(q);       // linear Q → the dB "Q" of Web Audio lowpass/highpass
  const ST = (n) => Math.pow(2, n / 12);

  function F(x, d) {
    if (typeof x === 'number' && isFinite(x)) return x;
    STATS.guard++;
    return d;
  }
  function sv(p, v, t) { p.setValueAtTime(F(v, 0), Math.max(0, F(t, 0))); }
  function lin(p, v, t) { p.linearRampToValueAtTime(F(v, 0), Math.max(0, F(t, 0))); }
  function expo(p, v, t) {
    v = F(v, EPS);
    p.exponentialRampToValueAtTime(v > 1e-6 ? v : 1e-6, Math.max(0, F(t, 0)));
  }
  function tgt(p, v, t, tau) { p.setTargetAtTime(F(v, 0), Math.max(0, F(t, 0)), Math.max(0.002, F(tau, 0.1))); }
  const floorOf = (peak) => Math.max(1e-6, Math.min(EPS, peak * 0.01));

  function hold(p, t, known) {
    t = Math.max(0, F(t, 0));
    if (typeof p.cancelAndHoldAtTime === 'function') {
      try { p.cancelAndHoldAtTime(t); return; } catch (e) { /* fall through */ }
    }
    let v = typeof known === 'number' && isFinite(known) ? known : p.value;
    if (!(typeof v === 'number' && isFinite(v))) v = 0;
    p.cancelScheduledValues(t);
    p.setValueAtTime(v, t);
  }
  function rampTo(p, v, now, sec, exponential) {
    hold(p, now);
    const t = now + Math.max(0.01, sec);
    if (exponential) expo(p, Math.max(EPS, v), t); else lin(p, v, t);
  }
  function evalPL(pts, t) {
    if (!pts.length) return 0;
    if (t <= pts[0].t) return pts[0].v;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      if (t <= b.t) return b.t > a.t ? a.v + (b.v - a.v) * (t - a.t) / (b.t - a.t) : b.v;
    }
    return pts[pts.length - 1].v;
  }
  function freqList(a, def, lo, hi, max) {
    let r = Array.isArray(a) ? a.map((x) => num(x, NaN)).filter((x) => isFinite(x) && x > 0).map((x) => clamp(x, lo, hi)) : [];
    if (!r.length) r = def.slice();
    return r.slice(0, max || 32);
  }

  // param → physical value maps (exported as AmbientEngine.MAP for the UI readouts)
  const MAP = {
    outGain: (v) => v * v * 0.9,
    toneHz: (v) => 2500 * Math.pow(7.2, v),
    dampHz: (v) => 14000 * Math.pow(1500 / 14000, v),
    delayL: (v) => 0.15 * Math.pow(8, v),
    delayR: (v) => Math.min(1.8, 0.15 * Math.pow(8, v) * 1.5),
    fdbk: (v) => 0.85 * v,
    loopFb: (v) => 0.95 * v,
    loopTime: (v) => 4 + 10 * v,
    droneCutHz: (v) => 150 * Math.pow(2500 / 150, v),
    droneBeatHz: (v) => 0.05 * Math.pow(80, v),
    noiseCutHz: (v) => 40 * Math.pow(400, v),
    noiseQ: (v) => 0.5 * Math.pow(50, v),
    lfoHz: (v) => 0.01 * Math.pow(800, v),
    dustRate: (v) => 0.3 * Math.pow(80 / 0.3, v),
  };
  const curves = {
    tracks: (v) => v * v * 1.25,
    drone: (v) => v * v * 0.17,
    noise: (v) => v * v * 1.3,
    perc: (v) => v * v * 1.6,
    events: (v) => v * v * 1.6,
    shimmer: (v) => Math.pow(v, 1.3) * 1.1,
    harm: (v) => v * 1.3,
    noiseLevel: (v) => Math.pow(v, 1.1),
    verbSend: (v) => 0.35 + 0.65 * v,
    verbRet: (v) => 0.04 + Math.pow(v, 1.3),
  };
  // perceptual pitch compensation: soften highs (phone speakers + ears), slightly lows
  const pitchComp = (f) => (f > 900 ? Math.pow(900 / f, 0.45) : f < 90 ? Math.pow(f / 90, 0.3) : 1);

  // ---- filtered-noise power estimate (for VCF gain compensation): ∫ S(f)|H(f)|² df / ∫ S(f) df
  const PF_N = 96, PF_F = new Float64Array(PF_N), PF_S = {}, PF_T = {};
  (() => {
    const a = Math.log(20), b = Math.log(20000), dl = (b - a) / PF_N;
    const spec = { white: (f) => 1, dust: (f) => 1, pink: (f) => 1 / f, brown: (f) => 1 / (1 + (f / 76) * (f / 76)) };
    for (let i = 0; i < PF_N; i++) PF_F[i] = Math.exp(a + (i + 0.5) * dl);
    for (const k of Object.keys(spec)) {
      const s = new Float64Array(PF_N); let tot = 0;
      for (let i = 0; i < PF_N; i++) { s[i] = spec[k](PF_F[i]) * PF_F[i] * dl; tot += s[i]; }
      PF_S[k] = s; PF_T[k] = tot;
    }
  })();
  function powerFrac(type, mode, fc, Q) {
    const S = PF_S[type] || PF_S.white;
    let acc = 0;
    for (let i = 0; i < PF_N; i++) {
      const x = PF_F[i] / fc, x2 = x * x, d = (1 - x2) * (1 - x2) + x2 / (Q * Q);
      const h2 = mode === 'lp' ? 1 / d : mode === 'hp' ? x2 * x2 / d : (x2 / (Q * Q)) / d;
      acc += S[i] * h2;
    }
    return acc / (PF_T[type] || PF_T.white);
  }
  const DUST_PEAK = 0.55;
  const NOISE_TYPE_GAIN = { white: 0.8, pink: 1.0, brown: 0.9, dust: 1.0 };

  // peak of a [0.5,1,0.5] impulse rung through BP(Q1) → BP(τ2) at f (envelope model), for normalisation
  function ringPeak(f, Q1, tau2, sr) {
    const w = 2 * Math.PI * f / sr;
    const tau1 = Q1 / (Math.PI * f);
    const g1 = (w / Q1) * (1 + Math.cos(w));
    if (Math.abs(tau2 - tau1) < 1e-6) tau2 = tau1 * 1.001;
    const tp = Math.log(tau2 / tau1) * tau1 * tau2 / (tau2 - tau1);
    return Math.max(1e-9, g1 * tau1 / (tau2 - tau1) * (Math.exp(-tp / tau2) - Math.exp(-tp / tau1)));
  }

  // ------------------------------------------------------------------ class
  class AmbientEngine {
    /** opts (all optional, mainly for tests): { AudioContext, setInterval, clearInterval } */
    constructor(opts) {
      this._opts = opts || {};
      this.ctx = null;
      this.started = false;
      this.analyser = null;
      this.scopeL = null;
      this.scopeR = null;
      this._params = Object.assign({}, DEFAULTS);
      this._maxVoices = 28;
      this._maxFx = 16;
      this._voices = [];
      this._fx = [];
      this._lookahead = 0.3;
      this._timer = null;
      this._texLevels = {};
      TEXTURES.forEach((t) => { this._texLevels[t] = 0; });
      this._noiseState = [Object.assign({}, NOISE_DEFAULTS), Object.assign({}, NOISE_DEFAULTS)];
      this._nch = [{ cur: null, old: [] }, { cur: null, old: [] }];
      this._droneLayers = [];
      this._pendingDrone = null;
      this._sleep = 1;
      this._level = 0;
      this._starting = null;
      this._held = new Set();
      this._capture = null;
    }

    // ---------------------------------------------------------------- lifecycle
    now() { return this.ctx ? this.ctx.currentTime : 0; }

    start() {
      if (this.started) return this.resume();
      if (this._starting) return this._starting;
      const AC = this._opts.AudioContext ||
        (typeof globalThis !== 'undefined' && (globalThis.AudioContext || globalThis.webkitAudioContext));
      if (!AC) return Promise.reject(new Error('Web Audio is not available'));
      try {
        if (typeof navigator !== 'undefined' && navigator && navigator.audioSession) navigator.audioSession.type = 'playback';
      } catch (e) { /* ignore */ }
      let ctx;
      try { ctx = new AC({ latencyHint: 'playback' }); } catch (e) {
        try { ctx = new AC(); } catch (e2) { return Promise.reject(e2); }
      }
      this.ctx = ctx;
      let resumeP = null;
      try { resumeP = ctx.resume(); } catch (e) { resumeP = null; }
      if (resumeP && typeof resumeP.catch === 'function') resumeP.catch(() => {});
      try { this._unlock(); } catch (e) { /* ignore */ }
      try { this._build(); } catch (e) {
        try { ctx.close(); } catch (e2) { /* ignore */ }
        this.ctx = null; this.analyser = null; this.scopeL = null; this.scopeR = null;
        return Promise.reject(e);
      }
      this.started = true;
      if (this._pendingDrone) { const d = this._pendingDrone; this._pendingDrone = null; this.setDrone(d); }
      for (let ch = 0; ch < 2; ch++) if (this._noiseState[ch].level > 0) this._noiseApply(ch, 3);
      this._startTimer();
      this._starting = (async () => {
        try { if (resumeP) await resumeP; } catch (e) { /* ignore */ }
        this._starting = null;
      })();
      return this._starting;
    }

    async suspend() { if (this.ctx && this.ctx.state === 'running') { try { await this.ctx.suspend(); } catch (e) { /* ignore */ } } }
    async resume() { if (this.ctx && this.ctx.state !== 'running' && this.ctx.state !== 'closed') { try { await this.ctx.resume(); } catch (e) { /* ignore */ } } }

    async dispose() {
      this._stopTimer();
      if (this.ctx && typeof this.ctx.close === 'function') { try { await this.ctx.close(); } catch (e) { /* ignore */ } }
      this.started = false;
    }

    setLookahead(sec) { this._lookahead = clamp(num(sec, 0.3), 0.05, 5); }

    _startTimer() {
      const si = this._opts.setInterval || (typeof setInterval === 'function' ? setInterval : null);
      if (si && !this._timer) this._timer = si(() => this.tick(), 50);
    }
    _stopTimer() {
      const ci = this._opts.clearInterval || (typeof clearInterval === 'function' ? clearInterval : null);
      if (this._timer && ci) ci(this._timer);
      this._timer = null;
    }

    _unlock() {
      const ctx = this.ctx;
      const b = ctx.createBuffer(1, 1, ctx.sampleRate);
      const s = ctx.createBufferSource();
      s.buffer = b;
      s.connect(ctx.destination);
      s.onended = () => { try { s.disconnect(); } catch (e) { /* ignore */ } };
      s.start(0);
    }

    // ---------------------------------------------------------------- graph
    _build() {
      const ctx = this.ctx;
      const G = (v) => { const g = ctx.createGain(); g.gain.value = v; return g; };
      const BQ = (type, f, q, gain) => {
        const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f;
        if (q !== undefined) b.Q.value = q;
        if (gain !== undefined) b.gain.value = gain;
        return b;
      };

      // ---- buffers (once)
      this._irS = this._makeIR(2.6, 1.9, 11000, 2600, 0.012, 0.02);
      this._irL = this._makeIR(11, 8.5, 8500, 650, 0.03, 0.12);
      this._noise = { white: this._makeNoise('white', 6), pink: this._makeNoise('pink', 6), brown: this._makeNoise('brown', 6) };
      this._shimWave = ctx.createPeriodicWave(new Float32Array([0, 0, 0, 0, 0]), new Float32Array([0, 0, 1, 0, 0.22]));
      {   // 28 % pulse (DC removed): hollow, reedy
        const N = 48, re = new Float32Array(N + 1), im = new Float32Array(N + 1), d = 0.28;
        for (let n = 1; n <= N; n++) re[n] = (2 / (n * Math.PI)) * Math.sin(n * Math.PI * d) * (n > 24 ? (N - n) / 24 : 1);
        this._pulseWave = ctx.createPeriodicWave(re, im);
      }
      // shaped impulse [0.5, 1, 0.5] (ping / rim exciter)
      this._imp = ctx.createBuffer(1, 4, ctx.sampleRate);
      this._imp.getChannelData(0).set([0.5, 1, 0.5, 0]);
      // dust impulses: 8 pan positions × 6 amplitudes, 1–3 samples, random sign
      this._dustBufs = [];
      const shapes = [[1], [0.5, 1, 0.5], [1, 0.6], [0.35, 1, 0.8]];
      const amps = [0.1, 0.18, 0.3, 0.48, 0.72, 1];
      for (let p = 0; p < 8; p++) {
        const pan = (p / 7) * 2 - 1, gl = Math.cos((pan + 1) * Math.PI / 4), gr = Math.sin((pan + 1) * Math.PI / 4);
        for (let a = 0; a < 6; a++) {
          const b = ctx.createBuffer(2, 4, ctx.sampleRate);
          const sh = shapes[(p + a * 3) % shapes.length], sg = (p + a) % 2 ? -1 : 1;
          const L = b.getChannelData(0), R = b.getChannelData(1);

      lsat.connect(lsPost);

      lsPost.connect(this._loopOut); this._loopOut.connect(this.preMaster);

      this._tracksBus.connect(this.preMaster);
      this._tracksRev = G(0.8); this._tracksBus.connect(this._tracksRev); this._tracksRev.connect(this._revIn);
      this._echoSend = G(0); this._tracksBus.connect(this._echoSend); this._echoSend.connect(this._echoIn);
      this._loopSendT = G(0); this._tracksBus.connect(this._loopSendT); this._loopSendT.connect(this._loopIn);
      this._capSendT = G(0); this._tracksBus.connect(this._capSendT); this._capSendT.connect(this._loopIn);
      this._shimIn = G(1); this._shimBus = G(0);

      // ---- drone bus

    _panner(pan) {

    // tanh over the input range ±1 → ±R; `unit` divides by R so the small-signal slope is 1
    _curveTanh(R, unit) {

      for (let i = 0; i < n; i++) { const u = (i / (n - 1)) * 2 - 1; c[i] = Math.tanh(u * R) / (unit ? R : 1); }

    _curveSoftClip() {

    // synthetic stereo room: decorrelated noise, exponential decay, darkening tail, soft onset, pre-delay
    _makeIR(sec, T60, fc0, fc1, preSec, onsetTau) {

      const oStep = Math.exp(-1 / (onsetTau * sr));
      const fadeN = Math.floor(Math.min(0.4, sec * 0.15) * sr);
      const tailN = len - pre;

        for (let i = 0; i < n + xf; i++) {

    // ---------------------------------------------------------------- params
    _pname(name) {

    setParam(name, value, rampSec) {

      const R = (p, x, e) => rampTo(p, x, now, ramp, e);
      switch (name) {
        case 'out': R(this._master.gain, MAP.outGain(v)); break;
        case 'tone':
          R(this._tone.frequency, MAP.toneHz(v), true);
          R(this._shelf.gain, -12 + 13 * v);         // the darkness lives in a tilt, the LPF only trims
          break;
        case 'drive': {

          R(this._flutLoop.gain, 0.00002 + 0.00006 * v);

        case 'verb': {
          const s = curves.verbSend(v);
          R(this._tracksRev.gain, s);
          R(this._droneRev.gain, 0.5 * s);
          R(this._noiseRev.gain, 0.2 * s);
          R(this._percRev.gain, 0.3 * s);
          R(this._evRev.gain, 1.1 * s);
          R(this._loopRev.gain, 0.35 * s);
          R(this._echoRev.gain, 0.35 * s);
          R(this._revOut.gain, curves.verbRet(v));
          break;
        }
        case 'size':
          R(this._revGS.gain, Math.cos(v * Math.PI / 2));
          R(this._revGL.gain, Math.sin(v * Math.PI / 2));
          break;
        case 'damp': R(this._damp.frequency, MAP.dampHz(v), true); break;
        case 'delay':
        case 'fdbk': {
          const d = P.delay;
          R(this._echoSend.gain, 0.7 * d);
          R(this._percDelay.gain, 0.25 * d);
          R(this._evDelay.gain, 0.6 * d);
          const fb = MAP.fdbk(P.fdbk);
          R(this._fbLR.gain, fb); R(this._fbRL.gain, fb);

        }

        }

          break;
        case 'loopFb': {

    setSleepGain(value, rampSec) {

    setMaxVoices(n) { this._maxVoices = clamp(Math.round(num(n, 28)), 2, 96); }

          for (let i = 0; i < u.length; i++) { const x = (u[i] - 128) / 128; s += x * x; }

        const rms = Math.sqrt(s / b.length);
        if (isFinite(rms)) this._level += (rms - this._level) * (rms > this._level ? 0.35 : 0.08);

    // ---------------------------------------------------------------- node-set bookkeeping
    activeVoiceCount() {
      const now = this.now();
      let n = 0;
      for (const v of this._voices) if (!v.dead && !v.stolen && v.end > now) n++;

    }
    activeFxCount() {
      const now = this.now();
      let n = 0;
