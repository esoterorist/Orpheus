    }
    stats() {
      return {
        guard: STATS.guard, errors: STATS.errors, voices: this._voices.length, fx: this._fx.length,
        droneLayers: this._droneLayers.length,
        noise: this._nch.map((C) => (C.cur ? { type: C.cur.type, mode: C.cur.mode, fading: C.old.length } : { type: null, fading: C.old.length })),
        textures: [],
      };
    }
    _err(e) {
      STATS.errors++;
      if (STATS.errors < 4 && typeof console !== 'undefined') console.warn('[engine]', e && e.message ? e.message : e);
    }

    // pool 'notes' (voice cap) or 'fx' (events + perc, soft cap). Returns null when a perc hit is dropped.
    _newSet(pool, t0, pan, held, dest, kind) {
      const ctx = this.ctx, now = ctx.currentTime;
      const list = pool === 'fx' ? this._fx : this._voices;
      const cap = pool === 'fx' ? this._maxFx : this._maxVoices;
      let live = list.filter((v) => !v.dead && v.end > now && !v.stolen);
      while (live.length >= cap) {
        let victim = null;
        const older = (v) => !victim || v.start < victim.start;
        if (pool === 'fx') {
          for (const v of live) if (v.kind === 'perc' && older(v)) victim = v;
          if (!victim && kind === 'perc') return null;          // never kill an event for a drum hit
        }
        if (!victim) for (const v of live) if (!v.held && older(v)) victim = v;
        if (!victim) for (const v of live) if (older(v)) victim = v;
        this._steal(victim, now);
        live = live.filter((v) => v !== victim);
      }
      const vout = ctx.createGain();
      // partial constant-peak pan law: the equal-power panner is +3 dB on the near side at the
      // edges; pull that back by ~80 % so off-centre notes don't poke out of the mix
      const pp = clamp(num(pan, 0), -1, 1), x = (pp + 1) * Math.PI / 4;
      vout.gain.value = Math.pow(0.7071 / Math.max(Math.cos(x), Math.sin(x)), 0.8);
      const pn = this._panner(pan);
      vout.connect(pn);
      pn.connect(dest);
      const v = { pool, kind: kind || 'note', start: t0, end: Infinity, held: !!held, nodes: [vout, pn], srcs: [], live: 0, vout, pn, fades: [vout], dead: false, stolen: false };
      list.push(v);
      return v;
    }
    _newVoice(t0, pan, held) { return this._newSet('notes', t0, pan, held, this._tracksIn, 'note'); }
    _node(v, n) { v.nodes.push(n); return n; }
    _src(v, s, t0, off, dur) {
      v.nodes.push(s); v.srcs.push(s); v.live++;
      s.onended = () => { v.live--; if (v.live <= 0) this._free(v); };
      if (dur !== undefined) s.start(t0, off || 0, dur); else if (off !== undefined) s.start(t0, off); else s.start(t0);
      return s;
    }
    _osc(v, type, f, t0) {
      const o = this.ctx.createOscillator();
      o.type = type;
      o.frequency.value = clamp(F(f, 440), 1, 22000);
      return this._src(v, o, t0);
    }
    _wave(v, wave, f, t0) {
      const o = this.ctx.createOscillator();
      o.setPeriodicWave(wave);
      o.frequency.value = clamp(F(f, 440), 1, 22000);
      return this._src(v, o, t0);
    }
    // looping noise source, stopped by _finish
    _loopSrc(v, buf, t0, rate) {
      const s = this.ctx.createBufferSource();
      s.buffer = buf; s.loop = true;
      s.playbackRate.value = rate || 1;
      return this._src(v, s, t0, Math.random() * (buf.duration - 0.1));
    }
    _noiseSrc(v, t0, dur, rate) {
      const s = this.ctx.createBufferSource();
      s.buffer = this._noise.white;
      s.playbackRate.value = rate || 1;
      return this._src(v, s, t0, Math.random() * 5, dur);
    }
    _once(v, buf, t0) {
      const s = this.ctx.createBufferSource();
      s.buffer = buf;
      return this._src(v, s, t0);
    }
    // silent source that keeps a node-set alive while filters ring (stopped by _finish)
    _keep(v, t0) {
      const ctx = this.ctx;
      const k = typeof ctx.createConstantSource === 'function' ? ctx.createConstantSource() : ctx.createOscillator();
      const z = this._gainN(v, 0);
      k.connect(z); z.connect(v.vout);
      return this._src(v, k, t0);
    }
    _gainN(v, init) { const g = this.ctx.createGain(); g.gain.value = init || 0; v.nodes.push(g); return g; }
    _filt(v, type, f, q) {
      const b = this.ctx.createBiquadFilter(); b.type = type; b.frequency.value = clamp(F(f, 1000), 10, 22000);
      if (q !== undefined) b.Q.value = q;
      v.nodes.push(b); return b;
    }
    _pan(v, p) { const pn = this._panner(p); v.nodes.push(pn); return pn; }
    _finish(v, end) {
      v.end = end;
      for (const s of v.srcs) { try { s.stop(end); } catch (e) { /* ignore */ } }
    }
    _steal(v, now) {
      if (!v || v.dead) return;
      v.stolen = true;
      for (const g of v.fades) { try { hold(g.gain, now); lin(g.gain, 0, now + 0.04); } catch (e) { this._err(e); } }
      const stopT = Math.max(v.start, now) + 0.06;
      v.end = Math.min(v.end, stopT);
      for (const s of v.srcs) { try { s.stop(stopT); } catch (e) { /* ignore */ } }
      if (v.handle) v.handle._dead = true;
    }
    _free(v) {
      if (v.dead) return;
      v.dead = true;
      for (const n of v.nodes) {
        if (n.onended) n.onended = null;
        try { n.disconnect(); } catch (e) { /* ignore */ }
      }
      v.nodes.length = 0; v.srcs.length = 0; v.fades.length = 0;
      const list = v.pool === 'fx' ? this._fx : this._voices;
      const i = list.indexOf(v);
      if (i >= 0) list.splice(i, 1);
      if (v.handle) this._held.delete(v.handle);
    }

    // amplitude envelope: 0 → peak (linear attack) → exponential decay stages → floor → 0
    _env(p, t0, att, peak, stages) {
      sv(p, 0, t0);
      lin(p, peak, t0 + att);
      let t = t0 + att;
      for (const [lvl, dur] of stages) { t += dur; expo(p, Math.max(floorOf(peak), lvl), t); }
      lin(p, 0, t + 0.02);
      return t + 0.02;
    }

    _shimmer(v, f, t0, A, life) {
      if (this._params.shimmer < 0.01 || f > 3200) return;
      const o = this._wave(v, this._shimWave, f, t0);
      const g = this._gainN(v, 0);
      const pk = A * 0.35;
      sv(g.gain, 0, t0);
      lin(g.gain, pk * 0.3, t0 + 0.4);
      lin(g.gain, pk, t0 + 1.2);
      expo(g.gain, floorOf(pk), t0 + Math.max(1.4, life));
      lin(g.gain, 0, t0 + Math.max(1.4, life) + 0.02);
      o.connect(g); g.connect(this._shimIn);
      v.fades.push(g);
    }

    // ---------------------------------------------------------------- playNote
    static normVoice(name) {
      if (VOICES.indexOf(name) >= 0) return name;
      return VOICE_ALIASES[name] || null;
    }

    playNote(opts) {
      if (!this.started || !opts) return;
      try {
        const voice = AmbientEngine.normVoice(opts.voice) || 'fm';
        const f = clamp(num(opts.freq, 440), 16, 16000);
        const vel = clamp01(num(opts.velocity, 0.7));
        const now = this.ctx.currentTime;
        const t0 = Math.max(num(opts.time, now), now + 0.005);
        const dur = clamp(num(opts.duration, 4), 0.1, 60);
        const pan = clamp(num(opts.pan, 0), -1, 1);
        const b = clamp01(num(opts.brightness, 0.5));
        const A = NOTE_BASE * Math.pow(vel, 1.6) * pitchComp(f);
        if (A < 0.0015) return;
        const v = this._newVoice(t0, pan, false);
        let end;
        switch (voice) {
          case 'fm': end = this._vFM(v, f, t0, A, b); break;
          case 'add': end = this._vAdd(v, f, t0, A, b); break;
          case 'modal': end = this._vModal(v, f, t0, A, b); break;
          case 'lpg': end = this._vLPG(v, f, t0, A, b); break;
          case 'formant': end = this._vFormant(v, f, t0, A, b, dur); break;
          case 'breath': end = this._breath(v, f, t0, A, b, { vel, dur, pan, scoop: opts.scoop, harm: opts.harm }).end; break;
          case 'sine': end = this._vSine(v, f, t0, A, b, dur); break;
          default: end = this._vSub(v, f, t0, A, b); break;
        }
        this._finish(v, end + 0.02);
      } catch (e) { this._err(e); }
    }

    // fm: 2-operator FM (ratio 3.5) with decaying index + a quiet inharmonic partial
    _vFM(v, f, t0, A, b) {
      f *= Math.pow(2, rnd(-2, 2) / 1200);
      const dec = clamp(7.5 - 0.9 * Math.log2(Math.max(f, 55) / 220), 4.5, 8.5);
      const car = this._osc(v, 'sine', f, t0);
      const mod = this._osc(v, 'sine', f * 3.5, t0);
      const mg = this._gainN(v, 0);
      const idx = (0.45 + 1.3 * b) * (f > 400 ? 400 / f : 1) * (f < 110 ? 0.6 : 1);
      const dev = idx * f * 3.5;
      sv(mg.gain, dev, t0);
      expo(mg.gain, dev * 0.05, t0 + dec * 0.45);
      mod.connect(mg); mg.connect(car.frequency);
      const env = this._gainN(v, 0);
      A *= 0.8;
      const end = this._env(env.gain, t0, 0.006, A, [[A * 0.55, 0.35], [0, dec - 0.35]]);
      car.connect(env); env.connect(v.vout);
      if (f * 2.76 < 12000) {
        const p = this._osc(v, 'sine', f * 2.76, t0);
        const pg = this._gainN(v, 0);
        this._env(pg.gain, t0, 0.004, A * (0.08 + 0.08 * b), [[0, dec * 0.35]]);
        p.connect(pg); pg.connect(v.vout);
      }
      this._shimmer(v, f, t0, A, dec * 0.8);
      return end;
    }

    // add: additive sine partials 1 / 2 / 3, fundamental beating against a detuned twin
    _vAdd(v, f, t0, A, b) {
      const dec = clamp(6.5 - 0.6 * Math.log2(Math.max(f, 55) / 440), 4, 7.5);
      const beat = rnd(0.35, 0.9);
      const o1 = this._osc(v, 'sine', f, t0);
      const o2 = this._osc(v, 'sine', f + beat, t0);
      const eA = this._gainN(v, 0);
      const end = this._env(eA.gain, t0, 0.06, A * 0.62, [[0, dec]]);
      const g2 = this._gainN(v, 0.7);
      o1.connect(eA); o2.connect(g2); g2.connect(eA); eA.connect(v.vout);
      if (f * 2 < 12000) {
        const o3 = this._osc(v, 'sine', f * 2 * (1 - 0.0006), t0);
        const eB = this._gainN(v, 0);
        this._env(eB.gain, t0, 0.05, A * (0.1 + 0.18 * b), [[0, dec * 0.5]]);
        o3.connect(eB); eB.connect(v.vout);
        if (f * 3 < 12000) {
          const o4 = this._osc(v, 'sine', f * 3 * (1 + 0.0004), t0);
          const eC = this._gainN(v, 0);
          this._env(eC.gain, t0, 0.04, A * (0.03 + 0.08 * b), [[0, dec * 0.3]]);
          o4.connect(eC); eC.connect(v.vout);
        }
      }
      this._shimmer(v, f, t0, A, dec * 0.9);
      return end;
    }

    // modal: struck-bar modes 1, 2.76, 5.4, 11 (each its own decay) + band-passed exciter click
    _vModal(v, f, t0, A, b) {
      const dec = clamp(3.0 - 0.4 * Math.log2(Math.max(f, 55) / 220), 1.8, 3.2);
      A *= 0.75;
      const o = this._osc(v, 'sine', f, t0);
      sv(o.frequency, f * 1.004, t0);
      expo(o.frequency, f, t0 + 0.05);
      const e = this._gainN(v, 0);
      const end = this._env(e.gain, t0, 0.004, A, [[A * 0.68, 0.15], [0, dec - 0.15]]);
      o.connect(e); e.connect(v.vout);
      const parts = [[2.76, 0.12 + 0.12 * b, 0.7], [5.4, 0.16 + 0.16 * b, 0.22], [11.0, 0.04 + 0.07 * b, 0.06]];
      for (const [r, amp, d] of parts) {
        if (f * r > 12000) continue;
        const p = this._osc(v, 'sine', f * r * (1 + rnd(-0.002, 0.002)), t0);
        const pg = this._gainN(v, 0);
        this._env(pg.gain, t0, 0.003, A * amp * (f * r > 4000 ? 0.6 : 1), [[0, d]]);
        p.connect(pg); pg.connect(v.vout);
      }
      const n = this._noiseSrc(v, t0, 0.02, 1);
      const nf = this._filt(v, 'bandpass', Math.min(f * 6, 5000), 1.5);
      const ng = this._gainN(v, 0);
      this._env(ng.gain, t0, 0.0015, A * (0.1 + 0.12 * b), [[0, 0.012]]);
      n.connect(nf); nf.connect(ng); ng.connect(v.vout);
      this._shimmer(v, f, t0, A * 0.7, dec);
      return end;
    }

    // lpg: Buchla-style low-pass gate — VCF and VCA follow one vactrol-shaped CV (fast on, slow two-stage off)
    _vLPG(v, f, t0, A, b) {
      const dec = clamp(3.6 - 0.45 * Math.log2(Math.max(f, 55) / 220), 2.2, 4.2);
      A *= 0.98;
      const tr = this._osc(v, 'triangle', f, t0);
      tr.detune.value = rnd(1, 3);
      const si = this._osc(v, 'sine', f, t0);
      const mix = this._gainN(v, 0.6);
      const sg = this._gainN(v, 0.75);
      tr.connect(mix); si.connect(sg); sg.connect(mix);
      if (f * 2 < 9000) {
        const h = this._osc(v, 'sine', f * 2 * 1.0007, t0);
        const hg = this._gainN(v, 0.08 + 0.12 * b);
        h.connect(hg); hg.connect(mix);
      }
      // woody strike: low-passed noise into the gate
      const n = this._noiseSrc(v, t0, 0.04, 0.7);
      const nf = this._filt(v, 'lowpass', clamp(f * 1.8, 180, 1200), qdb(0.8));
      const ng = this._gainN(v, 0);
      sv(ng.gain, 0, t0); lin(ng.gain, 0.5, t0 + 0.002); expo(ng.gain, 0.005, t0 + 0.03); lin(ng.gain, 0, t0 + 0.035);
      n.connect(nf); nf.connect(ng); ng.connect(mix);
      const kt = Math.pow(f / 220, 0.5);
      const fMin = clamp(f * 0.85, 60, 2500), fMax = clamp(1000 * kt * (0.7 + 1.5 * b), fMin * 1.5, 7000);
      const lp = this._filt(v, 'lowpass', fMin, qdb(1.2));
      sv(lp.frequency, fMin, t0);
      lin(lp.frequency, fMax, t0 + 0.004);
      expo(lp.frequency, fMin + (fMax - fMin) * 0.38, t0 + 0.09);
      expo(lp.frequency, fMin, t0 + dec * 0.75);
      mix.connect(lp);
      const e = this._gainN(v, 0);
      const end = this._env(e.gain, t0, 0.004, A, [[A * 0.45, 0.1], [0, dec - 0.1]]);
      lp.connect(e); e.connect(v.vout);
      this._shimmer(v, f, t0, A * 0.5, dec);
      return end;
    }

    // formant: 3 detuned saws → formant bandpass bank (vowel by brightness) + body LP, slow swell
    _vFormant(v, f, t0, A, b, dur) {
      const att = rnd(1.5, 2.6), rel = rnd(3, 5);
      const holdT = Math.max(dur, att + 0.5);
      A *= 0.95;
      const mix = this._gainN(v, 0.33);
      const lfo = this._osc(v, 'sine', rnd(4.4, 5.2), t0);
      const vg = this._gainN(v, 0);
      sv(vg.gain, 0, t0); sv(vg.gain, 0, t0 + att * 0.6); lin(vg.gain, 7, t0 + att * 0.6 + 1.5);
      lfo.connect(vg);
      for (const dt of [-8, 0.5, 7]) {
        const o = this._osc(v, 'sawtooth', f, t0);
        o.detune.value = dt + rnd(-1.5, 1.5);
        vg.connect(o.detune);
        o.connect(mix);
      }
      const F1 = 350 + 400 * b, F2 = 850 + 350 * b, F3 = 2500 + 200 * b;
      const env = this._gainN(v, 0);
      for (const [fc, q, gn] of [[F1, 5, 2.4], [F2, 7, 1.5], [F3, 9, 0.5]]) {
        const bp = this._filt(v, 'bandpass', fc, q);
        sv(bp.frequency, fc, t0);
        tgt(bp.frequency, fc * rnd(0.9, 1.1), t0 + att, holdT / 2);
        const g = this._gainN(v, gn);
        mix.connect(bp); bp.connect(g); g.connect(env);
      }
      const lp = this._filt(v, 'lowpass', clamp(f * 2.2, 120, 1200), qdb(0.707));
      const lg = this._gainN(v, 0.9);
      mix.connect(lp); lp.connect(lg); lg.connect(env);
      const p = env.gain;
      sv(p, 0, t0);
      lin(p, A * 0.25, t0 + att * 0.5);
      lin(p, A, t0 + att);
      lin(p, A * 0.85, t0 + holdT);
      expo(p, floorOf(A), t0 + holdT + rel);
      lin(p, 0, t0 + holdT + rel + 0.02);
      env.connect(v.vout);
      this._shimmer(v, f, t0, A * 0.6, holdT + rel * 0.6);
      return t0 + holdT + rel + 0.02;
    }

    // sub: saw + 28 % pulse → 24 dB/oct resonant LP (two cascaded biquads) with its own ADSR,
    // key-tracked 0.5 oct/oct; separate exponential amp envelope
    _vSub(v, f, t0, A, b) {
      const dec = clamp(2.6 - 0.35 * Math.log2(Math.max(f, 55) / 220), 1.4, 3.2);
      const saw = this._osc(v, 'sawtooth', f, t0); saw.detune.value = rnd(-5, -2);
      const pul = this._wave(v, this._pulseWave, f, t0); pul.detune.value = rnd(2, 5);
      const sg = this._gainN(v, 0.42), pg = this._gainN(v, 0.5);
      saw.connect(sg); pul.connect(pg);
      const kt = Math.pow(f / 220, 0.5);
      const base = clamp(330 * kt, 90, 4000);
      const peak = clamp(base * (2.4 + 5 * b), 200, 8000), sus = clamp(base * (1.15 + 0.5 * b), 100, 5000);
      const lp1 = this._filt(v, 'lowpass', base, qdb(0.54)), lp2 = this._filt(v, 'lowpass', base, qdb(1.6));
      for (const lp of [lp1, lp2]) {
        sv(lp.frequency, base, t0);
        expo(lp.frequency, peak, t0 + 0.006);
        tgt(lp.frequency, sus, t0 + 0.006, 0.09 + 0.2 * (1 - b));
        tgt(lp.frequency, base * 0.85, t0 + 0.5, dec * 0.45);
      }
      sg.connect(lp1); pg.connect(lp1); lp1.connect(lp2);
      const e = this._gainN(v, 0);
      const end = this._env(e.gain, t0, 0.005, A * 2.0, [[A * 0.95, 0.28], [0, dec - 0.28]]);
      lp2.connect(e); e.connect(v.vout);
      this._shimmer(v, f, t0, A * 0.6, dec);
      return end;
    }

    // sine: pure sine, soft exponential envelope, holds for `duration`
    _vSine(v, f, t0, A, b, dur) {
      const att = clamp(0.04 + dur * 0.08, 0.04, 0.9), rel = clamp(0.8 + dur * 0.3, 0.8, 4.5);
      const holdT = Math.max(dur, att + 0.05);
      A *= 0.68;
      const o = this._osc(v, 'sine', f, t0);
      const e = this._gainN(v, 0);
      const p = e.gain;
      sv(p, 0, t0);
      lin(p, A * 0.3, t0 + att * 0.4);
      lin(p, A, t0 + att);
      lin(p, A * 0.82, t0 + holdT);
      expo(p, floorOf(A), t0 + holdT + rel);
      lin(p, 0, t0 + holdT + rel + 0.02);
      // brightness: soft 2nd harmonic + LP at f·(1.2 + 6b) — brightness 0 is a dull, slightly muffled sine
      const lp = this._filt(v, 'lowpass', clamp(f * (1.2 + 6 * b), 60, 12000), qdb(0.707));
      if (b > 0.05 && f * 2 < 10000) {
        const h = this._osc(v, 'sine', f * 2 * 1.0006, t0);
        const hg = this._gainN(v, 0.18 * b * b);
        h.connect(hg); hg.connect(lp);
      }
      o.connect(lp); lp.connect(e); e.connect(v.vout);
      if (b > 0.05) this._shimmer(v, f, t0, A * 0.8 * b, holdT + rel * 0.5);
      return t0 + holdT + rel + 0.02;
    }

    /* breath: Hassell-style lead (breathy, Harmon-muted, harmonized trumpet).
     * VCO: saw + pulse + sine; pitch CV = slow audible scoop from below (~220–350 ms, the VCA opens
     * faster than the pitch settles) + light, delayed, irregular vibrato (rate drifts 4.2–5.6 Hz).
     * VCF: key-tracked LP with its own envelope → nasal formant body (BP 1.1 / 2.2 / 3.3 kHz) + soft
     * 5.5 kHz top. AIR has its own path that bypasses the VCF: white → HP 1.8 k → BP 2.6 k → VCA,
     * with a chiff on the attack and pressure control. Harmonizer: −12 st (HP 110 Hz so it never sits
     * in the drone) and +7 st copies, detuned, late, 3–5 dB under the lead, carrying some air.
     * o: { vel, dur, pan, scoop, harm, held }. Returns a control object (end time for one-shots). */
    _breath(v, f, t0, A, b, o) {
      const held = !!o.held;
      const vel = clamp01(num(o.vel, 0.6));
      const scoop = clamp(num(o.scoop, 120), 0, 1200);
      const harmOn = o.harm !== false;
      const att = clamp(0.1 + 0.16 * (1 - vel) + rnd(0, 0.05), 0.08, 0.4);
      const dur = held ? 0 : Math.max(clamp(num(o.dur, 3), 0.1, 60), att + 0.45);
      const ctl = { pitched: [], t0, att, A, b };
      A *= 0.5;
      ctl.A = A;
      const rel = held ? 0 : clamp(0.45 + 0.18 * Math.sqrt(dur) + rnd(0, 0.25), 0.45, 1.6);

      // ---- pitch CV: scoop, light delayed irregular vibrato (rate wanders), slow drift
      const vib = this._osc(v, 'sine', rnd(4.6, 5.2), t0);
      const vr = this._osc(v, 'sine', rnd(0.07, 0.16), t0), vrg = this._gainN(v, rnd(0.45, 0.65));
      vr.connect(vrg); vrg.connect(vib.frequency);                 // 4.2 … 5.6 Hz
      const vib2 = this._osc(v, 'sine', vib.frequency.value * 0.37, t0);
      const vg = this._gainN(v, 0), vg2 = this._gainN(v, 0.3);
      const vDepth = rnd(4, 8);
      const vDelay = held ? 0.9 : dur * 0.6;
      if (held || dur > 2) {
        sv(vg.gain, 0, t0); sv(vg.gain, 0, t0 + vDelay); lin(vg.gain, vDepth, t0 + vDelay + 1.5);
        if (!held) { lin(vg.gain, vDepth, t0 + Math.max(dur, vDelay + 1.5)); lin(vg.gain, 0, t0 + Math.max(dur, vDelay + 1.5) + rel * 0.6); }
      }
      vib.connect(vg); vib2.connect(vg2); vg2.connect(vg);
      const drift = this._osc(v, 'sine', rnd(0.13, 0.31), t0);
      const dg = this._gainN(v, rnd(2, 4));
      drift.connect(dg);
      const pitched = (osc, ratio, off) => {
        const d = osc.detune;
        if (scoop > 0) {
          sv(d, off - scoop, t0);
          tgt(d, off + Math.min(4, scoop * 0.02), t0 + 0.004, 0.07 + scoop * 0.0003);
          tgt(d, off, t0 + 0.35, 0.08);
        } else sv(d, off, t0);
        vg.connect(d); dg.connect(d);
        ctl.pitched.push({ o: osc, ratio });
        return osc;
      };
      ctl.vg = vg;

      // ---- VCO
      const mix = this._gainN(v, 1);
      const saw = pitched(this._osc(v, 'sawtooth', f, t0), 1, rnd(-3, -1));
      const pul = pitched(this._wave(v, this._pulseWave, f, t0), 1, rnd(1, 3));
      const sin = pitched(this._osc(v, 'sine', f, t0), 1, 0);
      const g1 = this._gainN(v, 0.55), g2 = this._gainN(v, 0.4), g3 = this._gainN(v, 0.25);
      saw.connect(g1); pul.connect(g2); sin.connect(g3); g1.connect(mix); g2.connect(mix); g3.connect(mix);

      // ---- VCF: key-tracked LP with its own (brass-like) envelope, open
      const kt = Math.pow(f / 220, 0.5);
      const cut = (m, ff) => clamp(900 * Math.pow((ff || f) / 220, 0.5) * m, 150, 9000);
      ctl.cut = cut;
      const lp = this._filt(v, 'lowpass', cut(0.5), qdb(0.9));
      sv(lp.frequency, cut(0.5), t0);
      tgt(lp.frequency, cut(2.0 + 1.0 * b), t0 + 0.01, att * 0.6);
      tgt(lp.frequency, cut(1.6 + 0.8 * b), t0 + att + 0.12, 0.45);
      if (!held && dur > 1.2) tgt(lp.frequency, cut(1.25 + 0.5 * b), t0 + dur * 0.55, dur * 0.3);
      mix.connect(lp);
      ctl.lp = lp; ctl.kt = kt;

      // ---- body: nasal Harmon-mute formants + direct, soft top
      const body = this._gainN(v, 0.45);
      const fr = rnd(0.96, 1.04);
      const fA = this._filt(v, 'bandpass', 1100 * fr, 3), fAg = this._gainN(v, 1.0);
      const fB = this._filt(v, 'bandpass', 2200 * fr, 4), fBg = this._gainN(v, 0.9);
      const fC = this._filt(v, 'bandpass', 3300 * fr, 5), fCg = this._gainN(v, 0.3);
      const dark = this._filt(v, 'lowpass', 5500, qdb(0.707));
      lp.connect(body); lp.connect(fA); lp.connect(fB); lp.connect(fC);
      fA.connect(fAg); fB.connect(fBg); fC.connect(fCg);
      body.connect(dark); fAg.connect(dark); fBg.connect(dark); fCg.connect(dark);

      // ---- air: own path, not through the VCF (chiff, then steady air; pressure-controlled)
      const ns = this._loopSrc(v, this._noise.white, t0, 1);
      const nhp = this._filt(v, 'highpass', 1800, qdb(0.707));
      const nbp = this._filt(v, 'bandpass', 2600 * Math.pow(f / 220, 0.15), 0.7);
      const ng = this._gainN(v, 0);
      const nS = 1.6 * (0.6 + 0.8 * b);
      ctl.nS = nS;
      sv(ng.gain, 0, t0); lin(ng.gain, nS * 2.2, t0 + att * 0.5); lin(ng.gain, nS, t0 + att + 0.3);
      if (!held) lin(ng.gain, nS * 1.2, t0 + dur);
      ns.connect(nhp); nhp.connect(nbp); nbp.connect(ng);

      // ---- VCA: opens fast (so the scoop is heard), exponential release
      const env = this._gainN(v, 0);
      const p = env.gain;
      sv(p, 0, t0);
      lin(p, A * 0.6, t0 + 0.05);
      lin(p, A, t0 + Math.max(att, 0.06));
      let end = 0;
      if (!held) {
        const tS = t0 + att + 0.25;
        lin(p, A * 0.82, tS);
        if (t0 + dur > tS + 0.1) { lin(p, A * 0.95, tS + (t0 + dur - tS) * 0.55); lin(p, A * 0.72, t0 + dur); }
        expo(p, floorOf(A), t0 + dur + rel);
        lin(p, 0, t0 + dur + rel + 0.02);
        end = t0 + dur + rel + 0.06;
      }
      dark.connect(env); ng.connect(env); env.connect(v.vout);
      ctl.env = env;

      // ---- harmonizer: −12 st (HP 110 Hz) and +7 st copies, detuned, late, 3–5 dB under the lead
      if (harmOn) {
        const hd = rnd(0.018, 0.045);
        const hm = this._gainN(v, 1);
        const h1 = pitched(this._osc(v, 'sawtooth', f * 0.5, t0), 0.5, -4 + rnd(-3, 3));
        const h2 = pitched(this._osc(v, 'sawtooth', f * ST(7), t0), ST(7), 5 + rnd(-3, 3));
        const h1hp = this._filt(v, 'highpass', 110, qdb(0.707));
        const hg1 = this._gainN(v, 0.8), hg2 = this._gainN(v, 0.55);
        h1.connect(h1hp); h1hp.connect(hg1); h2.connect(hg2); hg1.connect(hm); hg2.connect(hm);
        const hlp = this._filt(v, 'lowpass', cut(0.5), qdb(1.0));
        sv(hlp.frequency, cut(0.5), t0);
        tgt(hlp.frequency, cut(1.3 + 0.6 * b), t0 + hd, att);
        const hbp = this._filt(v, 'bandpass', 1100, 2), hbg = this._gainN(v, 0.8);
        const hdir = this._gainN(v, 0.5);
        hm.connect(hlp); hlp.connect(hbp); hbp.connect(hbg); hlp.connect(hdir);
        const henv = this._gainN(v, 0);
        const hair = this._gainN(v, 0.5);
        hbg.connect(henv); hdir.connect(henv); ng.connect(hair); hair.connect(henv);
        const q = henv.gain;
        sv(q, 0, t0 + hd);
        lin(q, A * 0.5, t0 + hd + 0.06);
        lin(q, A, t0 + hd + att * 1.3);
        if (!held) {
          if (t0 + dur > t0 + hd + att * 1.3 + 0.1) lin(q, A * 0.75, t0 + dur);
          expo(q, floorOf(A), t0 + dur + rel + hd);
          lin(q, 0, t0 + dur + rel + hd + 0.02);
          end += hd;
        }
        const pan = clamp(num(o.pan, 0), -1, 1);
        const hp = this._pan(v, clamp(-pan * 0.6 + rnd(-0.3, 0.3), -0.8, 0.8));
        henv.connect(hp); hp.connect(this._harmIn);
        v.fades.push(henv);
        ctl.henv = henv; ctl.hlp = hlp;
      }
      ctl.ng = ng;
      ctl.end = end;
      return ctl;
    }

    // ---------------------------------------------------------------- held voices (breath, sub)
    startHeld(opts) {
      const dead = { setFreq() {}, setPressure() {}, release() {} };
      if (!this.started) return dead;
      try {
        opts = opts || {};
        const ctx = this.ctx;
        const voice = AmbientEngine.normVoice(opts.voice) === 'sub' ? 'sub' : 'breath';
        let f = clamp(num(opts.freq, 220), 20, 8000);
        const vel = clamp01(num(opts.velocity, 0.6));
        const pan = clamp(num(opts.pan, 0), -1, 1);
        const b = clamp01(num(opts.brightness, 0.5));
        const now = ctx.currentTime, t0 = now + 0.01;
        const A = NOTE_BASE * 0.9 * Math.pow(Math.max(vel, 0.05), 1.3) * pitchComp(f);
        let pressure = clamp01(num(opts.pressure, 0.5));
        const v = this._newVoice(t0, pan, true);
        const self = this;
        let ctl;
        if (voice === 'breath') {
          ctl = this._breath(v, f, t0, A, b, { vel, held: true, pan, scoop: num(opts.scoop, 80), harm: opts.harm });
        } else {
          ctl = this._heldSub(v, f, t0, A, b);
        }
        const pm = (pr) => ctl.A * (0.3 + 0.7 * pr);
        const cm = (pr) => 0.8 + 1.6 * pr;
        const swellEnd = t0 + (ctl.att || 0.1) * (ctl.henv ? 1.7 : 1) + 0.03;
        // settle onto the held pressure after the swell
        try {
          tgt(ctl.env.gain, pm(pressure), swellEnd, 0.15);
          if (ctl.henv) tgt(ctl.henv.gain, pm(pressure), swellEnd, 0.15);
        } catch (e) { this._err(e); }
        const h = {
          _dead: false, _released: false, voice,
          setFreq(fr, glide) {
            if (h._dead || h._released) return;
            try {
              const n = ctx.currentTime;
              f = clamp(num(fr, f), 20, 8000);
              const tau = clamp(num(glide, 0.08), 0.005, 10) / 3;      // portamento = LP on pitch CV
              for (const P of ctl.pitched) { hold(P.o.frequency, n); tgt(P.o.frequency, f * P.ratio, n, tau); }
              for (const lp of ctl.lps || [ctl.lp]) { hold(lp.frequency, n); tgt(lp.frequency, ctl.cut(cm(pressure), f), n, tau + 0.02); }
              if (ctl.hlp) { hold(ctl.hlp.frequency, n); tgt(ctl.hlp.frequency, ctl.cut(cm(pressure) * 0.8, f), n, tau + 0.02); }
            } catch (e) { self._err(e); }
          },
          setPressure(pr) {
            if (h._dead || h._released) return;
            try {
              const n = ctx.currentTime;
              pressure = clamp01(num(pr, pressure));
              const tN = Math.max(n, swellEnd);
              hold(ctl.env.gain, tN); tgt(ctl.env.gain, pm(pressure), tN, 0.06);
              if (ctl.henv) { hold(ctl.henv.gain, tN); tgt(ctl.henv.gain, pm(pressure), tN, 0.08); }
              for (const lp of ctl.lps || [ctl.lp]) { hold(lp.frequency, tN); tgt(lp.frequency, ctl.cut(cm(pressure), f), tN, 0.06); }
              if (ctl.ng) { hold(ctl.ng.gain, tN); tgt(ctl.ng.gain, ctl.nS * (0.5 + 1.4 * pressure), tN, 0.08); }
            } catch (e) { self._err(e); }
          },
          release(relSec) {
            if (h._dead || h._released) return;
            h._released = true;
            try {
              const n = ctx.currentTime;
              const rel = clamp(num(relSec, 2.5), 0.05, 30);
              if (ctl.vg) { hold(ctl.vg.gain, n); lin(ctl.vg.gain, 0, n + rel * 0.6 + 0.01); }
              for (const g of [ctl.env, ctl.henv]) {
                if (!g) continue;
                hold(g.gain, n);
                if (n >= swellEnd) { expo(g.gain, floorOf(ctl.A), n + rel); lin(g.gain, 0, n + rel + 0.02); } else lin(g.gain, 0, n + rel);
              }
              v.held = false;
              self._finish(v, n + rel + 0.06);
            } catch (e) { self._err(e); }
          },
        };
        v.handle = h;
        this._held.add(h);
        return h;
      } catch (e) { this._err(e); return dead; }
    }

    _heldSub(v, f, t0, A, b) {
      const ctl = { pitched: [], att: 0.06, A: A * 1.6 };
      const saw = this._osc(v, 'sawtooth', f, t0); saw.detune.value = -4;
      const pul = this._wave(v, this._pulseWave, f, t0); pul.detune.value = 4;
      ctl.pitched.push({ o: saw, ratio: 1 }, { o: pul, ratio: 1 });
      const sg = this._gainN(v, 0.42), pg = this._gainN(v, 0.5);
      saw.connect(sg); pul.connect(pg);
      ctl.cut = (m, ff) => clamp(340 * Math.pow((ff || f) / 220, 0.5) * m * (1 + 0.6 * b), 90, 6000);
      const lp1 = this._filt(v, 'lowpass', ctl.cut(1), qdb(0.54)), lp2 = this._filt(v, 'lowpass', ctl.cut(1), qdb(2));
      for (const lp of [lp1, lp2]) { sv(lp.frequency, ctl.cut(3.2), t0); tgt(lp.frequency, ctl.cut(1.6), t0 + 0.01, 0.25); }
      ctl.lps = [lp1, lp2];
      sg.connect(lp1); pg.connect(lp1); lp1.connect(lp2);
      const env = this._gainN(v, 0);
      sv(env.gain, 0, t0); lin(env.gain, ctl.A, t0 + 0.06);
      lp2.connect(env); env.connect(v.vout);
      ctl.env = env;
      return ctl;
    }

    // ---------------------------------------------------------------- drone
    setDrone(opts) {
      opts = opts || {};
      let freqs = Array.isArray(opts.freqs) ? opts.freqs : [];
      freqs = freqs.map((x) => num(x, NaN)).filter((x) => isFinite(x) && x > 0).map((x) => clamp(x, 20, 2000));
      freqs.sort((a, b) => a - b);
      freqs = freqs.filter((x, i) => i === 0 || Math.abs(x - freqs[i - 1]) > 0.5).slice(0, 6);
      const glide = clamp(num(opts.glide, 8), 0.3, 60);
      if (!this.started) { this._pendingDrone = { freqs, glide }; return; }
      try {
        const now = this.ctx.currentTime + 0.02;
        for (const L of this._droneLayers) if (!L.fading) this._fadeLayer(L, now, glide);
        if (freqs.length) this._droneLayers.push(this._buildLayer(freqs, now, glide));
        let alive = this._droneLayers.filter((L) => !L.freed && !L.dying);
        while (alive.length > 3) {
          const L = alive[0];
          this._fadeLayer(L, now, 0.4, true);
          L.dying = true;
          alive = alive.slice(1);
        }
        const all = this._droneLayers.filter((L) => !L.freed);
        for (let i = 0; i < all.length - 6; i++) this._fadeLayer(all[i], now, 0.03, true);
      } catch (e) { this._err(e); }
    }

    _droneCutFor(f) { return clamp(MAP.droneCutHz(this._params.droneCut) * Math.pow(f / 110, 0.5), 80, 6000); }

    _droneUpdate(ramp) {
      const now = this.ctx.currentTime, beat = MAP.droneBeatHz(this._params.droneBeat);
      for (const L of this._droneLayers) {
        if (L.freed || L.fading) continue;
        for (const T of L.tones) {
          rampTo(T.s2.frequency, T.f + beat * T.k, now, ramp, true);
          rampTo(T.lp.frequency, this._droneCutFor(T.f), now, ramp, true);
        }
      }
    }

    // per tone: 2 saws detuned by a beat rate in Hz + triangle → resonant LP (slow LFO on cutoff),
    // breathing level + auto-pan; sub sine under the lowest tone (never below 36 Hz)
    _buildLayer(freqs, t, glide) {
      const ctx = this.ctx;
      const L = { nodes: [], srcs: [], live: 0, freed: false, fading: false, pts: [], stopAt: Infinity, tones: [] };
      const out = ctx.createGain();
      out.gain.value = 0;
      L.nodes.push(out); L.out = out;
      out.connect(this._droneBus);
      const addSrc = (s) => {
        L.nodes.push(s); L.srcs.push(s); L.live++;
        s.onended = () => { L.live--; if (L.live <= 0) this._freeLayer(L); };
        s.start(t);
        return s;
      };
      const osc = (type, f) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; return addSrc(o); };
      const gain = (g) => { const n = ctx.createGain(); n.gain.value = g; L.nodes.push(n); return n; };
      const n = freqs.length;
      const per = 0.4 / Math.sqrt(n);
      const beat = MAP.droneBeatHz(this._params.droneBeat);
      freqs.forEach((f, i) => {
        const k = rnd(0.75, 1.3) * (i % 2 ? 1 : -1);
        const mix = gain(1);
        const s1 = osc('sawtooth', f);
        const s2 = osc('sawtooth', Math.max(1, f + beat * k));
        const tr = osc('triangle', f);
        const sg = gain(0.3), tg = gain(0.9);
        // the beating pair is split L/R, so the beat becomes slow motion in space
        const side = i % 2 ? 1 : -1;
        const p1 = this._panner(-0.6 * side), p2 = this._panner(0.6 * side);
        L.nodes.push(p1, p2);
        s1.connect(p1); s2.connect(p2); p1.connect(sg); p2.connect(sg); sg.connect(mix); tr.connect(tg); tg.connect(mix);
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = qdb(1.25);
        lp.frequency.value = this._droneCutFor(f); L.nodes.push(lp);
        const amp = gain(per * clamp(Math.pow(f / 110, -0.35), 0.8, 1.25));   // register compensation
        const pn = this._panner(n > 1 ? (i / (n - 1) - 0.5) * 0.8 * (i % 2 ? 1 : -1) : 0);
        L.nodes.push(pn);
        mix.connect(lp); lp.connect(amp); amp.connect(pn); pn.connect(out);
        const period = rnd(15, 40);
        const lfo = osc('sine', 1 / period);
        const lc = gain(380), la = gain(per * 0.22);           // ±380 ¢ on the VCF, ±22 % level
        lfo.connect(lc); lc.connect(lp.detune); lfo.connect(la); la.connect(amp.gain);
        if (pn.pan) {
          const plfo = osc('sine', 1 / (period * rnd(1.4, 2.1)));
          const pg = gain(0.4);
          plfo.connect(pg); pg.connect(pn.pan);
        }
        L.tones.push({ f, k, s2, lp });
      });
      // sub floor: an octave under the bass, folded up so it never sits below ~36 Hz
      const subF = freqs[0] / 2 >= 36 ? freqs[0] / 2 : freqs[0];
      if (subF >= 36) {
        const sub = osc('sine', subF);
        const sg = gain(per * (subF < freqs[0] ? 0.45 : 0.12));
        sub.connect(sg); sg.connect(out);
      }
      L.pts = [{ t, v: 0 }, { t: t + glide * 0.5, v: 0.7 }, { t: t + glide, v: 1 }];
      sv(out.gain, 0, t); lin(out.gain, 0.7, t + glide * 0.5); lin(out.gain, 1, t + glide);
      return L;
    }

    _fadeLayer(L, t, dur, shorten) {
      if (L.freed) return;
      if (L.fading && !shorten) return;
      const endAt = t + dur;
      if (L.fading && endAt >= L.stopAt - 0.12) return;
      const v = evalPL(L.pts, t);
      hold(L.out.gain, t, v);
      L.pts = [{ t, v }, { t: t + dur * 0.5, v: v * 0.7 }, { t: endAt, v: 0 }];
      lin(L.out.gain, v * 0.7, t + dur * 0.5);
      lin(L.out.gain, 0, endAt);
      L.fading = true;
      L.stopAt = endAt + 0.1;
      for (const s of L.srcs) { try { s.stop(L.stopAt); } catch (e) { /* ignore */ } }
    }

    _freeLayer(L) {
      if (L.freed) return;
      L.freed = true;
      for (const n of L.nodes) { if (n.onended) n.onended = null; try { n.disconnect(); } catch (e) { /* ignore */ } }
      L.nodes.length = 0; L.srcs.length = 0; L.tones.length = 0;
      const i = this._droneLayers.indexOf(L);
      if (i >= 0) this._droneLayers.splice(i, 1);
    }

    // ---------------------------------------------------------------- noise generators (2 channels)
    setNoise(ch, partial, rampSec) {
      ch = Math.round(num(ch, -1));
      if (ch !== 0 && ch !== 1) return;
      if (!partial || typeof partial !== 'object') return;
      const S = this._noiseState[ch];
      if (NOISE_TYPES.indexOf(partial.type) >= 0) S.type = partial.type;
      if (FILTER_MODES.indexOf(partial.mode) >= 0) S.mode = partial.mode;
      for (const k of NOISE_NUM) if (k in partial) S[k] = clamp01(num(partial[k], S[k]));
      if (!this.started) return;
      try { this._noiseApply(ch, clamp(num(rampSec, 1), 0.02, 120)); } catch (e) { this._err(e); }
    }
    getNoise(ch) {
      ch = Math.round(num(ch, -1));
      if (ch !== 0 && ch !== 1) return null;
      return Object.assign({}, this._noiseState[ch]);
    }

    _noiseApply(ch, ramp) {
      const S = this._noiseState[ch], C = this._nch[ch], now = this.ctx.currentTime;
      while (C.old.length > 2) this._noiseTeardown(C.old.shift());   // rapid toggling: ≤ 3 fading
      if (S.level <= 0.0005) {
        if (C.cur) { this._noiseFade(C.cur, now, ramp); C.old.push(C.cur); C.cur = null; }
        return;
      }
      let fadeIn = ramp;
      if (C.cur && (C.cur.type !== S.type || C.cur.mode !== S.mode)) {
        this._noiseFade(C.cur, now, 0.5); C.old.push(C.cur); C.cur = null; fadeIn = 0.5;
      }
      if (!C.cur) {
        C.cur = this._noiseBuild(S, now);
        rampTo(C.cur.out.gain, curves.noiseLevel(S.level), now, fadeIn);
      } else {
        this._noiseUpdate(C.cur, S, now, ramp, false);
        rampTo(C.cur.out.gain, curves.noiseLevel(S.level), now, ramp);
      }
    }

    _noiseFade(N, now, dur) {
      rampTo(N.out.gain, 0, now, dur);
      N.stopAt = now + dur + 0.1;
    }

    _noiseGain(S) {
      const fc = MAP.noiseCutHz(S.cutoff), Q = MAP.noiseQ(S.res);
      const P = powerFrac(S.type, S.mode, fc, Q);
      if (S.type === 'dust') {
        // impulses: normalise the *peak* of one filtered impulse (≈ ωc·0.7 LP, 1.5·ω0/Q BP, ≈1 HP)
        const w = 2 * Math.PI * Math.min(fc, 20000) / (this.ctx ? this.ctx.sampleRate : 48000);
        const hp = S.mode === 'lp' ? Math.min(1, 0.7 * w * Math.max(1, Math.sqrt(Q))) : S.mode === 'bp' ? Math.min(1, w / Q) : 0.3;
        return DUST_PEAK / Math.max(hp, 0.004);
      }
      let g = Math.min(20, Math.pow(1 / Math.max(P, 1e-5), 0.35));
      return g * NOISE_TYPE_GAIN[S.type];
    }

    _noiseBuild(S, now) {
      const ctx = this.ctx;
      const N = { type: S.type, mode: S.mode, nodes: [], srcs: [], stopAt: null, next: now + 0.02, state: S };
      const node = (n) => { N.nodes.push(n); return n; };
      const gain = (g) => { const x = ctx.createGain(); x.gain.value = g; return node(x); };
      const osc = (f) => { const o = ctx.createOscillator(); o.frequency.value = f; o.start(now); N.srcs.push(o); return node(o); };
      N.out = gain(0); N.out.connect(this._noiseIn);
      N.amp = gain(1); N.amp.connect(N.out);
      N.comp = gain(1); N.comp.connect(N.amp);
      N.filt = node(ctx.createBiquadFilter());
      N.filt.type = { lp: 'lowpass', bp: 'bandpass', hp: 'highpass' }[S.mode];
      N.filt.connect(N.comp);
      if (S.type === 'dust') {
        N.in = gain(1); N.in.connect(N.filt);
      } else {
        const s = ctx.createBufferSource();
        s.buffer = this._noise[S.type]; s.loop = true;
        s.start(now, Math.random() * (s.buffer.duration - 0.1));
        N.srcs.push(s); node(s);
        N.wide = gain(0); N.mono = gain(0);
        N.mono.channelCount = 1; N.mono.channelCountMode = 'explicit'; N.mono.channelInterpretation = 'speakers';
        s.connect(N.wide); s.connect(N.mono); N.wide.connect(N.filt); N.mono.connect(N.filt);
      }
      // irregular LFO: two sines at the golden ratio, summed
      const r = MAP.lfoHz(S.lfoRate);
      N.l1 = osc(r); N.l2 = osc(r * 1.618034);
      const a1 = gain(0.6), a2 = gain(0.4), sum = gain(1);
      N.l1.connect(a1); N.l2.connect(a2); a1.connect(sum); a2.connect(sum);
      N.fdep = gain(0); N.adep = gain(0);
      sum.connect(N.fdep); N.fdep.connect(N.filt.detune);
      sum.connect(N.adep); N.adep.connect(N.amp.gain);
      this._noiseUpdate(N, S, now, 0.02, true);
      return N;
    }

    _noiseUpdate(N, S, now, ramp, init) {
      const set = (p, x, e) => { if (init) sv(p, x, now); else rampTo(p, x, now, ramp, e); };
      const Q = MAP.noiseQ(S.res);
      set(N.filt.frequency, MAP.noiseCutHz(S.cutoff), true);
      set(N.filt.Q, N.mode === 'bp' ? Q : qdb(Q), false);
      set(N.comp.gain, this._noiseGain(S), false);
      const r = MAP.lfoHz(S.lfoRate);
      set(N.l1.frequency, r, true); set(N.l2.frequency, r * 1.618034, true);
      set(N.fdep.gain, 3000 * S.lfoDepth, false);          // ±2.5 oct at depth 1
      set(N.adep.gain, 0.6 * S.lfoDepth / (1 + 0.6 * S.lfoDepth), false);
      set(N.amp.gain, 1 / (1 + 0.6 * S.lfoDepth), false);   // AM up to 60 %, peak-normalised
      if (N.wide) { set(N.wide.gain, S.width, false); set(N.mono.gain, (1 - S.width) * 1.41, false); }
    }

    _noiseTeardown(N) {
      if (N.dead) return;
      N.dead = true;
      for (const s of N.srcs) { try { s.onended = null; s.stop(); } catch (e) { /* ignore */ } }
      for (const n of N.nodes) { try { n.disconnect(); } catch (e) { /* ignore */ } }
      N.nodes.length = 0; N.srcs.length = 0;
    }

    _dust(N, t) {
      const S = N.state, ctx = this.ctx;
      const pb = clamp(Math.round(((rnd(-1, 1) * S.width) + 1) / 2 * 7), 0, 7);
      const ab = Math.min(5, Math.floor(6 * Math.pow(Math.random(), 1.6)));
      const s = ctx.createBufferSource();
      s.buffer = this._dustBufs[pb * 6 + ab];
      s.connect(N.in);
      s.onended = () => { s.onended = null; try { s.disconnect(); } catch (e) { /* ignore */ } };
      s.start(t);
    }

    // ---- v1 legacy textures: accepted and remembered, but silent (v2 uses setNoise)
    setTextureLevel(name, level) {
      if (TEXTURES.indexOf(name) < 0) return;
      this._texLevels[name] = clamp01(num(level, 0));
    }
    getTextureLevel(name) { return this._texLevels[name] || 0; }

    /** scheduler tick: dust impulses (Poisson) + noise channel teardown. Public for tests. */
    tick() {
      if (!this.ctx || !this.started) return;
      const now = this.ctx.currentTime;
      const until = now + this._lookahead;
      for (const C of this._nch) {
        if (C.old.length) C.old = C.old.filter((N) => { if (N.stopAt !== null && now >= N.stopAt) { this._noiseTeardown(N); return false; } return true; });
        const N = C.cur;
        if (N && now >= (N.walkAt || 0)) {          // slow random walk on the VCF, on top of the LFO
          try {
            const dpt = N.state.lfoDepth;
            const span = MAP.lfoHz(N.state.lfoRate);
            tgt(N.filt.detune, rnd(-1, 1) * (300 + 1500 * dpt), now, clamp(1.5 / span, 1, 12) * rnd(0.5, 1.5));
            N.walkAt = now + clamp(2 / span, 2, 20) * rnd(0.5, 1.5);
          } catch (e) { this._err(e); }
        }
        if (N && N.type === 'dust') {
          try {
            const rate = MAP.dustRate(N.state.density);
            if (N.next < now) N.next = now + rnd(0.005, 0.05);
            let guard = 0;
            while (N.next < until && guard++ < 500) {
              this._dust(N, N.next);
              N.next += -Math.log(1 - Math.random() * 0.999) / rate;
            }
          } catch (e) { this._err(e); }
        }
      }
    }

    // ---------------------------------------------------------------- events
    /** engine.event(name, opts, time) → duration in seconds (0 for unknown / composer-side events) */
    event(name, opts, time) {
      if (!this.started) return 0;
      try {
        opts = opts && typeof opts === 'object' ? opts : {};
        const now = this.ctx.currentTime;
        const t0 = Math.max(num(time, now), now + 0.01);
        this._evLevel = clamp(num(opts.level, 1), 0, 1.5);
        switch (name) {
          case 'cluster': return this._evCluster(opts, t0);
          case 'ping': return this._evPing(opts, t0);
          case 'sh': return this._evSH(opts, t0);
          case 'sweep': return this._evSweep(opts, t0);
          case 'reverse': return this._evReverse(opts, t0);
          case 'capture': return this._evCapture(opts, t0);
          case 'ring': return this._evRing(opts, t0);
          default: return 0;
        }
      } catch (e) { this._err(e); return 0; }
    }

    _evSet(t0, pan) {
      const v = this._newSet('fx', t0, pan || 0, false, this._eventsIn, 'event');
      const L = num(this._evLevel, 1);
      if (v && L !== 1) v.vout.gain.value = v.vout.gain.value * L;
      return v;
    }

    // Ligeti-style micropolyphony (Atmosphères at a whisper): a dense band of cheap sines spread
    // continuously across ±spread cents around each centre (every 3rd voice a formant saw), each on its
    // own slow glissando path; the band contracts onto the centres over the last third; ppp → mp → ppp
    _evCluster(o, t0) {
      const C = freqList(o.freqs, [146.83, 220, 329.63], 30, 4000, 8);
      const count = clamp(Math.round(num(o.count, 20)), 1, 32);
      const spread = clamp(num(o.spread, 150), 0, 600);
      const dur = clamp(num(o.dur, 24), 4, 180);
      const v = this._evSet(t0, 0);
      if (!v) return 0;
      const tE = t0 + dur;
      const groups = [-0.75, -0.25, 0.25, 0.75].map((p, gi) => {
        const g = this._gainN(v, 0);
        const off = (gi - 1.5) * dur * 0.03;              // the swell drifts across the field
        sv(g.gain, 0, t0);
        lin(g.gain, 0.08, t0 + dur * 0.16 + off);
        lin(g.gain, 1, t0 + dur * 0.4 + off);
        lin(g.gain, 0.8, t0 + dur * 0.72 - off);
        expo(g.gain, 0.0006, tE - 0.05);
        lin(g.gain, 0, tE);
        const pn = this._pan(v, p);
        g.connect(pn); pn.connect(v.vout);
        return g;
      });
      // shared "choral" formant pair for the saws, vowel morphs oo → ah over the event
      const fsum = this._gainN(v, 1);
      const b1 = this._filt(v, 'bandpass', 520, 4), b2 = this._filt(v, 'bandpass', 1400, 6);
      sv(b1.frequency, 520, t0); expo(b1.frequency, 800, tE); sv(b2.frequency, 1400, t0); expo(b2.frequency, 1150, tE);
      const lp = this._filt(v, 'lowpass', 2200, qdb(0.707));
      fsum.connect(b1); fsum.connect(b2); b1.connect(lp); b2.connect(lp); lp.connect(groups[1]); lp.connect(groups[2]);
      const per = EV_BASE * 0.34 / Math.sqrt(count);
      for (let i = 0; i < count; i++) {
        const c = C[i % C.length];
        const saw = i % 3 === 2;
        const osc = this._osc(v, saw ? 'sawtooth' : 'sine', c, t0);
        const d = osc.detune;
        // home position: evenly through the band (+ jitter), so it is a continuous band, not lines
        const k = Math.floor(i / C.length), nPer = Math.ceil(count / C.length);
        const home = spread * (nPer > 1 ? (k / (nPer - 1)) * 2 - 1 : 0) + rnd(-25, 25);
        const w = spread * 0.35;
        sv(d, home + rnd(-w, w), t0);
        lin(d, home + rnd(-w, w), t0 + dur * rnd(0.18, 0.32));
        lin(d, home + rnd(-w, w), t0 + dur * rnd(0.4, 0.58));
        lin(d, home * 0.85 + rnd(-w, w) * 0.5, t0 + dur * 0.64);
        lin(d, rnd(-6, 6), t0 + dur * rnd(0.84, 0.92));
        const g = this._gainN(v, per * rnd(0.6, 1.15) * pitchComp(c * Math.pow(2, home / 1200)) * (saw ? 0.3 : 1));
        osc.connect(g); g.connect(saw ? fsum : groups[(i * 7) % 4]);
      }
      this._finish(v, tE + 0.05);
      return dur;
    }

    // impulses ringing high-Q band-pass filters: BP(Q 60–120) → BP(Q for the ring time) → soft
    // 30–80 ms bloom and a long exponential ring at the filter frequency (no oscillator)
    _evPing(o, t0) {
      const fr = freqList(o.freqs, [880, 1174.66, 1318.51], 60, 8000, 12);
      const spacing = clamp(num(o.spacing, 0.18), 0, 4);
      const v = this._evSet(t0, 0);
      if (!v) return 0;
      const sr = this.ctx.sampleRate;
      let t = t0, end = t0;
      fr.forEach((f, i) => {
        if (i) t += spacing * rnd(0.6, 1.4);
        const Q1 = rnd(60, 120);
        const T60 = clamp(3.0 - 0.55 * Math.log2(f / 440), 1.1, 4.0);
        const Q2 = clamp(Math.PI * f * T60 / 6.91, Q1 * 1.5, 4000);
        const tau2 = Q2 / (Math.PI * f);
        const src = this._once(v, this._imp, t);
        const b1 = this._filt(v, 'bandpass', f, Q1), b2 = this._filt(v, 'bandpass', f, Q2);
        const a = EV_BASE * 1.0 * rnd(0.55, 1) * pitchComp(f);
        const g = this._gainN(v, a / ringPeak(f, Q1, tau2, sr));
        const pn = this._pan(v, rnd(-0.8, 0.8));
        src.connect(b1); b1.connect(b2); b2.connect(g); g.connect(pn); pn.connect(v.vout);
        end = Math.max(end, t + T60 * 1.15 + 0.2);
      });
      this._keep(v, t0);
      this._finish(v, end);
      return end - t0;
    }

    // sample & hold: square/saw → resonant LP with a fast filter env per step, short gate, random pans
    _evSH(o, t0) {
      const fr = freqList(o.freqs, [220, 293.66, 329.63, 440, 587.33], 40, 4000, 32);
      const rate = clamp(num(o.rate, 7), 0.5, 24);
      const steps = clamp(Math.round(num(o.steps, 12)), 1, 128);
      const v = this._evSet(t0, 0);
      if (!v) return 0;
      const sq = Math.random() < 0.5;
      const osc = this._osc(v, sq ? 'square' : 'sawtooth', fr[0], t0);
      const lp = this._filt(v, 'lowpass', 800, qdb(3.2));
      const vca = this._gainN(v, 0);
      const pn = this._pan(v, 0);
      const ds = this._gainN(v, 0.5);
      osc.connect(lp); lp.connect(vca); vca.connect(pn); pn.connect(v.vout); pn.connect(ds); ds.connect(this._echoIn);
      v.fades.push(ds);
      const per = 1 / rate, gate = Math.min(0.5 * per, 0.12);
      const a0 = EV_BASE * 1.1 * (sq ? 0.75 : 1);
      sv(vca.gain, 0, t0);
      for (let k = 0; k < steps; k++) {
        const ts = t0 + k * per + rnd(0, 0.004);
        const f = pick(fr);
        const ak = a0 * rnd(0.5, 1) * pitchComp(f);
        sv(osc.frequency, f, ts);
        sv(lp.frequency, clamp(f * rnd(3, 6), 300, 6000), ts);
        tgt(lp.frequency, clamp(f * 1.1, 120, 3000), ts + 0.003, rnd(0.025, 0.05));
        sv(vca.gain, 0, ts);
        lin(vca.gain, ak, ts + 0.005);
        expo(vca.gain, ak * 0.2, ts + gate * 0.75);
        lin(vca.gain, 0, ts + gate);
        if (pn.pan) sv(pn.pan, rnd(-0.75, 0.75), ts);
      }
      const end = t0 + steps * per + 0.05;
      this._finish(v, end);
      return end - t0;
    }

    // noise through a near-self-oscillating BP sweeping exponentially + faint heterodyne whistle
    _evSweep(o, t0) {
      const from = clamp(num(o.from, 300), 40, 10000), to = clamp(num(o.to, 3200), 40, 10000);
      const dur = clamp(num(o.dur, 9), 1, 60);
      const res = clamp01(num(o.res, 0.85));
      const v = this._evSet(t0, 0);
      if (!v) return 0;
      const tE = t0 + dur;
      const src = this._loopSrc(v, this._noise.pink, t0, 1);
      const Q = 1.5 + 70 * res * res;
      const bp = this._filt(v, 'bandpass', from, Q);
      sv(bp.frequency, from, t0); expo(bp.frequency, to, tE);
      const lp = this._filt(v, 'lowpass', from * 2, qdb(0.707));
      sv(lp.frequency, clamp(from * 2, 200, 12000), t0); expo(lp.frequency, clamp(to * 2, 200, 12000), tE);
      const comp = this._gainN(v, 2.2 * Math.sqrt(Q));
      const wh = this._osc(v, 'sine', from * 1.004, t0);
      sv(wh.frequency, from * 1.004, t0); expo(wh.frequency, to * 1.004, tE);
      const wg = this._gainN(v, 0.1);
      const env = this._gainN(v, 0);
      const A = EV_BASE * 0.6 * Math.min(pitchComp(from), pitchComp(to)) ** 0.5;
      const p = env.gain;
      sv(p, 0, t0); lin(p, A * 0.5, t0 + dur * 0.2); lin(p, A, t0 + dur * 0.45); lin(p, A * 0.85, t0 + dur * 0.7);
      expo(p, floorOf(A), tE); lin(p, 0, tE + 0.02);
      const pan0 = rnd(-0.6, 0.6);
      const pn = this._pan(v, pan0);
      if (pn.pan) { sv(pn.pan, pan0, t0); lin(pn.pan, -pan0 * 0.8, tE); }
      src.connect(bp); bp.connect(lp); lp.connect(comp); comp.connect(env);
      wh.connect(wg); wg.connect(env); env.connect(pn); pn.connect(v.vout);
      this._finish(v, tE + 0.05);
      return dur;
    }

    // reverse swell: chord whose VCA rises exponentially (convex) while its LP opens, cut with 30 ms
    // release; heavy reverb send so the tail blooms after the cut
    _evReverse(o, t0) {
      const fr = freqList(o.freqs, [220, 277.18, 329.63], 30, 3000, 8);
      const dur = clamp(num(o.dur, 5), 1, 30);
      const v = this._evSet(t0, rnd(-0.2, 0.2));
      if (!v) return 0;
      const tE = t0 + dur;
      const mix = this._gainN(v, 1 / Math.sqrt(fr.length));
      for (const f of fr) {
        const s = this._osc(v, 'sine', f, t0);
        const w = this._osc(v, 'sawtooth', f, t0); w.detune.value = rnd(-4, 4);
        const sg = this._gainN(v, 0.75 * pitchComp(f)), wg = this._gainN(v, 0.2 * pitchComp(f));
        s.connect(sg); w.connect(wg); sg.connect(mix); wg.connect(mix);
      }
      const lo = Math.min.apply(null, fr);
      const lp = this._filt(v, 'lowpass', lo, qdb(0.9));
      sv(lp.frequency, clamp(lo * 1.1, 80, 4000), t0); expo(lp.frequency, clamp(lo * 6, 300, 6000), tE);
      const env = this._gainN(v, 0);
      const A = EV_BASE * 0.3;
      const relR = o.soft ? 0.6 : 0.03;
      // gentle convex rise (40 dB, exponential), filter opening with it; 30 ms tape-cut (soft: 600 ms)
      sv(env.gain, 0, t0); lin(env.gain, A * 0.01, t0 + 0.4); expo(env.gain, A * 0.25, t0 + dur * 0.75); expo(env.gain, A, tE);
      if (o.soft) { expo(env.gain, floorOf(A), tE + relR); lin(env.gain, 0, tE + relR + 0.02); } else lin(env.gain, 0, tE + relR);
      const rs = this._gainN(v, 1.3);
      mix.connect(lp); lp.connect(env); env.connect(v.vout); env.connect(rs); rs.connect(this._revIn);
      v.fades.push(rs);
      this._finish(v, tE + relR + 0.06);
      return dur;
    }

    // ring modulation: sine(freq) × sine(mod, slowly gliding) → sum/difference sidebands only
    _evRing(o, t0) {
      const f = clamp(num(o.freq, 220), 30, 6000);
      const m0 = clamp(num(o.mod, f * 1.37), 0.5, 6000);
      const dur = clamp(num(o.dur, 7), 1.5, 60);
      const v = this._evSet(t0, rnd(-0.35, 0.35));
      if (!v) return 0;
      const tE = t0 + dur;
      const car = this._osc(v, 'sine', f, t0);
      const mod = this._osc(v, 'sine', m0, t0);
      sv(mod.frequency, m0, t0); expo(mod.frequency, m0 * rnd(0.88, 1.14), tE);
      const rm = this._gainN(v, 0);
      car.connect(rm); mod.connect(rm.gain);
      const rhp = this._filt(v, 'highpass', 160, qdb(0.707));      // no difference-tone rumble
      const lp = this._filt(v, 'lowpass', 4500, qdb(0.707));
      const env = this._gainN(v, 0);
      const A = EV_BASE * 0.3 * pitchComp(f + m0);
      const p = env.gain;
      sv(p, 0, t0); lin(p, A * 0.25, t0 + 0.5); lin(p, A, t0 + 1.5);
      expo(p, A * 0.3, t0 + Math.max(1.6, dur * 0.6)); expo(p, floorOf(A), tE); lin(p, 0, tE + 0.02);
      const rs = this._gainN(v, 0.8);
      rm.connect(rhp); rhp.connect(lp); lp.connect(env); env.connect(v.vout); env.connect(rs); rs.connect(this._revIn);
      v.fades.push(rs);
      this._finish(v, tE + 0.05);
      return dur;
    }

    // Frippertronics capture: open the loop send, feedback → ~0.93 for dur, back over 6 s
    _evCapture(o, t0) {
      const dur = clamp(num(o.dur, 16), 1, 300);
      const tEnd = t0 + dur;
      const fb = MAP.loopFb(this._params.loopFb);
      const cf = Math.max(0, 0.93 - fb);
      for (const [g, x] of [[this._capSendT, 0.6], [this._capSendE, 0.45], [this._capFb, cf]]) {
        hold(g.gain, t0);
        lin(g.gain, x, t0 + 1.5);
        lin(g.gain, x, Math.max(tEnd, t0 + 1.6));
        lin(g.gain, 0, Math.max(tEnd, t0 + 1.6) + 6);
      }
      this._capture = { start: t0, end: Math.max(tEnd, t0 + 1.6) };
      return dur + 6;
    }

    // ---------------------------------------------------------------- perc
    perc(opts) {
      if (!this.started || !opts) return;
      try {
        const voice = PERC_VOICES.indexOf(opts.voice) >= 0 ? opts.voice : 'membrane';
        const now = this.ctx.currentTime;
        const t0 = Math.max(num(opts.time, now), now + 0.003);
        const vel = clamp01(num(opts.velocity, 0.7));
        if (vel < 0.01) return;
        const pan = clamp(num(opts.pan, 0), -1, 1);
        const v = this._newSet('fx', t0, pan, false, this._percIn, 'perc');
        if (!v) return;
        const A = PERC_BASE * Math.pow(vel, 1.4);
        let end;
        if (voice === 'shaker') end = this._pShaker(v, t0, A, opts);
        else if (voice === 'rim') end = this._pRim(v, t0, A, opts);
        else end = this._pMembrane(v, t0, A, opts);
        this._finish(v, end + 0.02);
      } catch (e) { this._err(e); }
    }

    // membrane: tuned sine/triangle with a +7 st → base pitch drop over 40 ms, an inharmonic
    // second mode, and a short band-passed noise transient (udu / tabla / frame drum)
    _pMembrane(v, t0, A, o) {
      const f = clamp(num(o.freq, rnd(90, 180)), 40, 600);
      const dec = clamp(num(o.decay, clamp(0.85 - 0.5 * (f - 90) / 90, 0.25, 0.9)), 0.08, 3);
      const fHi = f * ST(7);
      const body = this._osc(v, 'sine', fHi, t0), tri = this._osc(v, 'triangle', fHi, t0);
      const m2 = this._osc(v, 'sine', fHi * 1.59, t0);
      for (const [osc, r] of [[body, 1], [tri, 1], [m2, 1.59]]) { sv(osc.frequency, fHi * r, t0); expo(osc.frequency, f * r, t0 + 0.04); }
      const mix = this._gainN(v, 1), tg = this._gainN(v, 0.2);
      body.connect(mix); tri.connect(tg); tg.connect(mix);
      const lp = this._filt(v, 'lowpass', clamp(f * 8, 600, 2400), qdb(0.707));
      const env = this._gainN(v, 0);
      mix.connect(lp); lp.connect(env); env.connect(v.vout);
      const p = env.gain;
      sv(p, 0, t0); lin(p, A, t0 + 0.003); expo(p, A * 0.55, t0 + 0.07); expo(p, floorOf(A), t0 + dec); lin(p, 0, t0 + dec + 0.02);
      const g2 = this._gainN(v, 0);
      sv(g2.gain, 0, t0); lin(g2.gain, A * 0.14, t0 + 0.004); expo(g2.gain, floorOf(A), t0 + Math.min(0.16, dec)); lin(g2.gain, 0, t0 + Math.min(0.16, dec) + 0.01);
      m2.connect(g2); g2.connect(lp);
      const n = this._noiseSrc(v, t0, 0.05, 1);
      const nb = this._filt(v, 'bandpass', clamp(f * 3.2, 250, 2200), 1.3);
      const ng = this._gainN(v, 0);
      sv(ng.gain, 0, t0); lin(ng.gain, A * 0.5, t0 + 0.003); expo(ng.gain, floorOf(A), t0 + 0.028); lin(ng.gain, 0, t0 + 0.033);
      n.connect(nb); nb.connect(ng); ng.connect(v.vout);
      return t0 + dec + 0.02;
    }

    // shaker: HP/BP noise, 2–3 micro-grains, soft 6 ms onsets, dark-ish top (LP 9 k)
    _pShaker(v, t0, A, o) {
      const len = clamp(num(o.decay, 0.1), 0.03, 0.6);
      const fc = clamp(num(o.freq, rnd(5500, 7500)), 2000, 9000);
