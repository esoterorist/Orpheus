          ctx.fillRect(x - 2.5, y - 2.5, 5, 5);
          ctx.strokeStyle = COL.ink; ctx.globalAlpha = 0.5;
          ctx.beginPath(); ctx.moveTo(x - 7, y + 0.5); ctx.lineTo(x + 7, y + 0.5); ctx.stroke();
        }
        ctx.globalAlpha = 1; ctx.lineWidth = hair;
      });
      for (let k = rb.fades.length - 1; k >= 0; k--) {
        const f = rb.fades[k], age = (T - f.t0) / 0.7;
        if (age >= 1) { rb.fades.splice(k, 1); continue; }
        const x = Math.round(f.x01 * w) + 0.5;
        ctx.strokeStyle = COL.ink; ctx.globalAlpha = 0.5 * (1 - age);
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, hh); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (rb.readT && T > rb.readT && rbRead) { rbRead.textContent = ''; rb.readT = 0; }
    }

    /* =====================================================================================
       6. panel
       ===================================================================================== */
    const UI = { tabs: {}, pages: {}, params: {}, prows: [], trk: [], noise: [null, null], evtRows: {}, evtRate: null, perc: null, selScale: null, selRoot: null };

      /* ---- EVT ---- */
      const ev = UI.pages.evt;

      const elist = h('div', { style: 'margin-top:6px' });
      EVENTS.forEach((name) => {
        const R = { name, until: 0, lit: false };

        elist.appendChild(R.el);

      ev.appendChild(elist);
      ev.appendChild(grp('BUS'));
      paramRow(ev, 'events', 'LEVEL');

      /* ---- PRC ---- */
      const pr = UI.pages.prc;
      const P = { tr: {} };
      const setP = (part) => { call('setPerc', part); S.perc = Object.assign({}, S.perc || {}, part); updateStatus(); };
      pr.appendChild(grp('EUCLID', '16TH'));
      P.on = toggle('Percussion on', (v) => setP({ on: v }));
      pr.appendChild(h('div', { class: 'row' }, [h('span', { class: 'lbl', text: 'RUN' }), h('div', { class: 'tgcell' }, [P.on.el]), h('span')]));
      P.bpm = makeRow({ label: 'BPM', min: 50, max: 110, step: 1, fmt: F.int(''), onInput: (v) => setP({ bpm: Math.round(v) }) });
      P.swing = makeRow({ label: 'SWING', min: 0, max: 0.3, step: 0.005, fmt: F.pct, onInput: (v) => setP({ swing: v }) });
      pr.appendChild(P.bpm.el); pr.appendChild(P.swing.el);
      PERC_TRK.forEach(([k, short, long, voice]) => {
        const Tr = { k, voice, ptr: -1, flash: 0, cells: [], pat: [] };
        const setT = (part) => {
          const cur = Object.assign({}, (S.perc && S.perc[k]) || {}, part);
          if (cur.pulses > cur.steps) cur.pulses = cur.steps;
          if (cur.rot >= cur.steps) cur.rot = cur.steps - 1;
          setP({ [k]: cur });
          paintEuclid(Tr);
        };
        pr.appendChild(grp(short + ' · ' + long));
        Tr.eu = h('div', { class: 'eu', 'aria-hidden': 'true' });
        for (let s = 0; s < 16; s++) { const c = h('i'); Tr.cells.push(c); Tr.eu.appendChild(c); }
        Tr.steps = makeRow({ label: 'STEPS', min: 4, max: 16, step: 1, fmt: F.int(''), aria: long + ' steps', onInput: (v) => { setT({ steps: Math.round(v) }); } });
        Tr.pulses = makeRow({ label: 'PULSES', min: 0, max: 16, step: 1, fmt: F.int(''), aria: long + ' pulses', onInput: (v) => setT({ pulses: Math.round(v) }) });
        Tr.rot = makeRow({ label: 'ROT', min: 0, max: 15, step: 1, fmt: F.int(''), aria: long + ' rotation', onInput: (v) => setT({ rot: Math.round(v) }) });
        Tr.prob = makeRow({ label: 'PROB', aria: long + ' probability', onInput: (v) => setT({ prob: v }) });
        pr.appendChild(h('div', { class: 'eu-wrap' }, [h('span', { class: 'lbl', text: 'PATTERN' }), Tr.eu]));
        [Tr.steps, Tr.pulses, Tr.rot, Tr.prob].forEach((r) => pr.appendChild(r.el));
        P.tr[k] = Tr;
      });
      pr.appendChild(grp('BUS'));
      paramRow(pr, 'perc', 'LEVEL');
      UI.perc = P;

      selectTab(PAGES.indexOf(prefs.tab) >= 0 ? prefs.tab : 'ptn', false);
    }
    function disarm(T) { clearTimeout(T.timer); T.armed = false; T.clr.textContent = 'CLR'; T.clr.classList.remove('armed'); }

    function selectTab(name, focus) {
      prefs.tab = name;
      PAGES.forEach((n) => {
        const sel = n === name;
        UI.tabs[n].setAttribute('aria-selected', sel ? 'true' : 'false');
        UI.tabs[n].setAttribute('tabindex', sel ? '0' : '-1');
        UI.pages[n].hidden = !sel;
      });
      const pg = $('pages'); if (pg) pg.scrollTop = 0;
      if (focus) safe(() => UI.tabs[name].focus());
    }
    function loadPresetUI(id) {
      safe(() => composer.loadPreset(id));
      syncAll(); S.dirty = true;
    }

    /* ---- panel sync from state ---- */
    function updatePtn() {
      UI.prows.forEach((t) => t.el.setAttribute('aria-pressed', t.id === S.presetId ? 'true' : 'false'));
      const st = S.st; if (!st) return;
      if (st.scaleId != null && UI.selScale) UI.selScale.set(st.scaleId);
      if (UI.selRoot) UI.selRoot.set(String(S.rootIdx));
    }
    function updateTrk() {
      UI.trk.forEach((T, i) => {
        const r = S.rings[i];
        if (!r) { T.el.hidden = true; return; }
        T.el.hidden = false;
        if (document.activeElement !== T.eng.sel) T.eng.set(normEng(r.voice));
        T.lenV.textContent = num(+r.period, 0).toFixed(1);
        const n = (r.notes || []).length;
        T.n.textContent = 'n ' + n;
        T.mute.setAttribute('aria-pressed', r.muted ? 'true' : 'false');
        T.el.classList.toggle('muted', !!r.muted);
        T.prob.set(num(r.prob, num(r.chance, 1)));
      });
    }
    function updateSrc() {
      for (let ch = 0; ch < 2; ch++) {
        const N = UI.noise[ch], n = (S.noise && S.noise[ch]) || {};
        if (!N) continue;
        N.type.set(n.type || 'pink'); N.mode.set(n.mode || 'lp');
        N.level.set(num(n.level, 0)); N.cutoff.set(num(n.cutoff, 0.5)); N.res.set(num(n.res, 0.2));
        N.lfoRate.set(num(n.lfoRate, 0.2)); N.lfoDepth.set(num(n.lfoDepth, 0)); N.dens.set(num(n.density, 0.3));
        N.dens.disable((n.type || 'pink') !== 'dust');
      }
    }
    function updateEvt() {
      const en = (S.events && S.events.enabled) || {};
      EVENTS.forEach((name) => {
        const R = UI.evtRows[name]; if (!R) return;
        const v = !!en[name];
        R.tg.set(v); R.el.classList.toggle('dis', !v);
      });
    }
    function updatePrc() {
      const P = UI.perc, pc = S.perc; if (!P) return;
      if (!pc) { P.on.set(false); return; }
      P.on.set(!!pc.on);
      P.bpm.set(num(pc.bpm, 70)); P.swing.set(num(pc.swing, 0));
      PERC_TRK.forEach(([k]) => {
        const Tr = P.tr[k], t = pc[k] || {};
        const steps = clamp(Math.round(num(t.steps, 16)), 4, 16);
        Tr.pulses.setMax(steps); Tr.rot.setMax(Math.max(1, steps - 1));
        Tr.steps.set(steps); Tr.pulses.set(num(t.pulses, 0)); Tr.rot.set(num(t.rot, 0)); Tr.prob.set(num(t.prob, 1));
        paintEuclid(Tr);
      });
    }
    function paintEuclid(Tr) {
      const t = (S.perc && S.perc[Tr.k]) || {};
      const steps = clamp(Math.round(num(t.steps, 16)), 1, 16);
      Tr.pulses.setMax(steps); Tr.rot.setMax(Math.max(1, steps - 1));
      Tr.pat = (Array.isArray(t.pattern) && t.pattern.length === steps) ? t.pattern.map(Boolean) : euclid(steps, t.pulses, t.rot);
      if (Tr.ptr >= steps) Tr.ptr = -1;
      Tr.cells.forEach((c, s) => {
        const cls = s >= steps ? 'x' : (Tr.pat[s] ? 'h' : '') + (s === Tr.ptr && S.clock - Tr.flash < 0.22 ? ' c' : '');
        if (c.className !== cls) c.className = cls;
      });
    }
    function firePerc(e) {
      const v = String(e.voice || '');
      const entry = PERC_TRK.find((p) => p[0] === e.track) || PERC_TRK.find((p) => p[3] === v || p[0] === v);
      if (!entry || !UI.perc) return;
      const Tr = UI.perc.tr[entry[0]];
      const steps = Tr.pat.length || 16;
      if (typeof e.step === 'number' && isFinite(e.step)) Tr.ptr = ((Math.round(e.step) % steps) + steps) % steps;
      else {
        let k = Tr.ptr;
        for (let j = 0; j < steps; j++) { k = (k + 1) % steps; if (Tr.pat[k]) break; }
        Tr.ptr = k;
      }
      Tr.flash = S.clock;
      if (prefs.tab === 'prc' && !S.night) paintEuclid(Tr);
    }

    function syncAll() {
      for (const k in UI.params) UI.params[k].set(num(call('getUserParam', k), 0.5), true);
      const st = safe(() => composer.getState(), null);
      if (st) {
        if (Array.isArray(st.noise)) S.noise = st.noise;
        if (st.perc) S.perc = st.perc;
        if (st.events) S.events = st.events;
      }
      updateSrc(); updateEvt(); updatePrc();
      updateDrift();
    }
    function updateDrift() {
      const auto = !!safe(() => composer.auto, false);
      for (const k in UI.params) {
        const r = UI.params[k];
        if (!auto) { r.setEff(null, 0); continue; }
        r.setEff(call('getParam', k), r.get());
      }
    }
    function updateAutoButton() {
      const onA = !!safe(() => composer.auto, S.st && S.st.auto);
      const b = $('btn-auto');
      b.setAttribute('aria-pressed', onA ? 'true' : 'false');
      const led = $('auto-led'); if (led) led.classList.toggle('on', onA);
      updateDrift();
    }
    function toggleAuto() { safe(() => composer.setAuto(!composer.auto)); updateAutoButton(); S.dirty = true; }

    /* =====================================================================================
       7. log & status
       ===================================================================================== */
    const logEl = $('log');
    const logLines = [];
    function elapsed() {
      if (isFn(composer, 'elapsed')) { const v = safe(() => composer.elapsed(), null); if (typeof v === 'number' && isFinite(v)) return v; }
      return S.started ? (Date.now() - S.runStart) / 1000 : 0;
    }
    function pushLog(e) {
      if (!e) return;
      const text = String(typeof e === 'string' ? e : e.text || '');
      if (!text) return;
      const at = (e && typeof e.elapsed === 'number' && isFinite(e.elapsed)) ? e.elapsed : elapsed();
      logLines.push({ t: fmtStamp(at), text });
      if (logLines.length > 40) logLines.shift();
      renderLog();
    }
    const logPool = [];
    for (let i = 0; i < 10; i++) {
      const t = h('span', { class: 't' }), x = h('span', { class: 'x' });
      const el = h('div', { class: 'lg' }, [t, x]);
      logEl.appendChild(el); logPool.push({ el, t, x });
    }
    function renderLog() {
      const n = (S.logDocked || prefs.tallLog) ? 10 : 3;
      const show = logLines.slice(-n);
      logPool.forEach((L, i) => {
        const j = i - (10 - show.length);       // bottom-aligned
        const l = j >= 0 ? show[j] : null;
        if (!l) { L.el.className = 'lg nil'; L.t.textContent = '--:--.-'; L.x.textContent = ''; L.el.hidden = i < 10 - n; return; }
        L.el.hidden = false;
        const age = show.length - 1 - j;
        L.el.className = 'lg' + (age === 0 ? ' n0' : age === 1 ? ' n1' : '');
        L.t.textContent = l.t; L.x.textContent = l.text;
      });
    }
    const wideMq = safe(() => window.matchMedia('(min-width: 900px)'), null);
    function placeLog() {
      const wide = !!(wideMq && wideMq.matches);
      if (wide === S.logDocked) return;
      const panel = $('panel'), stage = $('stage'), rbw = $('ribbon-wrap');
      if (wide) panel.appendChild(logEl);
      else if (stage.insertBefore) stage.insertBefore(logEl, rbw);
      S.logDocked = wide;
      logEl.classList.toggle('dock', wide);
      logEl.classList.toggle('tall', !wide && prefs.tallLog);
      renderLog();
    }
    if (wideMq && wideMq.addEventListener) wideMq.addEventListener('change', placeLog);
    logEl.addEventListener('click', () => {
      if (S.logDocked) return;
      prefs.tallLog = !prefs.tallLog;
      logEl.classList.toggle('tall', prefs.tallLog);
      renderLog();
    });
    logEl.classList.toggle('tall', prefs.tallLog);
    placeLog();

    function updateStatus() {
      const p = presetById(S.presetId);
      $('st-code').textContent = p ? presetCode(p) : '';
      $('st-name').textContent = p ? up(p.name || p.id) : '';
      $('st-chord').textContent = S.chord || '—';
      const pc = S.perc;
      const showBpm = !!(pc && pc.on);
      $('st-bpm-wrap').hidden = !showBpm;
      if (showBpm) $('st-bpm').textContent = Math.round(num(pc.bpm, 0)) + ' BPM';
    }
    const evtLed = $('evt-led'), evtName = $('st-evt-name');
    function updateEvtLed(force) {
      const lit = S.clock < S.evtLed;
      if (force || lit !== evtLed.classList.contains('on')) evtLed.classList.toggle('on', lit);
      const nm = S.clock < S.evtUntil ? S.evtName : '';

      EVENTS.forEach((name) => {
        const R = UI.evtRows[name]; if (!R) return;

    /* =====================================================================================
       8. sleep
       ===================================================================================== */
    const sleepPop = $('sleep-pop'), scrim = $('scrim'), btnSleep = $('btn-sleep'), sleepTime = $('sleep-time');
    const chipEls = [];
    function buildSleep() {

      SLEEP_CHOICES.forEach((m) => {
        const c = h('button', { type: 'button', class: 'chip', 'aria-pressed': 'false', 'aria-label': m ? m + ' minutes' : 'Off', text: m === 0 ? 'OFF' : String(m) });
        c.addEventListener('click', () => {
          S.sleepChoice = m || null;

        });

    }
    function sleepOpen() { return sleepPop.classList.contains('open'); }

      sleepPop.classList.add('open'); sleepPop.setAttribute('aria-hidden', 'false');
      scrim.hidden = false; btnSleep.setAttribute('aria-expanded', 'true');
      updateSleepUI(safe(() => composer.sleepRemaining(), null));

    function closeSleep(refocus) {

    function updateSleepUI(remaining) {

    }
    function showEnd() {
      S.ended = true;
      releaseAllRibbon();
      closeSleep(false);
      setNight(false);
      $('end').hidden = false;
      updateSleepUI(null);
      safe(() => $('btn-again').focus());
      try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) { /* ignore */ }
    }
    async function playAgain() {
      unlockAudioSession();
      try { await engine.resume(); } catch (e) { /* ignore */ }
      safe(() => composer.setSleepTimer(0));
      safe(() => composer.start());
      $('end').hidden = true;
      S.ended = false;
      setNight(false);
      requestWakeLock();
      S.dirty = true;
    }

    /* =====================================================================================
       9. night screen
       ===================================================================================== */
    const veil = $('night-veil');
    function setNight(onN) {
      if (onN === S.night) return;
      S.night = onN;
      document.body.classList.toggle('dim', onN);
      veil.hidden = !onN;
      $('btn-dim').setAttribute('aria-pressed', onN ? 'true' : 'false');
      if (onN) { closeSleep(false); releaseAllRibbon(); }
      else UI.perc && PERC_TRK.forEach(([k]) => paintEuclid(UI.perc.tr[k]));
    }
    veil.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); });
    veil.addEventListener('pointerup', (e) => { e.preventDefault(); e.stopPropagation(); setNight(false); });

    /* =====================================================================================
       10. keyboard
       ===================================================================================== */
    function fireRandomEvent() {
      const en = (S.events && S.events.enabled) || {};
      const list = EVENTS.filter((n) => en[n]);
      if (!list.length) return;
      call('fireEvent', list[Math.floor(Math.random() * list.length)]);
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (sleepOpen()) { closeSleep(true); e.preventDefault(); }
        else if (S.night) setNight(false);
        return;
      }
      if (!S.started || e.ctrlKey || e.metaKey || e.altKey || !$('end').hidden) return;
      const tag = e.target && e.target.tagName;
      if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
      const k = e.key;
      if (S.night) { setNight(false); e.preventDefault(); return; }
      if (k === 'a' || k === 'A') { toggleAuto(); e.preventDefault(); }
      else if (k === 'd' || k === 'D') { setNight(true); e.preventDefault(); }
      else if (k === 'e' || k === 'E') { fireRandomEvent(); e.preventDefault(); }
      else if (k === ' ' || k === 'Spacebar') {
        if (tag === 'BUTTON') return;
        doNextChord(); e.preventDefault();
      } else if (k >= '1' && k <= '8') {
        const p = PRESETS[parseInt(k, 10) - 1];
        if (p) { loadPresetUI(p.id); e.preventDefault(); }
      }
    });

    /* =====================================================================================
       11. media session
       ===================================================================================== */
    function updateMediaMeta() {
      try {
        if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
        const p = presetById(S.presetId);
        navigator.mediaSession.metadata = new MediaMetadata({ title: 'Orpheus', artist: p ? presetCode(p) + ' ' + up(p.name || p.id) : 'Orpheus' });
      } catch (e) { /* ignore */ }
    }
    function setupMediaSession() {
      try {
        if (!('mediaSession' in navigator)) return;
        updateMediaMeta();
        const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) { /* unsupported */ } };
        set('play', () => { kickAudio(); });
        set('pause', () => { safe(() => engine.suspend()); });
      } catch (e) { /* ignore */ }
    }

    /* =====================================================================================
       12. visibility & wake lock
       ===================================================================================== */
    let wakeLock = null;
    function requestWakeLock() {
      try {
        if (!S.started || S.ended || !navigator.wakeLock || !navigator.wakeLock.request) return;
        if (wakeLock && !wakeLock.released) return;
        navigator.wakeLock.request('screen').then((l) => { wakeLock = l; }).catch(() => {});
      } catch (e) { /* ignore */ }
    }
    function setLookahead(sec) {
      if (isFn(composer, 'setLookahead')) safe(() => composer.setLookahead(sec));
      if (isFn(engine, 'setLookahead')) safe(() => engine.setLookahead(sec));
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { setLookahead(1.5); releaseAllRibbon(); saveNow(); }
      else { setLookahead(0.2); pruneQueue(); S.dirty = true; requestWakeLock(); }
    });
    window.addEventListener('pagehide', saveNow);
    window.addEventListener('blur', releaseAllRibbon);

    /* =====================================================================================
       13. wiring, audio unlock, start
       ===================================================================================== */
    buildPanel();
    buildSleep();

    on('note', (e) => enqueue('note', e));
    on('event', (e) => { if (e && typeof e.time !== 'number') e = Object.assign({}, e, { time: engineNow() }); enqueue('evt', e); });
    on('perc', (e) => enqueue('perc', e));
    on('log', pushLog);
    on('rings', () => { S.dirty = true; });
    on('chord', () => { S.dirty = true; S.drPulse = 1; });
    on('preset', () => { S.dirty = true; syncAll(); updateMediaMeta(); });
    on('auto', () => { updateAutoButton(); });
    on('params', () => { updateDrift(); });
    on('sleep', (e) => { updateSleepUI(e && typeof e.remaining === 'number' ? e.remaining : safe(() => composer.sleepRemaining(), null)); });
    on('sleepEnded', showEnd);
    on('percConfig', (p) => { if (p && typeof p === 'object') { S.perc = p; updatePrc(); updateStatus(); } });
    on('noise', () => { const st = safe(() => composer.getState(), null); if (st && Array.isArray(st.noise)) { S.noise = st.noise; updateSrc(); } });

    $('btn-auto').addEventListener('click', toggleAuto);
    $('btn-dim').addEventListener('click', () => setNight(true));
    btnSleep.addEventListener('click', () => { if (sleepOpen()) closeSleep(false); else openSleep(); });
    scrim.addEventListener('pointerdown', () => closeSleep(false));
    $('btn-again').addEventListener('click', playAgain);

    function onResize() { resizeStage(); resizeRibbon(); }
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(onResize);
      ro.observe(orr.cv); ro.observe(rb.cv);
    }
    window.addEventListener('resize', onResize);
    onResize();

    refreshState();
    syncAll();
    updateSleepUI(null);
    renderLog();
    S.booted = true;

    /* iPhone mutes Web Audio with the silent switch unless an <audio> element is playing,
       which moves the page into the "playback" audio session. */
    let unlockEl = null;
    function silentWavURI() {
      const sr = 8000, n = 4000, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
      const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
      w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      w(36, 'data'); v.setUint32(40, n * 2, true);
      let bin = ''; const u = new Uint8Array(buf);
      for (let i = 0; i < u.length; i++) bin += String.fromCharCode(u[i]);
      return 'data:audio/wav;base64,' + btoa(bin);
    }
    function unlockAudioSession() {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* ignore */ }
      try {
        if (!unlockEl) {
          unlockEl = document.createElement('audio');
          unlockEl.setAttribute('playsinline', '');
          unlockEl.setAttribute('x-webkit-airplay', 'deny');
          unlockEl.loop = true; unlockEl.preload = 'auto';
          unlockEl.src = silentWavURI();
          unlockEl.hidden = true;
          document.body.appendChild(unlockEl);
        }
        if (unlockEl.paused) { const p = unlockEl.play(); if (p && p.catch) p.catch(() => {}); }
      } catch (e) { /* ignore */ }
    }
    function audioStuck() {
      const c = engine.ctx;
      return !!(c && S.started && !S.ended && c.state !== 'running');
    }
    function kickAudio() {
      unlockAudioSession();
      const c = engine.ctx;
      if (c && c.state !== 'running' && c.state !== 'closed') { try { c.resume(); } catch (e) { /* ignore */ } }
    }
    ['pointerdown', 'touchend', 'keydown'].forEach((t) => document.addEventListener(t, () => {
      if (audioStuck()) kickAudio();
    }, { capture: true, passive: true }));
    function watchAudio() {
      const banner = $('sound-banner');
      const check = () => { if (banner) banner.hidden = !audioStuck() || document.hidden; };
      setInterval(check, 1000);
      try { engine.ctx.addEventListener('statechange', check); } catch (e) { /* ignore */ }
      if (banner) banner.addEventListener('click', () => { kickAudio(); setTimeout(check, 400); });
    }
    function welcomeChime() {
      try {
        const st = composer.getState();
        const degs = (st.chord && st.chord.degrees) || [0, 2, 4];
        const t0 = engine.now() + 0.15;
        degs.slice(0, 4).forEach((d, i) => {
          const freq = isFn(composer, 'pitchFreq') ? composer.pitchFreq(d, 1) : 0;
          if (!(freq > 60 && freq < 2000)) return;
          engine.playNote({ voice: 'fm', freq, time: t0 + i * 0.32, velocity: 0.5 - i * 0.06, duration: 4, pan: -0.3 + i * 0.2, brightness: 0.45 });
        });
      } catch (e) { /* ignore */ }
    }

    const startEl = $('start'), appEl = $('app'), beginBtn = $('btn-begin');
    try { appEl.inert = true; } catch (e) { /* ignore */ }
    appEl.setAttribute('aria-hidden', 'true');
    document.addEventListener('keydown', (e) => { if (!S.started && !beginning && e.key === 'Enter' && document.activeElement !== beginBtn) beginBtn.click(); });
    let beginning = false;
    beginBtn.addEventListener('click', async () => {
      if (beginning || S.started) return;
      beginning = true; beginBtn.disabled = true;
      startLine.classList.remove('err'); startLine.textContent = 'WEB AUDIO · 0 SAMPLES';
      unlockAudioSession();            // must run synchronously inside the tap
      try {
        await engine.start();
        composer.start();
      } catch (err) {
        beginning = false; beginBtn.disabled = false;
        startLine.textContent = 'ERR · AUDIO START'; startLine.classList.add('err');
        return;
      }
      if (S.firstRun) safe(() => composer.setAuto(true));
      S.started = true;
      S.runStart = Date.now();
      try { appEl.inert = false; } catch (e) { /* ignore */ }
      appEl.removeAttribute('aria-hidden');
      const sr = engine.ctx && engine.ctx.sampleRate;
      if (sr) startLine.textContent = 'WEB AUDIO · ' + (sr / 1000).toFixed(sr % 1000 ? 1 : 0) + ' kHz · 0 SAMPLES';
      startEl.classList.add('leaving');
      setTimeout(() => { startEl.hidden = true; }, 1300);
      requestWakeLock();
      setupMediaSession();
      welcomeChime();
      watchAudio();
      refreshState(); syncAll();
      if (!logLines.length) pushLog({ text: 'SYS START' + (sr ? ' ' + sr + ' HZ' : '') });
    });

    setInterval(saveNow, 5000);

    /* =====================================================================================
       14. main loop
       ===================================================================================== */
    const clockEl = $('clock');
    let lastTs = 0, errored = false, lastSec = -1;
    function frame(ts) {
      requestAnimationFrame(frame);
      if (document.hidden) return;
      if ((S.night || S.ended) && ts - lastTs < 80) return;      // ~12 fps
      const dt = clamp((ts - lastTs) / 1000, 0, 0.1);
      lastTs = ts;
      try {
        S.clock += dt;
        if (S.dirty) refreshState();
        pump();
        drawStage(dt);
        if (!S.night) {
          drawRibbon();
          updateEvtLed(false);
          if (S.started) {
            const sec = Math.floor(elapsed());
            if (sec !== lastSec) { lastSec = sec; clockEl.textContent = fmtHMS(sec); }
          }
          if (prefs.tab === 'prc' && UI.perc) PERC_TRK.forEach(([k]) => { const Tr = UI.perc.tr[k]; if (Tr.flash && S.clock - Tr.flash < 0.4) paintEuclid(Tr); });
        }
      } catch (err) {
        if (!errored) { errored = true; try { console.error('Orpheus frame error', err); } catch (e) { /* ignore */ } }
      }
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main);
  else main();
})();

</script>

</body></html>
