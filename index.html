    /**
     * Bass = the chord root (or, when the root would leap, the nearest inversion) in the octave nearest the
     * previous bass: ≤ a 5th, never an octave leap, inside the patch's bass range, pulled to its centre.
     * pcList: [rootCents, otherChordToneCents…]
     */
    _voiceBass(pcList) {
      if (!Array.isArray(pcList)) pcList = [pcList];
      const B = this.preset.bass || [40, 110, 70];
      const lo = hzToCents(B[0]), hi = hzToCents(B[1]), ce = hzToCents(B[2]);
      const prev = this._bassCents;
      const cands = [];
      pcList.forEach(pc => { for (let o = -8; o <= 8; o++) cands.push(pc + 1200 * o); });
      const isInv = c => pcDist(c, pcList[0]) > 1;
      const score = c => (prev === undefined ? 0 : Math.abs(c - prev)) + 0.5 * Math.abs(c - ce) + (isInv(c) ? 450 : 0);
      const pickFrom = list => { let b = null, bs = Infinity; for (const c of list) { const v = score(c); if (v < bs) { bs = v; b = c; } } return b; };
      const near = c => prev === undefined || Math.abs(c - prev) <= 700 + 1e-6;
      return pickFrom(cands.filter(c => c >= lo && c <= hi && near(c))) ??
        pickFrom(cands.filter(c => c >= lo - 300 && c <= hi + 300 && near(c))) ??
        pickFrom(cands.filter(c => c >= lo && c <= hi));
    }

    _droneVoicing() {
      const sc = this.scale;
      const degs = this.chord.degrees;
      const bc = this._voiceBass(degs.map(d => this.pitchCents(d, 0)));
      this._bassCents = bc;
      if (this.preset.pedal) {                        // organ pedal: root + just fifth + octave
        this._bassPC = mod(bc, 1200);
        this._droneFreqs = [bc, bc + 701.955, bc + 1200].map(centsToHz);
        return this._droneFreqs;
      }
      const tones = [bc];
      for (let k = 0; k < degs.length && tones.length < 4; k++) {
        if (pcDist(this.pitchCents(degs[k], 0), bc) < 1) continue;   // the bass itself (root or inversion)
        let c = this.pitchCents(degs[k], 0);
        while (c < bc + 600) c += 1200;
        while (c >= bc + 1800) c -= 1200;
        if (tones.some(x => Math.abs(x - c) < 150)) continue;
        if (pcDist(c, bc) > 0 && pcDist(c, bc) < 120) continue;
        tones.push(c);
      }
      if (tones.length < 3) {
        const want = [bc + 1200, bc + 700];
        for (const w of want) {
          if (tones.length >= 3) break;
          let best = null, bd = 1e9;
          for (let o = -4; o <= 4; o++) for (let d = 0; d < sc.steps.length; d++) {
            const c = this.root * 100 + 1200 * o + sc.steps[d];
            const dd = Math.abs(c - w);
            if (dd < bd) { bd = dd; best = c; }
          }
          if (best !== null && !tones.some(x => Math.abs(x - best) < 150) && best >= bc + 600) tones.push(best);
        }
      }
      tones.sort((a, b) => a - b);
      this._bassPC = mod(bc, 1200);
      this._droneFreqs = tones.map(centsToHz);
      return this._droneFreqs;
    }

    _applyDrone(glide) {
      this._eng('setDrone', { freqs: this._droneVoicing().slice(), glide });
    }

    _setChord(index, opts) {
      opts = opts || {};
      const prog = this.progression;
      index = mod(index, prog.length);
      const oldLabel = this.chord.label ? this._chordTag() : '';
      this.chordIndex = index;
      const degrees = prog[index].slice();
      this.chord = { index, label: '', degrees };
      this.chord.label = this._chordLabel(degrees);
      this._droneVoicing();
      this._percRim = null;
      this._chordAt = this._now();
      if (this.running && !opts.noDrone) this._applyDrone(opts.glide !== undefined ? opts.glide : this._rnd(8, 14));
      if (!opts.silent) {
        this._emit('chord', { index, label: this.chord.label, degrees: degrees.slice() });
        this._log('chd', 'CHD ' + (oldLabel || '—') + ' → ' + this._chordTag());
      }
    }

    nextChord() {
      this._setChord(this.chordIndex + 1);
      if (this._auto) this._chordNext = this._now() + this._chordInterval();
    }

    _chordInterval() {
      const d = clamp01(this.user.drift);
      return clamp(lerp(120, 40, d) * this._rnd(0.85, 1.15), 40, 120);
    }

    // ---------------------------------------------------------------- pitch selection (tracks)
    _candidates(ring, widen) {
      const n = this.scale.steps.length;
      const lo = ring.octaves[0] - widen, hi = ring.octaves[1] + widen;
      const win = VOICE_HZ[ring.voice] || [FLOOR_HZ, CEIL_HZ];
      const out = [];
      for (let oct = lo; oct <= hi; oct++) {
        for (let deg = 0; deg < n; deg++) {
          const c = this.pitchCents(deg, oct);
          const f = centsToHz(c);
          if (f < win[0] || f > win[1]) continue;
          out.push({ degree: deg, octave: oct, idx: oct * n + deg, cents: c, freq: f });
        }
      }
      return out;
    }

    _crossClash(ring, phase, cents, now) {
      const rate = this._rate();
      const tNow = this.running ? now : this._freezeT;
      const perSelf = ring.period / rate;
      const phSelf = mod(this._pos(ring, tNow), 1);
      const tc = mod(phase - phSelf, 1) * perSelf;
      for (const o of this.rings) {
        if (o === ring || o.muted || !o.notes.length) continue;
        const per = o.period / rate;
        const ph = mod(this._pos(o, tNow), 1);
        for (const nt of o.notes) {
          const first = mod(nt.phase - ph, 1) * per;
          const delta = tc - first;
          const k = Math.round(delta / per);
          if (Math.abs(delta - k * per) <= 1.5) {
            const d = pcDist(cents, nt.cents);
            if (d > 0 && d <= 150) return true;
          }
        }
      }
      return false;
    }

    _pickPitch(ring, phase, opts) {
      opts = opts || {};
      const now = this._now();
      const n = this.scale.steps.length;
      let cands = this._candidates(ring, 0);
      if (!cands.length) cands = this._candidates(ring, 1);
      if (!cands.length) cands = this._candidates(ring, 3);
      if (!cands.length) { const c = this.pitchCents(0, 1); return { degree: 0, octave: 1, cents: c, freq: centsToHz(c), idx: n }; }

      const classes = this._chordClasses();
      let nChord = 0, nOther = 0;
      for (const c of cands) { if (classes.has(c.degree)) nChord++; else nOther++; }
      let idxMin = Infinity, idxMax = -Infinity;
      for (const c of cands) { if (c.idx < idxMin) idxMin = c.idx; if (c.idx > idxMax) idxMax = c.idx; }
      const mid = (idxMin + idxMax) / 2, sigma = Math.max(2.5, (idxMax - idxMin) / 2);

      const others = ring.notes.filter(x => x !== opts.exclude);
      let prev = null, next = null;
      if (others.length) {
        let bp = -1, bn = 2;
        for (const x of others) {
          const dp = mod(phase - x.phase, 1) || 1;
          const dn = mod(x.phase - phase, 1) || 1;
          if (bp < 0 || dp < bp) { bp = dp; prev = x; }
          if (dn < bn) { bn = dn; next = x; }
        }
      }
      const stepW = s => (s === 0 ? 0.7 : s === 1 ? 3 : s === 2 ? 2.2 : s === 3 ? 1.2 : s === 4 ? 0.8 : s <= 6 ? 0.4 : s <= 9 ? 0.2 : 0.08);

      const weights = cands.map(c => {
        let w = classes.has(c.degree) ? 0.7 / Math.max(1, nChord) : 0.3 / Math.max(1, nOther);
        const dpc = pcDist(c.cents, this._bassPC);
        if (dpc > 0 && dpc < 120) w *= 1e-6;
        w *= 0.3 + 0.7 * Math.exp(-0.5 * Math.pow((c.idx - mid) / sigma, 2));
        const ws = [];
        if (prev) ws.push(stepW(Math.abs(c.idx - (prev.octave * n + prev.degree))));
        if (next && next !== prev) ws.push(stepW(Math.abs(c.idx - (next.octave * n + next.degree))));
        if (ws.length) w *= Math.pow(ws.reduce((a, b) => a * b, 1), 1 / ws.length);
        if (opts.near !== undefined) {
          const d = Math.abs(c.idx - opts.near);
          if (d === 0) w *= 0.001; else w *= 0.35 + Math.exp(-d / 2.2);
        }
        if (this._crossClash(ring, phase, c.cents, now)) w *= 0.1;
        return w;
      });
      let i = this._pickWeighted(cands, weights);
      if (i < 0) i = Math.floor(this._rand() * cands.length);
      return cands[i];
    }

    _nearestTone(cents) {
      const n = this.scale.steps.length;
      let best = null, bd = Infinity;
      for (let oct = -3; oct <= 6; oct++) {
        for (let deg = 0; deg < n; deg++) {
          const c = this.pitchCents(deg, oct);
          const f = centsToHz(c);
          if (f < FLOOR_HZ || f > CEIL_HZ) continue;
          const d = Math.abs(c - cents) + this._rand() * 0.001;
          if (d < bd) { bd = d; best = { degree: deg, octave: oct, cents: c, freq: f }; }
        }
      }
      return best;
    }

    // ---------------------------------------------------------------- tracks: structure
    _newNoteFrom(p, phase, velocity) {
      return {
        id: this._nid(), phase, degree: p.degree, octave: p.octave, velocity: clamp(velocity, 0.05, 1),
        cents: p.cents, freq: p.freq, born: this._now(), skipCycle: null,
      };
    }

    _validPhase(ring, phase, ignore) {
      for (const x of ring.notes) {
        if (x === ignore) continue;
        const d = Math.abs(x.phase - phase);
        if (Math.min(d, 1 - d) < MIN_SPACING - 1e-9) return false;
      }
      return true;
    }

    _snapPhase(ring, phase, tol) {
      phase = mod(phase, 1);
      if (this._validPhase(ring, phase)) return phase;
      let best = null, bd = Infinity;
      for (const x of ring.notes) {
        for (const s of [-1, 1]) {
          const cand = mod(x.phase + s * (MIN_SPACING + 1e-6), 1);
          const d = Math.min(Math.abs(cand - phase), 1 - Math.abs(cand - phase));
          if (d <= tol && d < bd && this._validPhase(ring, cand)) { bd = d; best = cand; }
        }
      }
      return best;
    }

    addNote(ringId, phase) {
      const r = this._ring(ringId);
      if (!r || !isFinite(phase) || r.notes.length >= MAX_PER_RING + 3) return null;
      const ph = this._snapPhase(r, phase, 0.04);
      if (ph === null) return null;
      const p = this._pickPitch(r, ph);
      const classes = this._chordClasses();
      const vel = clamp(this._rnd(0.45, 0.72) + (classes.has(p.degree) ? 0.05 : 0), 0.2, 0.85);
      const nt = this._newNoteFrom(p, ph, vel);
      r.notes.push(nt);
      const now = this._now();
      const pos = this._pos(r, this.running ? now : this._freezeT);
      const per = r.period / r.rate;
      let k = Math.floor(pos);
      if (k + ph <= pos) k++;
      if ((k + ph - pos) * per < this.lookahead + 0.6) nt.skipCycle = k;
      this._touchRings();
      this._preview(r, nt);
      this._emit('rings', { reason: 'add', ringId });
      this._log('trk', this._ringNo(r) + ' +' + this._noteName(nt.freq) + ' ' + ph2(ph));
      return { id: nt.id, phase: nt.phase, degree: nt.degree, octave: nt.octave, velocity: nt.velocity, freq: nt.freq };
    }

    /** per-voice articulation for a track note */
    _articulate(r, o) {
      if (r.voice === 'breath') {
        o.duration = Math.min(this._rnd(3, 8), Math.max(3, r.period * 0.5));
        o.scoop = Math.round(this._rnd(60, 200));
        o.harm = true;
      } else if (r.voice === 'sine') {
        o.duration = clamp(r.period * 0.2, 2, 6);
      } else {
        o.duration = clamp(r.period * 0.25, 2, 8);
      }
      return o;
    }

    _preview(r, nt) {
      if (r.muted) return;
      const now = this._now();
      const time = now + 0.01;
      const vel = clamp01(nt.velocity * r.gain);
      const pan = clamp(r.pan + this._rnd(-0.1, 0.1), -1, 1);
      if (this.running) {
        this._eng('playNote', this._articulate(r, {
          voice: r.voice, freq: nt.freq, time, velocity: vel, pan,
          brightness: clamp01(this._effective('tone', now) + this._rnd(-0.05, 0.05)),
        }));
      }
      this._emit('note', { source: 'preview', ringId: r.id, noteId: nt.id, time, freq: nt.freq, voice: r.voice, velocity: vel, pan });
    }

    removeNote(ringId, noteId) {
      const r = this._ring(ringId);
      if (!r) return false;
      const i = r.notes.findIndex(x => x.id === noteId);
      if (i < 0) return false;
      const nt = r.notes[i];
      r.notes.splice(i, 1);
      this._retune = this._retune.filter(q => q.noteId !== noteId);
      this._touchRings();
      this._emit('rings', { reason: 'remove', ringId });
      this._log('trk', this._ringNo(r) + ' ' + MINUS + this._noteName(nt.freq) + ' ' + ph2(nt.phase));
      return true;
    }

    setRingMuted(ringId, muted) {
      const r = this._ring(ringId);
      if (!r) return;
      r.muted = !!muted;
      r.autoMuted = false;
      this._touchRings();
      this._emit('rings', { reason: 'mute', ringId });
      this._log('trk', this._ringNo(r) + (r.muted ? ' MUTE' : ' UNMUTE'));
    }

    setRingVoice(ringId, voice) {
      const r = this._ring(ringId);
      const v = normVoice(voice);
      if (!r || !v) return;
      r.voice = v;
      this._touchRings();
      this._emit('rings', { reason: 'voice', ringId });
      this._log('trk', this._ringNo(r) + ' ENG ' + v.toUpperCase());
    }

    setRingProb(ringId, v) {
      const r = this._ring(ringId);
      if (!r) return;
      r.chance = clamp01(num(v, r.chance));
      this._touchRings();
      this._emit('rings', { reason: 'prob', ringId });
      this._logLater('prob' + ringId, 'trk', this._ringNo(r) + ' PROB ' + Math.round(r.chance * 100) + '%');
    }

    clearRing(ringId) {
      const r = this._ring(ringId);
      if (!r) return;
      r.notes = [];
      this._retune = this._retune.filter(q => q.ringId !== ringId);
      this._touchRings();
      this._emit('rings', { reason: 'clear', ringId });
      this._log('trk', this._ringNo(r) + ' CLR');
    }

    // ---------------------------------------------------------------- key changes
    _flushRetune() {
      if (!this._retune.length) return;
      for (const q of this._retune) this._applyRetune(q);
      this._retune = [];
    }

    _applyRetune(q) {
      const r = this._ring(q.ringId);
      if (!r) return false;
      const nt = r.notes.find(x => x.id === q.noteId);
      if (!nt) return false;
      nt.degree = q.degree; nt.octave = q.octave; nt.cents = q.cents; nt.freq = q.freq;
      return true;
    }

    _changeKey(scaleId, root, glide, stagger) {
      this._flushRetune();
      this.scaleId = scaleId;
      this.root = mod(Math.round(root), 12);
      const now = this._now();
      for (const r of this.rings) {
        for (const nt of r.notes) {
          const t = this._nearestTone(nt.cents);
          if (!t) continue;
          if (stagger > 0) {
            this._retune.push({ at: now + this._rnd(0.5, stagger * 0.9), ringId: r.id, noteId: nt.id, degree: t.degree, octave: t.octave, cents: t.cents, freq: t.freq });
          } else {
            nt.degree = t.degree; nt.octave = t.octave; nt.cents = t.cents; nt.freq = t.freq;
          }
        }
      }
      this._touchRings();
      this._setChord(this.chordIndex, { silent: true, noDrone: true });
      if (this.running) this._applyDrone(glide);
      this._emit('chord', { index: this.chord.index, label: this.chord.label, degrees: this.chord.degrees.slice() });
      this._emit('rings', { reason: 'key' });
      this._emit('scale', { scaleId: this.scaleId, root: this.root });
    }

    setScale(scaleId) {
      if (!SCALE_BY_ID[scaleId] || scaleId === this.scaleId) return;
      this._changeKey(scaleId, this.root, 8, 0);
      this._log('sys', 'KEY ' + this._rootName(this.root) + ' ' + scaleId.toUpperCase());
    }

    setRoot(rootIndex) {
      const r = mod(Math.round(num(rootIndex, this.root)), 12);
      if (r === this.root) return;
      this._changeKey(this.scaleId, r, 8, 0);
      this._log('sys', 'KEY ' + this._rootName(this.root) + ' ' + this.scaleId.toUpperCase());
    }

    // ---------------------------------------------------------------- patches
    _makeRing(i, def, seeds, t) {
      const r = {
        id: 'r' + i, voice: normVoice(def.voice) || 'fm', period: def.period, octaves: [def.octaves[0], def.octaves[1]],
        baseOctaves: [def.octaves[0], def.octaves[1]],
        chance: def.chance, pan: def.pan, gain: def.gain, muted: false, autoMuted: false, unmuteAt: 0,
        notes: [], pos0: 0, t0: t, rate: this._rate(), fired: 0,
      };
      for (const s of (seeds || [])) {
        const c = this.pitchCents(s.degree, s.octave);
        r.notes.push({
          id: this._nid(), phase: s.phase, degree: s.degree, octave: s.octave, velocity: s.velocity,
          cents: c, freq: centsToHz(c), born: t, skipCycle: null,
        });
      }
      const lead = 1.5 + i * 2.4 + this._rnd(0, 2);
      const ref = r.notes.length ? r.notes[Math.floor(this._rand() * r.notes.length)].phase : this._rand();
      r.pos0 = mod(ref - lead * r.rate / r.period, 1);
      r.fired = r.pos0;
      return r;
    }

    get preset() { return PRESET_BY_ID[this.presetId] || PRESETS[0]; }

    _patchTitle() { const p = this.preset; return p.code + ' ' + p.name; }

    loadPreset(id) {
      const p = PRESET_BY_ID[id];
      if (!p) return false;
      this.presetId = p.id;
      this.scaleId = p.scale;
      this.root = p.root;
      this.progression = p.progression.map(c => c.slice());
      this.ribbonVoice = normVoice(p.ribbonVoice) || 'sub';
      for (const k of PRESET_PARAM_NAMES) this.user[k] = clamp01(p.params[k]);
      this.noise = [this._cleanNoise(NOISE_DEFAULT, p.noise[0]), this._cleanNoise(NOISE_DEFAULT, p.noise[1])];
      this.perc = this._cleanPerc(PC(), p.perc);
      this._evt.enabled = Object.assign({}, p.events);
      this._evt.weights = Object.assign({}, p.eventWeights || {});
      this._percNext = null;
      this._percHist = [];
      this._daisy = null;
      this._bassCents = undefined;
      this._tacet = null;
      if (this._rest) this._rest.t2 = Math.min(this._rest.t2, this._now());
      this._retune = [];
      const t = this.running ? this._now() : this._freezeT;
      this.rings = p.rings.map((d, i) => this._makeRing(i, d, p.seedNotes[i], t));
      this._touchRings();
      this._setChord(0, { silent: true, noDrone: true });
      this._initDrift();
      const now = this._now();
      if (this._auto) {
        this._autoNext = now + this._rnd(6, 12);
        this._chordNext = now + this._chordInterval();
        this._rootNext = now + this._rnd(600, 900);
      }
      if (this.running) {
        this._applyAll(true);
        this._evt.next = Math.max(this._evt.lastEnd + 8, now + Math.max(20, this._rnd(0.35, 1) * this._evtMean()));
      }
      this._paramsDirty = true;
      this._emit('preset', { id: p.id, code: p.code, name: p.name });
      this._emit('chord', { index: 0, label: this.chord.label, degrees: this.chord.degrees.slice() });
      this._emit('rings', { reason: 'preset' });
      this._emit('params', this._effectiveParams(now));
      this._emit('percConfig', this._percSnap());
      this._lastParamsEmit = now;
      this._paramsDirty = false;
      this._log('sys', 'LOAD ' + this._patchTitle());
      return true;
    }

    _applyAll(crossfade) {
      const now = this._now();
      for (const k of ENGINE_PARAMS) {
        if (crossfade && k === 'out') continue;
        this._sendParam(k, crossfade ? 2 : 0.6, now);
      }
      for (let ch = 0; ch < 2; ch++) this._eng('setNoise', ch, Object.assign({}, this.noise[ch]), crossfade ? 3 : 2);
      this._applyDrone(crossfade ? 10 : 6);
    }

    // ---------------------------------------------------------------- run control
    start() {
      if (this.running) return;
      const now = this._now();
      const rate = this._rate();
      for (const r of this.rings) {
        const p = r.pos0 + (this._freezeT - r.t0) * r.rate / r.period;
        r.pos0 = p; r.t0 = now; r.rate = rate; r.fired = p;
      }
      this.running = true;
      this._runStart = now;
      this._lastTickNow = now;
      this._lastSlow = -Infinity;
      this._lastSlowNow = undefined;
      this._percNext = null;
      if (!this._sleep) this._eng('setSleepGain', 1, 1.5);
      this._applyAll(false);
      if (this._auto) {
        this._autoNext = now + this._rnd(5, 9);
        this._chordNext = now + this._chordInterval();
        this._rootNext = now + this._rnd(600, 900);
      }
      this._evt.next = now + Math.max(20, this._rnd(0.35, 1) * this._evtMean());
      if (!this._manual && !this._timer && typeof setInterval === 'function') {
        this._timer = setInterval(() => this.tick(), 25);
      }
      this._log('sys', 'RUN ' + this._patchTitle() + (this._auto ? ' AUTO' : ''));
      this.tick();
    }

    stop() {
      if (this._timer) { clearInterval(this._timer); this._timer = null; }
      if (this.running) {
        const now = this._now();
        this._freezeT = now;
        this._elapsedAcc += Math.max(0, now - this._runStart);
        this.running = false;
        this._log('sys', 'HALT');
      }
      this.running = false;
    }

    setLookahead(sec) { this.lookahead = clamp(num(sec, 0.2), 0.05, 5); }

    ringPhase(ringId, time) {
      const r = this._ring(ringId);
      if (!r) return 0;
      const t = (time === undefined || time === null) ? this._now() : time;
      return mod(this._pos(r, t), 1);
    }

    // ---------------------------------------------------------------- scheduler
    tick() {
      if (!this.running) return;
      const now = this._now();
      this._lastTickNow = now;
      if (now - this._lastSlow >= 0.2 || now < this._lastSlow) {
        this._lastSlow = now;
        this._slow(now);
        if (!this.running) return;
      }
      const horizon = now + this.lookahead;
      for (const r of this.rings) this._scheduleRing(r, now, horizon);
      this._schedulePerc(now, horizon);
    }

    _scheduleRing(r, now, horizon) {
      const per = r.period / r.rate;
      const pos = t => r.pos0 + (t - r.t0) / per;
      const lo = Math.max(r.fired, pos(now - GRACE));
      const hi = Math.max(pos(horizon), r.fired);
      if (hi <= lo) return;
      r.fired = hi;
      if (r.muted || !r.notes.length) return;
      const k0 = Math.floor(lo), k1 = Math.floor(hi);
      for (let k = k0; k <= k1; k++) {
        for (const nt of r.notes) {
          const p = k + nt.phase;
          if (p > lo && p <= hi) this._fire(r, nt, k, p, now, per);
        }
      }
    }

    _fire(r, nt, k, p, now, per) {
      if (nt.skipCycle !== null) {
        if (nt.skipCycle === k) { nt.skipCycle = null; return; }
        if (nt.skipCycle < k) nt.skipCycle = null;
      }
      if (this._rand() >= r.chance) return;
      if (this._daisy) return;                                // HAL sings alone
      let time = r.t0 + (p - r.pos0) * per + (this._rand() * 2 - 1) * 0.03;
      if (this._inTacet(time)) return;
      if (time < now) time = now;
      const velocity = clamp01(nt.velocity * r.gain * (0.8 + 0.2 * this._rand()));
      const pan = clamp(r.pan + (this._rand() * 2 - 1) * 0.25, -1, 1);
      const brightness = clamp01(this._effective('tone', now) + (this._rand() * 2 - 1) * 0.08);
      const o = this._articulate(r, { voice: r.voice, freq: nt.freq, time, velocity, pan, brightness });
      this._eng('playNote', o);
      this._emit('note', { source: 'ring', ringId: r.id, noteId: nt.id, time, freq: nt.freq, voice: r.voice, velocity, pan, duration: o.duration });
    }

    // ---------------------------------------------------------------- perc: Euclidean sequencer
    _cleanPerc(base, partial) {
      const o = { on: !!base.on, bpm: base.bpm, swing: base.swing };
      for (const k of PERC_TRACKS) o[k] = Object.assign({}, base[k]);
      if (partial && typeof partial === 'object') {
        if ('on' in partial) o.on = !!partial.on;
        if ('bpm' in partial) o.bpm = num(partial.bpm, o.bpm);
        if ('swing' in partial) o.swing = num(partial.swing, o.swing);
        for (const k of PERC_TRACKS) {
          const t = partial[k];
          if (!t || typeof t !== 'object') continue;
          for (const f of ['steps', 'pulses', 'rot', 'prob']) if (f in t) o[k][f] = num(t[f], o[k][f]);
        }
      }
      o.bpm = clamp(Math.round(num(o.bpm, 72) * 10) / 10, 50, 110);
      o.swing = clamp(num(o.swing, 0), 0, 0.3);
      for (const k of PERC_TRACKS) {
        const t = o[k];
        t.steps = intIn(t.steps, 4, 16, 16);
        t.pulses = intIn(t.pulses, 0, t.steps, 0);
        t.rot = mod(Math.round(num(t.rot, 0)), t.steps);
        t.prob = clamp01(num(t.prob, 1));
      }
      return o;
    }

    setPerc(partial) {
      const prev = this.perc;
      const next = this._cleanPerc(prev, partial);
      this.perc = next;
      if (next.on && !prev.on) { this._percNext = null; this._log('prc', 'PRC ON ' + next.bpm + 'bpm'); }
      else if (!next.on && prev.on) this._log('prc', 'PRC OFF');
      else {
        for (const k of PERC_TRACKS) {
          const a = prev[k], b = next[k];
          if (a.steps !== b.steps || a.pulses !== b.pulses || a.rot !== b.rot) {
            this._logLater('prc' + k, 'prc', 'PRC ' + k.toUpperCase() + ' E(' + b.pulses + ',' + b.steps + ')' + (b.rot ? ' ROT' + b.rot : ''));
          }
        }
        if (prev.bpm !== next.bpm) this._logLater('bpm', 'prc', 'PRC ' + next.bpm + 'bpm');
        if (prev.swing !== next.swing) this._logLater('swing', 'prc', 'PRC SWING ' + Math.round(next.swing * 100) + '%');
      }
      this._emit('percConfig', this._percSnap());
      return this._percSnap();
    }

    _percSnap() {
      const p = this.perc;
      const o = { on: p.on, bpm: p.bpm, swing: p.swing };
      for (const k of PERC_TRACKS) o[k] = Object.assign({}, p[k], { pattern: euclid(p[k].steps, p[k].pulses, p[k].rot) });
      return o;
    }

    _stepDur() { return 60 / this.perc.bpm / 4; }

    /** 1 normally; fades to 0 ahead of the tracks during a sleep timer */
    _percGain(now) {
      const s = this._sleep;
      if (!s) return 1;
      const rem = s.total - (now - s.start);
      const pStart = Math.min(s.total, Math.max(s.fadeWin, s.gainWin + 60));
      const pEnd = s.gainWin + (pStart - s.gainWin) * 0.35;
      return 1 - smooth((pStart - rem) / Math.max(1, pStart - pEnd));
    }

    _membraneFreq(fifth) {
      let f = this._droneFreqs.length ? this._droneFreqs[0] : this.pitchFreq(0, -1);
      while (f < 80) f *= 2;
      while (f >= 160) f /= 2;
      if (fifth) {
        const up = f * 1.5;
        f = up <= 180 ? up : f * 0.75;
      }
      return f;
    }

    _rimFreq() {
      if (!this._percRim) {
        const ts = this._tones(900, 2000, true);
        this._percRim = ts.length ? this._pick(ts).freq : 1200;
      }
      return this._percRim;
    }

    _schedulePerc(now, horizon) {
      const P = this.perc;
      if (!P.on) { this._percNext = null; return; }
      if (!this._percNext) this._percNext = { k: 0, t: now + 0.1 };
      const N0 = this._percNext;
      let sd = this._stepDur();
      if (N0.t < now - GRACE) {                         // frozen tab / clock jump: skip, never burst
        const skip = Math.ceil((now - N0.t) / sd);
        N0.k += skip; N0.t += skip * sd;
      }
      const gain = this._percGain(now);
      let guard = 0;
      while (N0.t < horizon && guard++ < 256) {
        if (gain > 0.02) this._percStep(N0.k, N0.t, sd, gain, now);
        this._percHist.push({ k: N0.k, t: N0.t });
        if (this._percHist.length > 48) this._percHist.shift();
        sd = this._stepDur();
        N0.k++; N0.t += sd;
      }
    }

    _percStep(k, grid, sd, gain, now) {
      const P = this.perc;
      if (k % 16 === 0) this._percBarRest = this._rand() < 0.18;   // s + r sit out the whole bar
      for (const tr of PERC_TRACKS) {
        const T = P[tr];
        if (!T.pulses) continue;
        if (tr !== 'm' && (this._percBarRest || k < this._percMute[tr])) continue;
        const step = k % T.steps;
        const bar = Math.floor(k / T.steps);
        const fill = tr === 'm' && bar % 4 === 3;          // conditional trig: every 4th bar, rotated variant
        const pat = euclid(T.steps, T.pulses, T.rot + (fill ? 1 : 0));
        if (!pat[step]) continue;
        if (this._rand() >= T.prob) continue;
        const swingOff = (k % 2 === 1) ? P.swing * sd : 0;
        const human = (this._rand() * 2 - 1) * 0.008;
        let time = grid + swingOff + human;
        if (time < now) time = now;
        if (this._inTacet(time)) continue;
        const accent = step === 0;
        let velocity, freq, pan, decay;
        if (tr === 'm') {
          const fifth = !accent && this._rand() < 0.15;
          freq = this._membraneFreq(fifth);
          velocity = (accent ? 0.72 : 0.5) * this._rnd(0.85, 1);
          pan = this._rnd(-0.1, 0.1);
          decay = accent ? this._rnd(0.65, 0.9) : this._rnd(0.3, 0.6);
        } else if (tr === 's') {
          freq = this._rnd(5500, 8500);
          velocity = (accent ? 0.24 : k % 2 === 0 ? 0.17 : 0.12) * this._rnd(0.8, 1);   // ghosted
          pan = 0.35 + this._rnd(-0.1, 0.1);
          decay = this._rnd(0.06, 0.14);
        } else {
          freq = this._rimFreq();
          velocity = (accent ? 0.34 : 0.26) * this._rnd(0.85, 1);
          pan = -0.3 + this._rnd(-0.1, 0.1);
          decay = this._rnd(0.04, 0.07);
        }
        velocity = clamp01(velocity * gain);
        const voice = PERC_VOICE[tr];
        this._eng('perc', { voice, time, velocity, freq, pan, decay });
        this._emit('perc', { voice, track: tr, time, grid, k, step, steps: T.steps, bar, fill, velocity, freq });
      }
    }

    /** current 16th per perc track at `time` (for the UI step readout); null when perc is off */
    percPosition(time) {
      if (!this.perc.on || !this._percHist.length) return null;
      const t = (time === undefined || time === null) ? this._now() : time;
      let e = this._percHist[0];
      for (const h of this._percHist) { if (h.t <= t) e = h; else break; }
      const o = { k: e.k };
      for (const tr of PERC_TRACKS) o[tr] = e.k % this.perc[tr].steps;
      return o;
    }

    // ---------------------------------------------------------------- events: the unexpected nuggets
    _evtMean() { return 720 * Math.pow(50 / 720, clamp01(this.user.evtRate)); }

    _evtGap() { return -Math.log(1 - this._rand() * 0.999) * this._evtMean(); }

    setEvents(partial) {
      if (!partial || typeof partial !== 'object') return this._eventsSnap();
      if ('rate' in partial) this.setParam('evtRate', partial.rate);
      if (partial.enabled && typeof partial.enabled === 'object') {
        for (const e of EVENTS) {
          if (e in partial.enabled) {
            const v = !!partial.enabled[e];
            if (v !== this._evt.enabled[e]) this._log('evt', 'EVT ' + this._evtLabel(e) + (v ? ' ARM' : ' DISARM'));
            this._evt.enabled[e] = v;
          }
        }
      }
      return this._eventsSnap();
    }

    _evtLabel(e) { return e === 'sh' ? 'S&H' : e.toUpperCase(); }

    _eventsSnap() {
      return {
        rate: this.user.evtRate, mean: this._evtMean(), enabled: Object.assign({}, this._evt.enabled),
        last: this._evt.last, next: isFinite(this._evt.next) ? this._evt.next : null,
      };
    }

    _eventWeight(name) {
      const w = this._evt.weights[name];
      return w !== undefined ? w : EVENT_WEIGHTS[name];
    }

    _chooseEvent(now) {
      const E = this._evt;
      const en = EVENTS.filter(e => E.enabled[e]);
      if (!en.length) return null;
      let pool = en.length > 1 ? en.filter(e => e !== E.last) : en;
      const others = en.filter(e => e !== 'daisy');
      const meanW = others.length ? others.reduce((a, e) => a + this._eventWeight(e), 0) / others.length : 1;
      const daisyOk = this.elapsed() >= 480 && now - E.lastDaisy >= 2400;
      pool = pool.filter(e => e !== 'daisy' || daisyOk);
      if (!pool.length) return null;
      const ws = pool.map(e => (e === 'daisy' ? meanW * DAISY_SHARE : this._eventWeight(e)));
      const i = this._pickWeighted(pool, ws);
      return i < 0 ? null : pool[i];
    }

    _scheduleEvents(now) {
      const E = this._evt;
      if (now < E.next) return;
      if (now - E.next > 30) { E.next = now + this._evtGap(); return; }   // clock jump: no burst
      const si = this._sleepInfo(now);
      if (si && si.rem < 180) { E.next = now + 60; return; }
      if (now - this._chordAt < 20) { E.next = this._chordAt + 20 + this._rnd(0, 6); return; }
      if (this._tacet && now < this._tacet.t1 + 2) { E.next = this._tacet.t1 + 2 + this._rnd(1, 6); return; }
      const name = this._chooseEvent(now);
      if (!name) { E.next = now + this._evtGap(); return; }
      this._fireEvent(name, now, false);
    }

    fireEvent(name) {
      if (EVENTS.indexOf(name) < 0 || !this.running) return null;
      return this._fireEvent(name, this._now(), true);
    }

    _fireEvent(name, now, manual) {
      const time = now + 0.12;
      let info;
      if (name === 'phrase') info = this._playPhrase(time);
      else if (name === 'daisy') info = this._playDaisy(time);
      else {
        const b = this._buildEvent(name);
        b.opts.level = this.preset.eventLevel || 0.7;      // soft: nuggets emerge, they do not jump out
        const d = this._eng('event', name, b.opts, time);
        info = { dur: (typeof d === 'number' && isFinite(d) && d > 0) ? d : b.dur, text: b.text, opts: b.opts };
      }
      const E = this._evt;
      E.last = name; E.lastAt = time; E.lastEnd = time + info.dur; E.count++;
      if (name === 'daisy') E.lastDaisy = now;
      E.next = Math.max(now + this._evtGap(), E.lastEnd + 8);
      const payload = { name, time, dur: info.dur, manual: !!manual };
      if (info.opts) payload.opts = info.opts;
      if (info.notes) payload.notes = info.notes;
      this._emit('event', payload);
      this._log('evt', info.text);
      return { name, time, dur: info.dur };
    }

    _pickTones(pool, n, chordBias) {
      const out = [];
      const avail = pool.slice();
      while (out.length < n && avail.length) {
        const ws = avail.map(t => (t.chord ? chordBias : 1));
        const i = this._pickWeighted(avail, ws);
        out.push(avail[i]);
        avail.splice(i, 1);
      }
      return out;
    }

    _buildEvent(name) {
      const r1 = x => Math.round(x * 10) / 10;
      const label = this._evtLabel(name);
      switch (name) {
        case 'cluster': {
          let pool = this._tones(180, 700, true);
          if (!pool.length) pool = this._tones(180, 700, false);
          const centres = [];
          const k = this._rand() < 0.35 ? 1 : 2;
          const order = this._pickTones(pool, pool.length, 1);
          for (const t of order) {                       // prefer two different chord tones
            if (centres.length >= k) break;
            if (centres.every(c => pcDist(c.cents, t.cents) >= 150)) centres.push(t);
          }
          for (const t of order) {                       // else an octave
            if (centres.length >= k) break;
            if (centres.every(c => Math.abs(c.cents - t.cents) >= 150)) centres.push(t);
          }
          centres.sort((a, b) => a.cents - b.cents);
          const count = Math.round(this._rnd(16, 24));
          const sp = this.preset.clusterSpread || [80, 200];
          const spread = Math.round(this._rnd(sp[0], sp[1]));
          const dur = Math.round(this._rnd(30, 45));
          return {
            opts: { freqs: centres.map(c => c.freq), count, spread, dur }, dur,
            text: 'EVT ' + label + ' n' + count + ' ±' + spread + '¢ ' + dur + 's ' + centres.map(c => this._noteName(c.freq)).join('/'),
          };
        }
        case 'ping': {
          const pool = this._tones(600, 2200, false);
          const n = Math.min(pool.length, 3 + Math.floor(this._rand() * 3));
          const ts = this._pickTones(pool, n, 2.5);
          if (this._rand() < 0.6) ts.sort((a, b) => a.cents - b.cents);
          const spacing = r1(this._rnd(0.12, 0.3) * 100) / 100;
          return {
            opts: { freqs: ts.map(t => t.freq), spacing }, dur: n * spacing + 5,
            text: 'EVT ' + label + ' n' + n + ' ' + ts.map(t => this._noteName(t.freq)).join(' '),
          };
        }
        case 'sh': {
          const pool = this._tones(220, 1200, false);
          const n = Math.min(pool.length, 6 + Math.floor(this._rand() * 5));
          const ts = this._pickTones(pool, n, 1.8);
          const rate = r1(this._rnd(5, 9));
          const steps = 10 + Math.floor(this._rand() * 11);
          return {
            opts: { freqs: ts.map(t => t.freq), rate, steps }, dur: steps / rate + 2,
            text: 'EVT ' + label + ' ' + steps + 'st ' + rate.toFixed(1) + 'Hz n' + ts.length,
          };
        }
        case 'sweep': {
          const all = this._tones(150, 4000, true);
          let from = all.length ? this._pick(all).freq : 300;
          const far = all.filter(t => Math.abs(hzToCents(t.freq) - hzToCents(from)) >= 700);
          let to = far.length ? this._pick(far).freq : from * 4;
          if (to > 4000) to = from / 4 >= 150 ? from / 4 : 3200;
          if (this._rand() < 0.5) { const x = from; from = to; to = x; }
          const dur = r1(this._rnd(6, 16));
          const res = Math.round(this._rnd(0.75, 0.9) * 100) / 100;
          return {
            opts: { from, to, dur, res }, dur,
            text: 'EVT ' + label + ' ' + Math.round(from) + '→' + Math.round(to) + 'Hz ' + dur.toFixed(1) + 's RES' + res.toFixed(2).slice(1),
          };
        }
        case 'reverse': {
          const n = this.scale.steps.length;
          const degs = this.chord.degrees.slice().sort((a, b) => a - b);
          const fs = [];
          let oct = 0;
          while (fs.length < Math.min(4, degs.length + 1) && oct < 3) {
            for (const d of degs) {
              const f = this.pitchFreq(d, oct);
              if (f >= 130 && f <= 700 && fs.length < 4 && fs.every(x => Math.abs(hzToCents(x) - hzToCents(f)) > 50)) fs.push(f);
            }
            oct++;
          }
          if (!fs.length) fs.push(this.pitchFreq(0, 1));
          fs.sort((a, b) => a - b);
          void n;
          const dur = r1(this._rnd(4, 7));
          return { opts: { freqs: fs, dur }, dur, text: 'EVT ' + label + ' ' + fs.length + 'v ' + dur.toFixed(1) + 's ' + this.chord.label };
        }
        case 'capture': {
          const dur = Math.round(this._rnd(12, 22));
          return { opts: { dur }, dur: dur + 6, text: 'EVT ' + label + ' ' + dur + 's FB.93' };
        }
        case 'ring': {
          const pool = this._tones(200, 520, true);
          const freq = pool.length ? this._pick(pool).freq : this.pitchFreq(0, 1);
          const ratio = this._pick([1.414, 1.618, 2.414, 2.718, 3.14]);   // metallic, no sub-bass difference tones
          const dur = r1(this._rnd(6, 10));
          return {
            opts: { freq, mod: freq * ratio, dur }, dur,
            text: 'EVT ' + label + ' ' + Math.round(freq) + 'Hz×' + ratio.toFixed(2) + ' ' + dur.toFixed(1) + 's',
          };
        }
      }
      return { opts: {}, dur: 8, text: 'EVT ' + label };
    }

    // ---------------------------------------------------------------- phrase (Hassell)
    /**
     * A breath-voice phrase: 3–7 notes, mostly stepwise around a chord-tone anchor, one of four
     * contours (fall / arch / call / hover), long final note on a chord tone, scoops into every
     * note, occasional upper-neighbour grace notes, rests, and one microtonal (±50¢) neighbour.
     */
    _buildPhrase(t0) {
      let tones = this._tones(140, 520, false);
      if (tones.length < 4) tones = this._tones(120, 600, false);
      if (!tones.length) tones = [{ freq: 220, cents: hzToCents(220), chord: true }];
      const L = tones.length;
      const chordIdx = [];
      tones.forEach((t, i) => { if (t.chord) chordIdx.push(i); });
      if (!chordIdx.length) chordIdx.push(Math.floor(L / 2));
      const mid = chordIdx.filter(i => tones[i].freq >= 180 && tones[i].freq <= 400);
      const anchorPool = mid.length ? mid : chordIdx;
      const a = anchorPool[Math.floor(this._rand() * anchorPool.length)];
      const N = [3, 4, 5, 6, 7][this._pickWeighted([3, 4, 5, 6, 7], [1, 3, 3, 2, 1])];
      const shapes = ['fall', 'arch', 'call', 'hover'];
      const shape = shapes[this._pickWeighted(shapes, [3, 3, 2, 2])];
      const h = 2 + Math.floor(this._rand() * 3);
      const pos = [];
      for (let i = 0; i < N; i++) {
        const t = N > 1 ? i / (N - 1) : 0;
        let p;
        if (shape === 'fall') p = a + Math.round((1 - t) * h);
        else if (shape === 'arch') p = a - (i === 0 ? 1 : 0) + Math.round(Math.sin(Math.PI * t) * Math.min(h, 3));
        else if (shape === 'call') p = i === 0 ? a : a + Math.round(h + 1 - (i - 1) * (h + 1) / Math.max(1, N - 2));
        else p = a + [0, 1, 0, -1, 0, 1, -1][i];
        if (i > 0 && i < N - 1 && this._rand() < 0.15) p += this._rand() < 0.5 ? 1 : -1;
        pos.push(clamp(p, 0, L - 1));
      }
      // resolve: final on the chord tone nearest to where the line is (prefer below / the anchor)
      let fin = chordIdx[0], fd = Infinity;
      for (const ci of chordIdx) {
        const d = Math.abs(ci - pos[N - 1]) + (ci > pos[N - 1] ? 0.3 : 0) + (ci === a ? -0.2 : 0);
        if (d < fd) { fd = d; fin = ci; }
      }
      pos[N - 1] = fin;
      if (N >= 2 && Math.abs(pos[N - 2] - fin) > 2) pos[N - 2] = clamp(fin + (pos[N - 2] > fin ? 1 : -1), 0, L - 1);
      for (let i = 1; i < N - 1; i++) {
        if (pos[i] === pos[i - 1]) {
          let q = pos[i] + (this._rand() < 0.5 ? 1 : -1);
          if (q < 0 || q >= L || q === pos[i + 1]) q = pos[i] + (q > pos[i] ? -1 : 1);
          pos[i] = clamp(q, 0, L - 1);
        }
      }
      // microtonal neighbour: one inner note bent ±50¢ (even in 12-TET scales)
      const microAt = N >= 4 && this._rand() < 0.35 ? 1 + Math.floor(this._rand() * (N - 2)) : -1;
      const microSign = this._rand() < 0.5 ? -1 : 1;
      const pan = this._rnd(-0.25, 0.25);
      const notes = [];
      let t = t0;
      let maxScoop = 0, graces = 0;
      for (let i = 0; i < N; i++) {
        const last = i === N - 1;
        let freq = tones[pos[i]].freq;
        let dur;
        if (last) dur = this._rnd(3.5, 6);
        else if (i === microAt) dur = this._rnd(0.6, 1.0);
        else if (i === 0 && this._rand() < 0.4) dur = this._rnd(2, 3.5);
        else dur = [0.8, 1.2, 1.6, 2.2, 3.0][this._pickWeighted([0, 1, 2, 3, 4], [2, 3, 3, 2, 1])] * this._rnd(0.9, 1.1);
        if (i === microAt) freq *= Math.pow(2, microSign * 50 / 1200);
        const scoop = Math.round(i === 0 ? this._rnd(120, 200) : last ? this._rnd(80, 160) : this._rnd(60, 140));
        maxScoop = Math.max(maxScoop, scoop);
        if (i > 0 && !last && i !== microAt && this._rand() < 0.22 && pos[i] + 1 < L) {
          const gdur = this._rnd(0.16, 0.28);
          notes.push({ time: t, freq: tones[pos[i] + 1].freq, dur: gdur, vel: 0.3, scoop: 30, grace: true });
          t += gdur * 0.8;
          graces++;
        }
        const vel = clamp(0.36 + 0.13 * Math.sin(Math.PI * (N > 1 ? i / (N - 1) : 0.5)) + this._rnd(-0.04, 0.04), 0.3, 0.7);
        notes.push({ time: t, freq, dur, vel, scoop, micro: i === microAt });
        t += dur * this._rnd(0.85, 0.98);
        if (!last && this._rand() < 0.25) t += this._rnd(0.3, 1.4);
      }
      const total = notes.reduce((m, n) => Math.max(m, n.time + n.dur), t0) - t0 + 2.5;   // + release tail
      return { notes, dur: total, pan, shape, maxScoop, graces, micro: microAt >= 0 ? microSign * 50 : 0, n: N };
    }

    _playPhrase(t0) {
      const ph = this._buildPhrase(t0);
      const tone = this._effective('tone', this._now());
      for (const n of ph.notes) {
        this._eng('playNote', {
          voice: 'breath', freq: n.freq, time: n.time, velocity: n.vel, duration: n.dur,
          pan: clamp(ph.pan + this._rnd(-0.06, 0.06), -1, 1), brightness: clamp01(0.35 + tone * 0.3 + this._rnd(-0.05, 0.05)),
          scoop: n.scoop, harm: true,
        });
      }
      this._boost = { amt: 0.15, t0: t0, t1: t0 + ph.dur };
      let text = 'EVT PHRASE ' + ph.n + 'n SCOOP ' + ph.maxScoop + '¢';
      if (ph.micro) text += ' ' + (ph.micro > 0 ? '+' : MINUS) + '50¢';
      if (ph.graces) text += ' GR' + ph.graces;
      return {
        dur: ph.dur, text, opts: { shape: ph.shape },
        notes: ph.notes.map(n => ({ time: n.time, freq: n.freq, dur: n.dur })),
      };
    }

    // ---------------------------------------------------------------- daisy (HAL 9000, 1892 song)
    _buildDaisy(t0) {
      let tonic = C3_HZ * Math.pow(2, this.root / 12);
      while (tonic < 196) tonic *= 2;
      while (tonic >= 392) tonic /= 2;
      const notes = [];
      let beat = 0, t = t0;
      for (let i = 0; i < DAISY.length; i++) {
        const [semi, beats] = DAISY[i];
        const pm = (beat + beats / 2) / DAISY_BEATS;           // progress at note middle
        let bpm = 70 - 30 * Math.pow(pm, 1.5);                 // ♩≈70 → 40 …
        const tail = i - (DAISY.length - 4);
        if (tail > 0) bpm *= 1 - 0.1 * tail;                   // … → ~29 over the last notes
        const spb = 60 / bpm;
        const sag = -150 * Math.pow(pm, 1.6);                  // pitch sags up to −150¢
        const freq = tonic * Math.pow(2, (semi * 100 + sag) / 1200);
        const len = beats * spb;
        const dur = len * (i === DAISY.length - 1 ? 1.1 : 0.94);
        notes.push({ time: t, freq, dur, vel: lerp(0.42, 0.28, pm), bright: lerp(0.45, 0.05, pm), sag });
        t += len;
        if (i === 9) t += 0.35;                                // breath between the two phrases
        beat += beats;
      }
      return { notes, dur: t - t0 + 3, tonic };
    }

    _playDaisy(t0) {
      const d = this._buildDaisy(t0);
      const f = centsToHz(this._voiceBass(this.root * 100));   // nearest root to the current bass
      this._eng('setDrone', { freqs: [f, f * 1.5, f * 2], glide: 6 });
      this._daisy = { until: t0 + d.dur };
      for (const n of d.notes) {
        this._eng('playNote', { voice: 'sine', freq: n.freq, time: n.time, velocity: n.vel, duration: n.dur, pan: 0, brightness: n.bright });
      }
      return { dur: d.dur, text: 'EVT DAISY 1892', opts: { tonic: d.tonic }, notes: d.notes.map(n => ({ time: n.time, freq: n.freq, dur: n.dur })) };
    }

    // ---------------------------------------------------------------- slow tasks
    _slow(now) {
      if (this._lastSlowNow !== undefined && now - this._lastSlowNow > 30) {
        if (this._auto) {
          if (this._autoNext < now) this._autoNext = now + this._rnd(3, 8);
          if (this._chordNext < now) this._chordNext = now + this._chordInterval();
        }
      }
      this._lastSlowNow = now;

      if (this._retune.length) {
        let changed = false;
        const keep = [];
        for (const q of this._retune) {
          if (q.at <= now) { if (this._applyRetune(q)) changed = true; } else keep.push(q);
        }
        this._retune = keep;
        if (changed) { this._touchRings(); this._emit('rings', { reason: 'retune' }); }
      }

      this._flushLogs(now);

      this._slowRest(now);

      if (this._daisy && now >= this._daisy.until) {
        this._daisy = null;
        this._applyDrone(10);
        if (this._auto && this._chordNext < now + 20) this._chordNext = now + 20;
      }

      if (this._sleep && !this._slowSleep(now)) return;

      this._scheduleEvents(now);

      if (this._auto) {
        const si = this._sleepInfo(now);
        const ease = si ? si.ease : 0;
        if (now >= this._chordNext && now < this._evt.lastEnd) this._chordNext = this._evt.lastEnd + this._rnd(2, 6);
        if (now >= this._chordNext) {
          this._chordNext = now + this._chordInterval();
          if (ease < 0.2 && !this._daisy) this._setChord(this.chordIndex + 1);
        }
        if (now >= this._rootNext) {
          if (ease === 0) this._rootWander(now); else this._rootNext = now + 600;
        }
      }
      if (this._auto && now >= this._autoNext) {
        this._autoStep(now);
        const d = clamp01(this.user.drift);
        this._autoNext = now + clamp(lerp(20, 6, d) * this._rnd(0.8, 1.2), 6, 20);
      }

      if (now - this._lastDriftApply >= 0.95 || now < this._lastDriftApply) {
        this._lastDriftApply = now;
        for (const name of SEND_LIVE) {
          const v = this._effective(name, now);
          if (this._sent[name] === undefined || Math.abs(v - this._sent[name]) > 0.002) {
            this._sent[name] = v;
            this._eng('setParam', name, v, 2);
            this._paramsDirty = true;
          }
        }
      }

      if (this._paramsDirty && (now - this._lastParamsEmit >= 0.5 || now < this._lastParamsEmit)) {
        this._lastParamsEmit = now;
        this._paramsDirty = false;
        this._emit('params', this._effectiveParams(now));
      }
    }

    // ---------------------------------------------------------------- space (Eno): drone rests, thinning, tacets
    _slowRest(now) {
      if (this._rest && now > this._rest.t2 + 20) {
        this._rest = null;
        if (this._auto) this._restNext = now + this._rnd(180, 480);
      }
      if (this._tacet && now > this._tacet.t1 + 3) this._tacet = null;
      if (this._tacet && !this._tacet.logged && now >= this._tacet.t0 - 2.5) {
        this._tacet.logged = true;
        this._log('trk', 'TACET ' + (this._tacet.t1 - this._tacet.t0).toFixed(1) + 's');
      }
      if (!this._auto || this._sleep || this._daisy || this._rest || now < this._restNext) return;
      const hold = this._rnd(30, 90);
      this._rest = { t0: now, t2: now + 20 + hold };
      this._log('sys', 'DRN REST ' + Math.round(hold) + 's');
      if (this._rand() < 0.5) this._autoThin(now, 20 + hold);
      if (this._rand() < 0.65) {
        const len = this._rnd(2, 6);
        const t0 = now + 20 + this._rnd(3, Math.max(4, hold - len - 2));
        this._tacet = { t0, t1: t0 + len, logged: false };
      }
    }

    /** leave only 1–2 tracks playing for a while; the others return one by one */
    _autoThin(now, dur) {
      const live = this.rings.filter(r => !r.muted && r.notes.length);
      const keepN = this._rand() < 0.5 ? 1 : 2;
      if (live.length <= keepN) return;
      const keep = new Set();
      while (keep.size < keepN) keep.add(this._pick(live));
      let n = 0;
      for (const r of live) {
        if (keep.has(r)) continue;
        r.muted = true; r.autoMuted = true; r.unmuteAt = now + dur + this._rnd(0, 15); n++;
      }
      this._touchRings();
      this._emit('rings', { reason: 'auto-thin' });
      this._log('trk', 'TRK THIN ' + keepN + '/5 ' + Math.round(dur) + 's');
      void n;
    }

    _rootWander(now) {
      const d = clamp01(this.user.drift);
      if (d <= 0.6) { this._rootNext = now + 60; return; }
      this._rootNext = now + this._rnd(600, 900);
      const up = this._rand() < 0.5 ? 5 : 7;
      const from = this._rootName(this.root);
      this._changeKey(this.scaleId, this.root + up, 20, 20);
      this._log('chd', 'ROOT ' + from + '→' + this._rootName(this.root) + ' +P' + (up === 7 ? 5 : 4));
    }

    // ---------------------------------------------------------------- auto / self-play
    setAuto(on) {
      on = !!on;
      if (on === this._auto) return;
      const now = this._now();
      this._auto = on;
      if (on) {
        this._autoOnT = now;
        this._restNext = now + this._rnd(180, 480);
        this._autoNext = now + this._rnd(4, 8);
        this._chordNext = now + this._chordInterval();
        this._rootNext = now + this._rnd(600, 900);
      } else {
        this._autoOffT = now;
        this._autoNext = Infinity; this._chordNext = Infinity; this._rootNext = Infinity; this._restNext = Infinity;
        if (this._rest) this._rest.t2 = Math.min(this._rest.t2, now);
        let changed = false;
        for (const r of this.rings) if (r.autoMuted) { r.muted = false; r.autoMuted = false; changed = true; }
        if (changed) { this._touchRings(); this._emit('rings', { reason: 'unmute' }); }
      }
      this._paramsDirty = true;
      this._emit('auto', { on });
      this._log('sys', 'AUTO ' + (on ? 'ON' : 'OFF'));
    }

    get auto() { return this._auto; }
    set auto(v) { this.setAuto(v); }

    _densityTarget(now) {
      const base = Math.round(3 + clamp01(this.user.density) * 19);
      const si = this._sleepInfo(now);
      if (si && base > 3) return Math.round(base + (3 - base) * si.ease);
      return base;
    }

    _autoStep(now) {
      for (const r of this.rings) {
        if (r.autoMuted && now >= r.unmuteAt) {
          r.muted = false; r.autoMuted = false;
          this._touchRings(); this._emit('rings', { reason: 'unmute', ringId: r.id });
          this._log('trk', this._ringNo(r) + ' UNMUTE');
          return;
        }
      }
      const total = this._totalNotes();
      const target = this._densityTarget(now);
      const deficit = target - total;
      const audible = this.rings.filter(r => !r.muted);
      const autoMutedCount = this.rings.filter(r => r.autoMuted).length;
      const canAdd = audible.some(r => r.notes.length < this._ringCap(r));
      const d = clamp01(this.user.drift);

      const acts = ['add', 'remove', 'repitch', 'mute', 'unmute', 'octave', 'perc', 'thin'];
      const w = [
        !canAdd || deficit < -1 ? 0 : deficit > 0 ? 1 + 0.6 * deficit : deficit === 0 ? 0.5 : 0.12,
        total <= 3 ? 0 : deficit < 0 ? 1 + 0.7 * -deficit : deficit === 0 ? 0.35 : 0.1,
        total > 0 ? 0.9 : 0,
        (audible.length >= 4 && autoMutedCount < 2 && !this._sleep) ? 0.15 + 0.3 * d : 0,
        autoMutedCount > 0 ? 0.25 : 0,
        0.1,
        this.perc.on && !this._sleep ? 0.06 : 0,
        (audible.length >= 3 && autoMutedCount === 0 && !this._sleep) ? 0.05 : 0,
      ];
      const i = this._pickWeighted(acts, w);
      if (i < 0) return;
      switch (acts[i]) {
        case 'add': this._autoAdd(now, target); break;
        case 'remove': this._autoRemove(now); break;
        case 'repitch': this._autoRepitch(now); break;
        case 'mute': this._autoMute(now); break;
        case 'unmute': this._autoUnmute(); break;
        case 'octave': this._autoOctave(); break;
        case 'perc': this._autoPerc(); break;
        case 'thin': this._autoThin(now, this._rnd(30, 75)); break;
      }
    }

    _autoAdd(now, target) {
      const share = target / this.rings.length;
      const rs = this.rings;
      const ws = rs.map(r => {
        if (r.muted || r.notes.length >= this._ringCap(r)) return 0;
        const w = Math.max(0.25, share - r.notes.length + 1.5);
        return r.voice === 'breath' ? w * 0.3 : w;
      });
      const i = this._pickWeighted(rs, ws);
      if (i < 0) return;
      const r = rs[i];
      let best = null, bd = -1;
      for (let k = 0; k < 12; k++) {
        const ph = this._rand();
        if (!this._validPhase(r, ph)) continue;
        let md = 1;
        for (const x of r.notes) { const dd = Math.abs(x.phase - ph); md = Math.min(md, dd, 1 - dd); }
        const sc = md + this._rand() * 0.08;
        if (sc > bd) { bd = sc; best = ph; }
      }
      if (best === null) return;
      const p = this._pickPitch(r, best);
      const classes = this._chordClasses();
      const vel = clamp(this._rnd(0.4, 0.68) + (classes.has(p.degree) ? 0.05 : 0), 0.2, 0.8);
      r.notes.push(this._newNoteFrom(p, best, vel));
      this._touchRings();
      this._emit('rings', { reason: 'auto-add', ringId: r.id });
      this._log('trk', this._ringNo(r) + ' +' + this._noteName(p.freq) + ' ' + ph2(best));
    }

    _autoRemove(now) {
      const rs = this.rings;
      const ws = rs.map(r => r.notes.length ? Math.pow(r.notes.length, 1.5) - 0.3 : 0);
      const i = this._pickWeighted(rs, ws);
      if (i < 0) return;
      const r = rs[i];
      const nw = r.notes.map(x => 1 + Math.min(Math.max(now - x.born, 0) / 120, 3));
      const j = this._pickWeighted(r.notes, nw);
      if (j < 0) return;
      const nt = r.notes[j];
      r.notes.splice(j, 1);
      this._retune = this._retune.filter(q => q.noteId !== nt.id);
      this._touchRings();
      this._emit('rings', { reason: 'auto-remove', ringId: r.id });
      this._log('trk', this._ringNo(r) + ' ' + MINUS + this._noteName(nt.freq) + ' ' + ph2(nt.phase));
    }

    _autoRepitch(now) {
      const rs = this.rings;
      const ws = rs.map(r => r.notes.length);
      const i = this._pickWeighted(rs, ws);
      if (i < 0) return;
      const r = rs[i];
      const nt = r.notes[Math.floor(this._rand() * r.notes.length)];
      const n = this.scale.steps.length;
      const p = this._pickPitch(r, nt.phase, { exclude: nt, near: nt.octave * n + nt.degree });
      if (!p || (p.degree === nt.degree && p.octave === nt.octave)) return;
      const from = this._noteName(nt.freq);
      nt.degree = p.degree; nt.octave = p.octave; nt.cents = p.cents; nt.freq = p.freq;
      this._retune = this._retune.filter(q => q.noteId !== nt.id);
      this._touchRings();
      this._emit('rings', { reason: 'auto-repitch', ringId: r.id });
      this._log('trk', this._ringNo(r) + ' ' + from + '→' + this._noteName(p.freq) + ' ' + ph2(nt.phase));
    }

    _autoMute(now) {
      const audible = this.rings.filter(r => !r.muted);
      if (audible.length < 4) return;
      const ws = audible.map(r => (r.notes.length ? 1 : 0.2));
      const j = this._pickWeighted(audible, ws);
      if (j < 0) return;
      const r = audible[j];
      const dur = this._rnd(90, 300);
      r.muted = true; r.autoMuted = true; r.unmuteAt = now + dur;
      this._touchRings();
      this._emit('rings', { reason: 'auto-mute', ringId: r.id });
      this._log('trk', this._ringNo(r) + ' MUTE ' + Math.round(dur) + 's');
    }

    _autoUnmute() {
      const ms = this.rings.filter(r => r.autoMuted);
      if (!ms.length) return;
      const r = ms[Math.floor(this._rand() * ms.length)];
      r.muted = false; r.autoMuted = false;
      this._touchRings();
      this._emit('rings', { reason: 'auto-unmute', ringId: r.id });
      this._log('trk', this._ringNo(r) + ' UNMUTE');
    }

    _autoOctave() {
      const r = this.rings[Math.floor(this._rand() * this.rings.length)];
      const opts = [];
      const [lo, hi] = r.octaves, [blo, bhi] = r.baseOctaves;
      const fits = (a, b) => this._candidates({ octaves: [a, b], voice: r.voice }, 0).length > 0;
      if (lo > blo - 1 && fits(lo - 1, hi)) opts.push([lo - 1, hi]);
      if (hi < bhi + 1 && fits(lo, hi + 1)) opts.push([lo, hi + 1]);
      const inRange = (a, b) => r.notes.every(x => x.octave >= a && x.octave <= b);
      if (hi - lo >= 1 && inRange(lo + 1, hi)) opts.push([lo + 1, hi]);
      if (hi - lo >= 1 && inRange(lo, hi - 1)) opts.push([lo, hi - 1]);
      if (!opts.length) return;
      const o = opts[Math.floor(this._rand() * opts.length)];
      r.octaves = [o[0], o[1]];
      this._touchRings();
      this._emit('rings', { reason: 'auto-octave', ringId: r.id });
      this._log('trk', this._ringNo(r) + ' OCT ' + (3 + o[0]) + '-' + (3 + o[1] + 1));
    }

    /** rare, gentle sequencer edits (shaker/rim only; the membrane is the pulse) */
    _autoPerc() {
      const tr = this._rand() < 0.6 ? 's' : 'r';
      const T = this.perc[tr];
      const base = this.preset.perc[tr];
      const what = this._pickWeighted(['rot', 'prob', 'pulses', 'rest'], [3, 2, 1, tr === 's' ? 2 : 0]);
      let text = null;
      if (what === 3) {
        const bars = 16 + Math.floor(this._rand() * 17);
        const k = this._percNext ? this._percNext.k : 0;
        this._percMute.s = k + bars * 16;
        text = 'REST ' + bars + 'br';
      } else if (what === 0 && T.pulses > 0) {
        const nr = mod(T.rot + (this._rand() < 0.5 ? 1 : -1), T.steps);
        text = 'ROT ' + T.rot + '→' + nr; T.rot = nr;
      } else if (what === 1) {
        const np = Math.round(clamp(T.prob + (this._rand() < 0.5 ? 0.1 : -0.1), 0.1, Math.min(0.95, base.prob + 0.1)) * 100) / 100;
        if (np !== T.prob) { text = 'PROB ' + Math.round(T.prob * 100) + '→' + Math.round(np * 100) + '%'; T.prob = np; }
      } else {
        const lo = Math.max(0, base.pulses - 1), hi = Math.min(T.steps, base.pulses + 1);
        const np = clamp(T.pulses + (this._rand() < 0.5 ? 1 : -1), lo, hi);
        if (np !== T.pulses) { text = 'E(' + T.pulses + ',' + T.steps + ')→E(' + np + ',' + T.steps + ')'; T.pulses = np; }
      }
      if (text) {
        this._emit('percConfig', this._percSnap());
        this._log('prc', 'PRC ' + tr.toUpperCase() + ' ' + text);
      }
    }

    // ---------------------------------------------------------------- sleep timer
    setSleepTimer(minutes) {
      const m = num(minutes, 0);
      const now = this._now();
      if (!(m > 0)) {
        if (this._sleep) {
          this._sleep = null;
          if (this.running) this._eng('setSleepGain', 1, 2);
          this._lastDriftApply = -Infinity;
          this._paramsDirty = true;
          this._emit('sleep', { remaining: null });
          this._log('sys', 'SLP OFF');
        }
        return;
      }
      const total = m * 60;
      this._sleep = {
        start: now, total,
        fadeWin: Math.min(600, total * 0.5),
        gainWin: Math.min(180, total * 0.5),
        lastGain: -Infinity, lastEmit: -Infinity, thinNext: 0, gainSent: 1,
        logged: {},
      };
      this._lastDriftApply = -Infinity;
      this._paramsDirty = true;
      this._emit('sleep', { remaining: total });
      this._log('sys', 'SLP ' + Math.round(m) + 'm ARMED');
    }

    sleepRemaining() {
      if (!this._sleep) return null;
      return Math.max(0, this._sleep.total - (this._now() - this._sleep.start));
    }

    _slowSleep(now) {
      const s = this._sleep;
      const si = this._sleepInfo(now);
      if (si.rem <= 0) { this._endSleep(); return false; }
      const once = (key, text) => { if (!s.logged[key]) { s.logged[key] = true; this._log('sys', text); } };
      if (si.ease > 0) once('thin', 'SLP T' + MINUS + Math.round(s.fadeWin / 60) + 'm THIN');
      if (this.perc.on && this._percGain(now) <= 0.02) once('perc', 'SLP PRC 0');
      if (si.rem < 180) once('evt', 'SLP EVT HOLD');
      if (si.rem < s.gainWin && now - s.lastGain >= 0.95) {
        once('vca', 'SLP VCA FADE ' + Math.round(s.gainWin) + 's');
        s.lastGain = now;
        const x = clamp01(1 - si.rem / s.gainWin);
        const g = Math.pow(1 - x, 2);
        s.gainSent = g;
        this._eng('setSleepGain', g, 1.5);
      }
      if (now - s.lastEmit >= 0.95) {
        s.lastEmit = now;
        this._emit('sleep', { remaining: si.rem });
      }
      if (si.ease > 0 && now >= s.thinNext && this._totalNotes() > this._densityTarget(now)) {
        this._autoRemove(now);
        s.thinNext = now + this._rnd(3, 6);
      }
      return true;
    }

    _endSleep() {
      this._sleep = null;
      this._eng('setSleepGain', 0, 0.3);
      this._log('sys', 'SLP END');
      this.stop();
      this._emit('sleep', { remaining: 0 });
      this._emit('sleepEnded', {});
      this._eng('suspend');
    }

    // ---------------------------------------------------------------- ribbon
    _ribbonCount() { return Math.round(2.5 * this.scale.steps.length) + 1; }

    ribbonPitch(x01) {
      const n = this.scale.steps.length;
      const count = this._ribbonCount();
      const x = clamp01(num(x01, 0));
      const index = clamp(Math.floor(x * count), 0, count - 1);
      const degree = index % n, octave = Math.floor(index / n);
      return { freq: this.pitchFreq(degree, octave), index, degree, octave, count };
    }

    ribbonPluck(x01, velocity) {
      const p = this.ribbonPitch(x01);
      const v = clamp01(num(velocity, 0.7));
      const now = this._now();
      const time = now + 0.005;
      const pan = clamp((clamp01(num(x01, 0.5)) - 0.5) * 1.2, -1, 1);
      const voice = normVoice(this.ribbonVoice) || 'sub';
      const o = { voice, freq: p.freq, time, velocity: v, duration: 3, pan, brightness: clamp01(this._effective('tone', now) + 0.1) };
      if (voice === 'breath') { o.scoop = 80; o.harm = true; }
      this._eng('playNote', o);
      this._emit('note', { source: 'ribbon', ringId: null, noteId: null, time, freq: p.freq, voice, velocity: v, pan });
      return p;
    }

    ribbonHold(x01) {
      let p = this.ribbonPitch(x01);
      const pan0 = clamp((clamp01(num(x01, 0.5)) - 0.5) * 1.2, -1, 1);

    const scope = { cv: null, g: null, d: 0, bufL: null, bufR: null };

    function sizeCanvas(cv) {

    function makeGlow() {

    function resizeStage() {

    function buildBackground() {
      bgLayer = document.createElement('canvas');

      if (!g || !g.scale) return;

      for (let i = 0; i < 63; i++) {
        const x = rnd() * G.w, y = rnd() * G.h, r = 0.3 + rnd() * 0.55, a = 0.08 + rnd() * 0.32;
        if (i < 3) { drifters.push({ x, y, r: r + 0.15, a: a + 0.08, vx: (rnd() - 0.5) * 0.5, vy: (rnd() - 0.5) * 0.25 }); continue; }
        g.globalAlpha = a; g.fillStyle = COL.ink; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();

      g.stroke();
      [0.5].forEach((r) => { g.beginPath(); g.arc(cx, cy, S2 * r, 0, TAU); g.stroke(); });

      g.strokeStyle = 'rgba(255,255,255,0.09)';
      g.beginPath();
      for (let k = 0; k < 72; k++) {

      }
      g.stroke();
    }

    function buildScope() {
      const d = Math.max(8, Math.ceil(G.scopeR * 2 * orr.dpr));
      if (!scope.cv) scope.cv = document.createElement('canvas');
      if (scope.cv.width !== d) { scope.cv.width = d; scope.cv.height = d; }
      scope.g = scope.cv.getContext('2d');
      scope.d = d;
    }

    function readScope() {
      const aL = engine.scopeL, aR = engine.scopeR || engine.scopeL;
      const pick = aL || engine.analyser;
      if (!pick || !S.started) return null;
      const right = aL ? aR : engine.analyser;
      const n = num(pick.fftSize, 2048);
      if (!scope.bufL || scope.bufL.length !== n) { scope.bufL = new Float32Array(n); scope.bufR = new Float32Array(n); }

    function notePos(i, ring, n) {

    function glyph(ctx, eng, x, y, s, a) {

    // ---- scheduled things -> visuals at their audio time ----
    const queue = [];

    function fireEvent(e) {

      const rnd = mulberry32((Math.random() * 1e9) | 0);

      if (name === 'ping') v.sp = Array.from({ length: 4 + Math.floor(rnd() * 3) }, (_, k) => ({ at: k * 0.18 + rnd() * 0.08, a: rnd() * TAU, r: 0.2 + rnd() * 0.28 }));

    function drawEvents(ctx) {
      const T = S.clock, cx = G.cx, cy = G.cy, s = G.size;
      for (let k = evts.length - 1; k >= 0; k--) {

          }

          default: break;
        }
      }

    }

    // drone: a breathing hairline circle between the scope and T1, ticks at its pitch classes
    function dronePCs() {
      const st = S.st || {};
      let fr = (st.drone && st.drone.freqs) || st.droneFreqs || S.droneF;
      if (Array.isArray(fr) && fr.length) return fr.filter((f) => f > 0).map((f) => ((1200 * Math.log2(f / 16.3516)) % 1200 + 1200) % 1200);
      const sc = SCALES.find((x) => x.id === st.scaleId), degs = st.chord && st.chord.degrees;
      if (!sc || !sc.steps.length || !Array.isArray(degs)) return [];

    }
    function drawDrone(ctx, dt) {
      const T = S.clock, cx = G.cx, cy = G.cy;
      const lvRaw = clamp(num(safe(() => engine.getLevel(), 0), 0) * 4, 0, 1);
      S.lv += (lvRaw - S.lv) * (1 - Math.exp(-dt * 1.5));
      const dl = clamp(num(call('getParam', 'drone'), 0.5), 0, 1);
      const amp = clamp(dl * 1.25, 0, 1) * (S.started ? 0.45 + 0.55 * S.lv : 0.5);
      const br = S.reduced ? 0.5 : 0.5 + 0.5 * Math.sin(T * TAU / 11);

      const pulse = S.drPulse; S.drPulse = Math.max(0, S.drPulse - dt / 2.5);
      ctx.strokeStyle = COL.ink;

      ctx.lineWidth = 0.75 + 1.6 * amp * (0.6 + 0.4 * br);

      ctx.lineWidth = 1;
      ctx.globalAlpha = clamp(0.3 + 0.5 * amp + 0.3 * pulse, 0, 1);

      if (S.chord) {
        ctx.globalAlpha = 0.55 + 0.4 * pulse; ctx.fillStyle = COL.dim;
        ctx.font = (G.font - 1) + 'px ' + FONT_MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillText(S.chord, cx, cy + G.size * 0.215 + G.font + 3);
      }
      ctx.globalAlpha = 1;
    }

    // track labels: drawn last, right-aligned column just left of the 12 o'clock index, on black plates
    function drawLabels(ctx) {
      const rings = S.rings, cx = G.cx, cy = G.cy, fs = G.font;
      ctx.font = fs + 'px ' + FONT_MONO; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
      for (let i = 0; i < 5; i++) {
        const ring = rings[i]; if (!ring) continue;
        const muted = !!ring.muted;
        const txt = 'T' + (i + 1) + ' ' + up(normEng(ring.voice)) + ' ' + num(+ring.period, 0).toFixed(1) + 's' + (muted ? ' M' : '');

    }

    function drawStage(dt) {
      const ctx = orr.ctx;
      if (!ctx || G.size < 40) return;
      const T = S.clock;
      ctx.setTransform(orr.dpr, 0, 0, orr.dpr, 0, 0);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, G.w, G.h);

      if (bgLayer) ctx.drawImage(bgLayer, 0, 0, G.w, G.h);
      if (!S.reduced) {
        ctx.fillStyle = COL.ink;
        for (const d of drifters) {
          d.x += d.vx * dt; d.y += d.vy * dt;
          if (d.x < 0) d.x += G.w; if (d.x > G.w) d.x -= G.w; if (d.y < 0) d.y += G.h; if (d.y > G.h) d.y -= G.h;
          ctx.globalAlpha = d.a; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      drawScope(ctx, dt);
      drawDrone(ctx, dt);

      // rings
      const rings = S.rings, cx = G.cx, cy = G.cy;
      ctx.lineWidth = G.hair;
      for (let i = 0; i < 5; i++) {
        const ring = rings[i], R = G.ringR[i], muted = !!(ring && ring.muted);
        ctx.strokeStyle = muted ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.22)';
        ctx.setLineDash(muted ? [2, 5] : []);
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = muted ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.26)';
        ctx.beginPath();
        for (let k = 1; k < 16; k++) {
          const a = (k / 16) * TAU - Math.PI / 2, len = (k % 4 === 0) ? 5 : 2.5, ca = Math.cos(a), sa = Math.sin(a);
          ctx.moveTo(cx + ca * R, cy + sa * R); ctx.lineTo(cx + ca * (R - len), cy + sa * (R - len));
        }
        ctx.stroke();
      }
      // 12 o'clock index
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.moveTo(cx, cy - G.ringR[0] + 4); ctx.lineTo(cx, cy - G.ringR[4] - 6); ctx.stroke();

      drawEvents(ctx);

      }
      ctx.globalAlpha = 1;

      // playheads
      const lat = outLatency(), tn = engineNow(), tv = tn > 0 ? Math.max(0, tn - lat) : 0;
      for (let i = 0; i < 5; i++) {
        const ring = rings[i]; if (!ring) continue;
        const p = clamp(num(safe(() => composer.ringPhase(ring.id, tv), 0), 0), 0, 1);
        const muted = !!ring.muted, R = G.ringR[i], a = p * TAU - Math.PI / 2;
        const base = muted ? 0.35 : 1;
        ctx.lineWidth = 1;
        ctx.strokeStyle = COL.ink;
        const seg = (18 * Math.PI / 180) / 6;
        for (let j = 0; j < 6; j++) {
          ctx.globalAlpha = base * 0.3 * Math.pow(1 - j / 6, 1.6);

        ctx.globalAlpha = muted ? 0.35 : 1; ctx.fillStyle = COL.red;

      }

      // notes
      const kOff = 1 - Math.exp(-dt * 8);
      ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        const ring = rings[i]; if (!ring) continue;
        const eng = normEng(ring.voice), muted = !!ring.muted;
        const notes = ring.notes || [];
        for (let q = 0; q < notes.length; q++) {
          const n = notes[q];
          let v = vis.get(n.id);
          if (!v) { v = { off: pitchOff(ring, n), born: T, i, phase: n.phase, size: 2.4 + 2.2 * clamp(num(+n.velocity, 0.6), 0, 1) }; vis.set(n.id, v); }
          v.off += (pitchOff(ring, n) - v.off) * kOff;
          const age = T - v.born, grow = age < 0.4 ? smooth(0, 1, age / 0.4) : 1;
          const p = ringPos(i, n.phase, v.off);
          let sz = v.size * grow, br = 0;
          const ft = fired.get(n.id);
          if (ft !== undefined) { const fk = (T - ft) / 1.6; if (fk >= 1) fired.delete(n.id); else br = (1 - fk) * (1 - fk); }
          if (br > 0) { sz *= 1 + 0.35 * br; drawGlow(ctx, p.x, p.y, v.size * (2.5 + 4 * br), 0.6 * br); }
          const a = muted ? 0.3 : 0.62 + 0.38 * br;
          ctx.globalAlpha = a; ctx.fillStyle = COL.ink; ctx.strokeStyle = COL.ink;
          glyph(ctx, eng, p.x, p.y, Math.max(0.5, sz), p.a);
        }

      for (let k = dying.length - 1; k >= 0; k--) {
        const d = dying[k], age = (T - d.t0) / 0.35;
        if (age >= 1) { dying.splice(k, 1); continue; }
        const p = ringPos(d.i, d.phase, d.off);
        ctx.globalAlpha = 0.8 * (1 - age); ctx.fillStyle = COL.ink; ctx.strokeStyle = COL.ink;
        glyph(ctx, d.eng, p.x, p.y, Math.max(0.3, d.size * (1 - age)), p.a);
      }
      ctx.globalAlpha = 1;
      drawLabels(ctx);
    }

    /* =====================================================================================
       4. hit-testing
       ===================================================================================== */
    function hitTest(x, y) {
      const dx = x - G.cx, dy = y - G.cy, dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= G.scopeR + 8) return { type: 'scope' };
      let best = null, bd = 15 * 15;
      for (let i = 0; i < S.rings.length && i < 5; i++) {
        const ring = S.rings[i]; if (!ring) continue;
        const notes = ring.notes || [];
        for (let q = 0; q < notes.length; q++) {
          const p = notePos(i, ring, notes[q]);
          const d2 = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
          if (d2 <= bd) { bd = d2; best = { type: 'note', i, ring, note: notes[q] }; }
        }
      }
      if (best) return best;
      let bi = -1, bdist = Math.max(9, G.size * 0.026);
      for (let i = 0; i < 5; i++) {
        const d = Math.abs(dist - G.ringR[i]);
        if (d <= bdist) { bdist = d; bi = i; }
      }
      if (bi >= 0 && S.rings[bi]) {
        const phase = ((Math.atan2(dx, -dy) / TAU) + 1) % 1;
        return { type: 'ring', i: bi, ring: S.rings[bi], phase };
      }
      return null;
    }
    function doNextChord() {

      pushRipple(G.cx, G.cy, G.scopeR, G.scopeR + 22, 2.4, 0.4);
      S.dirty = true;
    }
    orr.cv.addEventListener('pointerdown', (e) => {
      if (!S.started || S.night) return;
      e.preventDefault();
      const r = orr.cv.getBoundingClientRect();
      const sx = r.width ? G.w / r.width : 1, sy = r.height ? G.h / r.height : 1;
      const x = (e.clientX - r.left) * sx, y = (e.clientY - r.top) * sy;
      const hit = hitTest(x, y);
      if (!hit) return;
      if (hit.type === 'scope') { doNextChord(); return; }
      if (hit.type === 'note') { safe(() => composer.removeNote(hit.ring.id, hit.note.id)); S.dirty = true; return; }
      const n = safe(() => composer.addNote(hit.ring.id, hit.phase), null);
      if (n) {
        const p = ringPos(hit.i, hit.phase, 0);
        pushRipple(p.x, p.y, 3, 26, 2.4, 0.35);
        S.dirty = true;
      }
    });

    /* =====================================================================================
       5. ribbon
       ===================================================================================== */
    const rb = { cv: $('ribbon'), ctx: null, dpr: 1, w: 0, h: 0, map: null, pointers: new Map(), fades: [], flash: new Map(), readT: 0 };

        const p = safe(() => composer.ribbonPitch(x), null);
        if (!p || typeof p.index !== 'number') continue;
        if (p.index !== prev) { starts.push({ index: p.index, degree: p.degree, x0: x }); prev = p.index; }
      }
      if (!starts.length) { rb.map = null; return; }
      starts[0].x0 = 0;
      const steps = starts.map((s, i) => {
        const x1 = i + 1 < starts.length ? starts[i + 1].x0 : 1;
        return { index: s.index, c: (s.x0 + x1) / 2, tonic: s.degree === 0 };
      });
      rb.map = { steps, byIndex: new Map(steps.map((s) => [s.index, s])) };
    }

    }

    }
    function armDwell(p) {

        if (!rb.pointers.has(p.id) || p.hold) return;
        const hd = safe(() => composer.ribbonHold(p.x01), null);
        if (!hd) return;
        p.hold = hd;
        safe(() => hd.pressure(pressureOf(p.y01)));
      }, 300);
    }
    function endPointer(id) {

      clearTimeout(p.timer);
      if (p.hold) { const hd = p.hold; p.hold = null; safe(() => hd.release()); }
      rb.fades.push({ x01: p.x01, t0: S.clock });

    }

    rb.cv.addEventListener('pointerdown', (e) => {

      const p = { id: e.pointerId, x01: pt.x01, y01: pt.y01, idx: info ? info.index : -1, hold: null, timer: 0 };

      showRead(pt.x01);
      armDwell(p);
    });
    rb.cv.addEventListener('pointermove', (e) => {
      const p = rb.pointers.get(e.pointerId);
      if (!p) return;
      e.preventDefault();

      showRead(pt.x01);
      if (p.hold) { const hd = p.hold; safe(() => hd.move(pt.x01)); safe(() => hd.pressure(pressureOf(pt.y01))); return; }
      const info = pitchAt(pt.x01);
      if (!info || typeof info.index !== 'number' || info.index === p.idx) return;
      const from = p.idx, to = info.index, dir = to > from ? 1 : -1, list = [];
      if (from < 0) list.push({ x: pt.x01, idx: to });
      else for (let i = from + dir; i !== to + dir && list.length < 12; i += dir) {
        const st = rb.map && rb.map.byIndex.get(i);
        list.push({ x: i === to ? pt.x01 : (st ? st.c : pt.x01), idx: i });
      }
      list.slice(-6).forEach((it, k) => {
        if (k === 0) ribbonPluck(it.x, pt.y01, it.idx);
        else setTimeout(() => { if (S.started) ribbonPluck(it.x, pt.y01, it.idx); }, k * 40);
      });
      p.idx = to;
      armDwell(p);
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => {
      rb.cv.addEventListener(ev, (e) => endPointer(e.pointerId));
    });

    function drawRibbon() {
      const ctx = rb.ctx;
      if (!ctx || rb.w < 10) return;
      const w = rb.w, hh = rb.h, T = S.clock;
      ctx.setTransform(rb.dpr, 0, 0, rb.dpr, 0, 0);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, w, hh);
      const base = hh - 7, hair = rb.dpr >= 2 ? 0.75 : 1;
      ctx.lineWidth = hair;
      // baseline
      ctx.strokeStyle = 'rgba(255,255,255,0.11)';
      ctx.beginPath(); ctx.moveTo(0, base + 0.5); ctx.lineTo(w, base + 0.5); ctx.stroke();
      const list = rb.map ? rb.map.steps : Array.from({ length: 15 }, (_, i) => ({ index: i, c: (i + 0.5) / 15, tonic: i % 7 === 0 }));
      for (let i = 0; i < list.length; i++) {
        const s = list[i], x = Math.round(s.c * w) + 0.5;
        const ft = rb.flash.get(s.index);
        const f = ft !== undefined ? Math.max(0, 1 - (T - ft) / 0.9) : 0;
        if (ft !== undefined && f <= 0) rb.flash.delete(s.index);

        ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, base - len); ctx.stroke();
        if (f > 0) {
          ctx.globalAlpha = f; ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, base - len - 6 * f); ctx.stroke();
          ctx.lineWidth = hair; ctx.globalAlpha = 1;
        }
      }

      rb.pointers.forEach((p) => {
        const x = Math.round(p.x01 * w) + 0.5, y = clamp(p.y01 * hh, 4, hh - 4);
        ctx.strokeStyle = COL.ink; ctx.globalAlpha = p.hold ? 0.95 : 0.7; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, hh); ctx.stroke();
        if (p.hold) {
